<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OMSIM Live</title><style>body{margin:0;background:#11100f;color:#efe7d7;font-family:system-ui}main{max-width:1100px;margin:auto;padding:40px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card,pre{border:1px solid #3a342d;background:#1a1816;padding:18px}.card strong{display:block;font:700 32px Georgia;color:#d4a35a;margin-top:8px}.badge{float:right;border:1px solid #d4a35a;padding:10px;color:#d4a35a}pre{white-space:pre-wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><span id="badge" class="badge">Chargement</span><h1>Recherche OMSIM en direct</h1><p>Source principale : heartbeat brut du solver. L’API GitHub est facultative.</p><section class="grid"><div class="card">Étape<strong id="stage">—</strong></div><div class="card">Temps<strong id="elapsed">—</strong></div><div class="card">Profondeur<strong id="depth">—</strong></div><div class="card">États visités<strong id="visited">—</strong></div><div class="card">États développés<strong id="expanded">—</strong></div><div class="card">Score<strong id="score">—</strong></div></section><pre id="log">Connexion…</pre><p id="updated"></p></main><script>(()=>{const R='Fandalah-tech/opus-magnum-pattern-library',B='feature/disjoint-solver-readiness',q=id=>document.getElementById(id),fmt=v=>Number.isFinite(Number(v))?Number(v).toLocaleString('fr-CA'):'—',dur=s=>{s=Number(s);if(!Number.isFinite(s))return'—';const m=Math.floor(s/60),x=Math.floor(s%60);return`${m} min ${String(x).padStart(2,'0')} s`};async function refresh(){try{const u=`https://raw.githubusercontent.com/${R}/${encodeURIComponent(B)}/reports/live-search-status.json?t=${Date.now()}`,r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(`Heartbeat ${r.status}`);const v=await r.json(),d=Number(v.depth),m=Number(v.maxDepth),age=(Date.now()-new Date(v.updatedAt).getTime())/1000;q('stage').textContent=v.stage||'—';q('elapsed').textContent=dur(v.elapsedSeconds);q('depth').textContent=`${fmt(d)} / ${fmt(m)}`;q('visited').textContent=fmt(v.visitedStates);q('expanded').textContent=fmt(v.expandedStates);q('score').textContent=fmt(v.bestScore);q('badge').textContent=age>180?'Données anciennes':v.status==='running'?'En cours':'Arrêté';q('log').textContent=`Statut : ${v.status}\nFrontière : ${fmt(v.frontierSize)}\nMeilleur chemin : ${fmt(v.bestPathLength)} actions\nHeartbeat : ${dur(age)}`;q('updated').textContent=`Actualisé à ${new Date().toLocaleTimeString('fr-CA')}`}catch(e){q('badge').textContent='Indisponible';q('log').textContent=`Impossible de lire le heartbeat : ${e.message}`}}refresh();setInterval(refresh,15000)})();</script></body></html>
