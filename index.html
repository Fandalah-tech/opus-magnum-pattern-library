<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explorateur de concepts, patterns et implémentations pour Opus Magnum.">
  <title>Opus Magnus — Knowledge Explorer</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 3 57 17v30L32 61 7 47V17Z"/><circle cx="32" cy="32" r="10"/><path d="M32 13v9M32 42v9M13 32h9M42 32h9"/></svg><div><p class="eyebrow">OPUS MAGNUS RESEARCH</p><h1>Knowledge Explorer</h1></div></div>
    <div class="status"><span></span><strong id="pattern-count">0</strong> patterns · <strong id="concept-count">0</strong> concepts</div>
  </header>
  <nav class="mode-tabs" aria-label="Type de connaissance">
    <button class="mode-tab active" data-mode="patterns">Patterns</button>
    <button class="mode-tab" data-mode="concepts">Concepts</button>
    <button class="mode-tab" data-mode="graph">Relations</button>
  </nav>
  <main class="layout">
    <aside class="sidebar">
      <label class="search"><span>⌕</span><input id="search-input" type="search" placeholder="Rechercher…" autocomplete="off"></label>
      <section><h2>Catégories</h2><nav id="category-filters" class="filters"></nav></section>
      <section><h2>Objectif</h2><nav id="metric-filters" class="filters"></nav></section>
      <section class="project-note"><strong>Trois niveaux de connaissance</strong><p>Concept abstrait → pattern réutilisable → implémentation mesurée et vérifiable.</p></section>
    </aside>
    <section class="workspace">
      <div class="workspace-head"><div><p class="eyebrow" id="view-kicker">EXPLORATEUR</p><h2 id="view-title">Tous les patterns</h2></div><button id="reset-filters" class="ghost">Réinitialiser</button></div>
      <div id="pattern-grid" class="pattern-grid" aria-live="polite"></div>
      <div id="concept-grid" class="concept-grid" hidden></div>
      <div id="graph-view" class="graph-view" hidden></div>
      <div id="empty-state" class="empty" hidden><div>◇</div><h3>Aucun résultat</h3><p>Modifie les filtres ou le terme de recherche.</p></div>
    </section>
  </main>
  <dialog id="pattern-dialog"><button class="dialog-close" aria-label="Fermer">×</button><div id="pattern-detail"></div></dialog>
  <template id="pattern-card-template"><article class="pattern-card" tabindex="0"><div class="card-visual"></div><div class="card-body"><div class="card-kicker"></div><h3></h3><p class="card-summary"></p><div class="metric-row"></div><div class="tag-row"></div></div></article></template>
  <script src="data/patterns.js"></script>
  <script src="data/knowledge.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
