name: Blind GEN249 official collision cleanup

on:
  push:
    branches: [feature/critelli-2026-public-corpus]
    paths:
      - .github/workflows/heldout-oracle-collision-cleanup.yml
      - tools/run_holdout_oracle_collision_cleanup.py
      - reports/generated/heldout-24hour-seed/latest-adjacent-pair-artifact.json
      - packages/opus_analysis/**
      - packages/opus_engine/**
  workflow_dispatch:

concurrency:
  group: heldout-gen249-oracle-collision-cleanup-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  ADJACENT_POINTER: reports/generated/heldout-24hour-seed/latest-adjacent-pair-artifact.json
  RUN_POINTER: reports/generated/heldout-24hour-seed/latest-oracle-collision-cleanup-run.json
  LATEST_REPORT: reports/generated/heldout-24hour-seed/latest-oracle-collision-cleanup.json
  PUZZLE_ROOT: .datasets/heldout-oracle-collision-cleanup
  BASELINE_ROOT: .baseline/heldout-oracle-collision-cleanup
  REPORT_ROOT: reports/heldout-oracle-collision-cleanup
  OPUSSOLVER_COMMIT: fdedd3f01a238b941ceba8bace7ea35cbd3b8c41
  OMSIM_COMMIT: 758f4a4b4c9e24f50294801da774a0960c922bab

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Publish running pointer
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUN_POINTER']); p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps({
            'schemaVersion':'0.1.0','kind':'heldout-oracle-collision-cleanup-run-pointer',
            'runId':os.environ['GITHUB_RUN_ID'],'runNumber':os.environ['GITHUB_RUN_NUMBER'],
            'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'status':'in_progress',
            'sourceCommit':os.environ['GITHUB_SHA'],'targetSolutionBytesUsed':0,
          },indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RUN_POINTER"
          git commit -m "Record running blind official collision cleanup [skip ci]"
          git fetch origin feature/critelli-2026-public-corpus
          git rebase origin/feature/critelli-2026-public-corpus
          git push origin HEAD:feature/critelli-2026-public-corpus

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch GEN249 puzzle bytes only
        run: |
          mkdir -p .tools "$PUZZLE_ROOT"
          git clone --filter=blob:none --no-checkout https://github.com/gtw123/OpusSolver.git .tools/opussolver
          git -C .tools/opussolver sparse-checkout init --no-cone
          git -C .tools/opussolver sparse-checkout set test/puzzles/24hour-1-puzzles/GEN249.puzzle
          git -C .tools/opussolver checkout "$OPUSSOLVER_COMMIT"
          cp .tools/opussolver/test/puzzles/24hour-1-puzzles/GEN249.puzzle "$PUZZLE_ROOT"/
          if find .tools/opussolver -type f -name '*.solution' | grep -q .; then
            echo "Target solution bytes unexpectedly materialized" >&2
            exit 1
          fi

      - name: Restore target-free local product frontier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r artifact_id digest < <(python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads(Path(os.environ['ADJACENT_POINTER']).read_text()); assert p['targetSolutionBytesUsed']==0
          print(p['artifactId'],p['artifactSha256'])
          PY
          )
          mkdir -p "$BASELINE_ROOT"
          archive="$RUNNER_TEMP/adjacent.zip"
          curl --fail --location --retry 8 --retry-delay 2 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" -o "$archive"
          echo "$digest  $archive" | sha256sum --check
          unzip -q "$archive" -d "$BASELINE_ROOT"
          python - <<'PY'
          import json,os,shutil
          from pathlib import Path
          root=Path(os.environ['BASELINE_ROOT'])
          report=json.loads((root/'GEN249.json').read_text())
          candidates=[x for x in report.get('deliveryCandidates',[]) if int((x.get('localSummary') or {}).get('productDeliveredCount') or 0)>=1]
          assert candidates, report.get('deliveryCandidateCount')
          chosen=max(candidates,key=lambda item:int((item.get('omsim') or {}).get('collisionCycle') or 0))
          name=Path(chosen['solutionPath']).name
          matches=list(root.rglob(name)); assert len(matches)==1, matches
          shutil.copyfile(matches[0],root/'GEN249-local-product1.solution')
          (root/'selected.json').write_text(json.dumps({'chosen':chosen,'targetSolutionBytesUsed':0},indent=2)+'\n')
          PY

      - name: Build pinned OMSim
        run: |
          git clone https://github.com/ianh/omsim.git .tools/omsim
          git -C .tools/omsim checkout "$OMSIM_COMMIT"
          make -C .tools/omsim omsim
          test -x .tools/omsim/omsim

      - name: Synthesize one-time cleanup at official collision cell
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p "$REPORT_ROOT/search"
          python tools/run_holdout_oracle_collision_cleanup.py \
            --omsim .tools/omsim/omsim \
            --puzzle "$PUZZLE_ROOT/GEN249.puzzle" \
            --baseline "$BASELINE_ROOT/GEN249-local-product1.solution" \
            --output-dir "$REPORT_ROOT/search" \
            --output "$REPORT_ROOT/GEN249.json"

      - name: Persist compact cleanup checkpoint
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['REPORT_ROOT'])/'GEN249.json').read_text())
          payload={
            'schemaVersion':'0.1.0','kind':'heldout-oracle-collision-cleanup-checkpoint',
            'runId':os.environ['GITHUB_RUN_ID'],'sourceCommit':os.environ['GITHUB_SHA'],'targetSolutionBytesUsed':0,
            'adjacentRunId':json.loads(Path(os.environ['ADJACENT_POINTER']).read_text()).get('runId'),
            'selectedLocalDelivery':json.loads((Path(os.environ['BASELINE_ROOT'])/'selected.json').read_text()).get('chosen'),
            'baselineOMSim':r.get('baselineOMSim'),'diagnosis':r.get('diagnosis'),
            'generatedVariantCount':r.get('generatedVariantCount'),'searchedVariantCount':r.get('searchedVariantCount'),
            'acceptedProductOne':r.get('acceptedProductOne'),'acceptedSolution':r.get('acceptedSolution'),
            'acceptedOMSim':r.get('acceptedOMSim'),'topVariants':r.get('topVariants'),'omsimCommit':os.environ['OMSIM_COMMIT'],
          }
          out=Path(os.environ['LATEST_REPORT']); out.parent.mkdir(parents=True,exist_ok=True); out.write_text(json.dumps(payload,indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LATEST_REPORT"
          git commit -m "Update blind official collision cleanup checkpoint [skip ci]" || true
          git fetch origin feature/critelli-2026-public-corpus
          git rebase origin/feature/critelli-2026-public-corpus
          git push origin HEAD:feature/critelli-2026-public-corpus

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heldout-oracle-collision-cleanup-${{ github.run_id }}
          path: ${{ env.REPORT_ROOT }}/
          if-no-files-found: error
          retention-days: 14

      - name: Finalize pointer
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUN_POINTER'])
          if not p.exists(): raise SystemExit(0)
          d=json.loads(p.read_text()); d['status']='completed'; d['conclusion']=os.environ.get('JOB_STATUS'); p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RUN_POINTER"
          git commit -m "Finalize blind official collision cleanup [skip ci]" || true
          git fetch origin feature/critelli-2026-public-corpus
          git rebase origin/feature/critelli-2026-public-corpus
          git push origin HEAD:feature/critelli-2026-public-corpus
