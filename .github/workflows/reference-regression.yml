name: Validate private campaign references

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - packages/opus_parser/**
      - packages/opus_analysis/**
      - packages/opus_engine/**
      - services/validator/**
      - tools/run_reference_regression.py
      - fixtures/reference/campaign-p007-p015.manifest.json
      - .github/workflows/reference-regression.yml

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: opus-magnum-codex
  WORKLOAD_IDENTITY_PROVIDER: projects/740016697359/locations/global/workloadIdentityPools/github-actions/providers/opus-pattern-library
  DEPLOYER_SERVICE_ACCOUNT: opus-github-deployer@opus-magnum-codex.iam.gserviceaccount.com
  FIXTURE_BUCKET: gs://opus-magnum-codex-private-fixtures
  FIXTURE_OBJECT: campaign/p007-p015.zip
  VALIDATOR_URL: https://opus-validator-6gflgqb25q-nn.a.run.app

jobs:
  regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Download private fixtures
        run: |
          mkdir -p .private-fixtures reports
          gcloud storage cp \
            "${FIXTURE_BUCKET}/${FIXTURE_OBJECT}" \
            .private-fixtures/p007-p015.zip
          unzip -q .private-fixtures/p007-p015.zip -d .private-fixtures/files

      - name: Run unit tests
        run: |
          python -m unittest discover -s packages/opus_parser/tests -v
          python -m pytest tests/test_opus_engine.py tests/test_engine_comparison.py -q

      - name: Run campaign regression
        run: |
          python tools/run_reference_regression.py \
            --manifest fixtures/reference/campaign-p007-p015.manifest.json \
            --fixtures .private-fixtures/files \
            --validator-url "${VALIDATOR_URL}" \
            --output reports/campaign-p007-p015.json

      - name: Build compact latest report
        if: always()
        run: |
          if [[ -f reports/campaign-p007-p015.json ]]; then
            python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          source = json.loads(Path('reports/campaign-p007-p015.json').read_text())
          compact_results = []
          for item in source.get('results', []):
              comparison = item.get('engineComparison') or {}
              divergence = comparison.get('firstDivergence') or {}
              compact_results.append({
                  'puzzle': item.get('puzzle'),
                  'solution': item.get('solution'),
                  'referencePassed': item.get('passed'),
                  'status': comparison.get('status'),
                  'firstDivergence': {
                      'frameIndex': divergence.get('frameIndex'),
                      'legacyCycle': divergence.get('legacyCycle'),
                      'engineCycle': divergence.get('engineCycle'),
                      'classification': divergence.get('classification'),
                  } if divergence else None,
                  'engineError': {
                      'type': comparison.get('errorType'),
                      'message': comparison.get('message'),
                      'completedFrameCount': comparison.get('completedFrameCount'),
                  } if comparison.get('status') == 'engine-error' else None,
              })

          compact = {
              'schemaVersion': '0.1.0',
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'sourceManifest': source.get('manifest'),
              'summary': source.get('summary', {}),
              'results': compact_results,
          }
          Path('reports/latest-engine-regression.json').write_text(
              json.dumps(compact, indent=2), encoding='utf-8'
          )
          PY
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-p007-p015-regression
          path: |
            reports/campaign-p007-p015.json
            reports/latest-engine-regression.json
          retention-days: 30
          if-no-files-found: warn

      - name: Publish latest compact report
        if: always()
        run: |
          if [[ -f reports/latest-engine-regression.json ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/latest-engine-regression.json
            if ! git diff --cached --quiet; then
              git commit -m "Update latest engine regression report [skip ci]"
              git push
            fi
          fi

      - name: Write summary
        if: always()
        run: |
          if [[ -f reports/campaign-p007-p015.json ]]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path('reports/campaign-p007-p015.json').read_text())
          summary = report['summary']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Campaign P007-P015 regression\n\n')
              out.write(f"- Total: {summary['total']}\n")
              out.write(f"- Reference checks passed: {summary['passed']}\n")
              out.write(f"- Reference checks failed: {summary['failed']}\n")
              out.write('\n### Engine comparison\n\n')
              for name, count in summary.get('engineClassifications', {}).items():
                  out.write(f"- {name}: {count}\n")
          PY
          fi
