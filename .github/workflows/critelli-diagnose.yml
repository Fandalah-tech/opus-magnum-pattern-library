name: Critelli enrichment diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - feature/disjoint-solver-readiness
    paths:
      - ".github/workflows/critelli-diagnose.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/disjoint-solver-readiness
      - name: Summarize existing Liquid Perfumes pilot
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          p='reports/critelli-liquid-perfumes-solutions.json'
          d=json.load(open(p,encoding='utf-8'))
          failures=Counter(x['error'] for x in d.get('failures',[]))
          gaps=Counter(','.join(k for k,v in (s.get('metrics') or {}).items() if v is None) or 'complete' for e in d.get('events',[]) for s in e.get('solutions',[]))
          versions=Counter(str(s.get('formatVersion')) for e in d.get('events',[]) for s in e.get('solutions',[]))
          print('SUMMARY',json.dumps(d.get('summary'),ensure_ascii=False))
          print('VERSIONS',dict(versions))
          print('METRIC_GAPS',dict(gaps))
          print('TOP_FAILURES')
          for error,count in failures.most_common(20):
              print(count, error)
          PY
