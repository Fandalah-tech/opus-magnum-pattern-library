name: Blind GEN249 frontier rebuild

on:
  push:
    branches: [feature/critelli-2026-public-corpus]
    paths:
      - .github/workflows/heldout-frontier-rebuild.yml
      - tools/run_holdout_frontier_rebuild.py
      - tools/probe_holdout_intermediate_convergence.py
      - packages/opus_solver/intermediate_convergence.py
      - packages/opus_solver/product_delivery.py
      - reports/generated/heldout-24hour-seed/latest-oracle-base-repair.json
      - packages/opus_engine/**
      - packages/opus_analysis/**
  workflow_dispatch:

concurrency:
  group: heldout-gen249-frontier-rebuild-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  ORACLE_POINTER: reports/generated/heldout-24hour-seed/latest-oracle-base-repair.json
  RUN_POINTER: reports/generated/heldout-24hour-seed/latest-frontier-rebuild-run.json
  PUZZLE_ROOT: .datasets/heldout-frontier-rebuild
  ORACLE_ROOT: .baseline/heldout-frontier-rebuild
  REPORT_ROOT: reports/heldout-frontier-rebuild
  LATEST_REPORT: reports/generated/heldout-24hour-seed/latest-frontier-rebuild.json
  OPUSSOLVER_COMMIT: fdedd3f01a238b941ceba8bace7ea35cbd3b8c41
  OMSIM_COMMIT: 758f4a4b4c9e24f50294801da774a0960c922bab

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Publish running pointer
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path(os.environ['RUN_POINTER']); path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps({
            'schemaVersion':'0.1.0','kind':'heldout-frontier-rebuild-run-pointer',
            'runId':os.environ['GITHUB_RUN_ID'],'runNumber':os.environ['GITHUB_RUN_NUMBER'],
            'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'status':'in_progress',
            'sourceCommit':os.environ['GITHUB_SHA'],'targetSolutionBytesUsed':0,
          },indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RUN_POINTER"
          git commit -m "Record running blind frontier rebuild [skip ci]"
          git fetch origin feature/critelli-2026-public-corpus
          git rebase origin/feature/critelli-2026-public-corpus
          git push origin HEAD:feature/critelli-2026-public-corpus

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch GEN249 puzzle bytes only
        run: |
          mkdir -p .tools "$PUZZLE_ROOT"
          git clone --filter=blob:none --no-checkout https://github.com/gtw123/OpusSolver.git .tools/opussolver
          git -C .tools/opussolver sparse-checkout init --no-cone
          git -C .tools/opussolver sparse-checkout set test/puzzles/24hour-1-puzzles/GEN249.puzzle
          git -C .tools/opussolver checkout "$OPUSSOLVER_COMMIT"
          cp .tools/opussolver/test/puzzles/24hour-1-puzzles/GEN249.puzzle "$PUZZLE_ROOT"/
          test "$(find "$PUZZLE_ROOT" -maxdepth 1 -name '*.puzzle' | wc -l)" -eq 1
          if find .tools/opussolver -type f -name '*.solution' | grep -q .; then
            echo "Target solution bytes unexpectedly materialized" >&2
            exit 1
          fi

      - name: Restore target-free oracle repair artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads(Path(os.environ['ORACLE_POINTER']).read_text())
          assert p['targetSolutionBytesUsed']==0
          print(p['runId'])
          PY
          )"
          meta="$RUNNER_TEMP/oracle.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" > "$meta"
          read -r artifact_id digest < <(python - "$meta" "$run_id" <<'PY'
          import json,sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text()); name=f'heldout-oracle-base-repair-{sys.argv[2]}'; m=[x for x in d['artifacts'] if x['name']==name and not x['expired']]; assert len(m)==1; print(m[0]['id'],str(m[0]['digest']).split(':',1)[1])
          PY
          )
          mkdir -p "$ORACLE_ROOT"
          archive="$RUNNER_TEMP/oracle.zip"
          curl --fail --location --retry 8 --retry-delay 2 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" -o "$archive"
          echo "$digest  $archive" | sha256sum --check
          unzip -q "$archive" -d "$ORACLE_ROOT"
          test -s "$ORACLE_ROOT/GEN249.json"

      - name: Build pinned OMSim
        run: |
          git clone https://github.com/ianh/omsim.git .tools/omsim
          git -C .tools/omsim checkout "$OMSIM_COMMIT"
          make -C .tools/omsim omsim
          test -x .tools/omsim/omsim

      - name: Rebuild gold after mechanical advance and try first delivery
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p "$REPORT_ROOT"
          python tools/run_holdout_frontier_rebuild.py \
            --omsim .tools/omsim/omsim \
            --puzzle "$PUZZLE_ROOT/GEN249.puzzle" \
            --oracle-report "$ORACLE_POINTER" \
            --oracle-artifact-root "$ORACLE_ROOT" \
            --output-dir "$REPORT_ROOT/search" \
            --seed-limit 6 \
            --convergence-limit 12 \
            --preflight-limit 8 \
            --delivery-limit 8 \
            --max-cycles 500 \
            --output "$REPORT_ROOT/GEN249.json"

      - name: Persist compact rebuild checkpoint
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads((Path(os.environ['REPORT_ROOT'])/'GEN249.json').read_text())
          payload={
            'schemaVersion':'0.1.0','kind':'heldout-frontier-rebuild-checkpoint',
            'runId':os.environ['GITHUB_RUN_ID'],'sourceCommit':os.environ['GITHUB_SHA'],
            'targetSolutionBytesUsed':0,'oracleRepairRunId':report.get('oracleRepairRunId'),
            'request':report.get('request'),'seedCount':report.get('seedCount'),
            'seeds':report.get('seeds'),'convergenceCandidateCount':report.get('convergenceCandidateCount'),
            'deliveryCandidateCount':report.get('deliveryCandidateCount'),'bestOMSim':report.get('bestOMSim'),
            'acceptedProductOne':report.get('acceptedProductOne'),'acceptedSolution':report.get('acceptedSolution'),
            'topConvergenceCandidates':(report.get('convergenceCandidates') or [])[:12],
            'topDeliveryCandidates':(report.get('deliveryCandidates') or [])[:12],
            'omsimCommit':os.environ['OMSIM_COMMIT'],
          }
          out=Path(os.environ['LATEST_REPORT']); out.parent.mkdir(parents=True,exist_ok=True); out.write_text(json.dumps(payload,indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LATEST_REPORT"
          git commit -m "Update blind frontier rebuild checkpoint [skip ci]" || true
          git fetch origin feature/critelli-2026-public-corpus
          git rebase origin/feature/critelli-2026-public-corpus
          git push origin HEAD:feature/critelli-2026-public-corpus

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heldout-frontier-rebuild-${{ github.run_id }}
          path: ${{ env.REPORT_ROOT }}/
          if-no-files-found: error
          retention-days: 14

      - name: Finalize run pointer
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUN_POINTER'])
          if not p.exists(): raise SystemExit(0)
          d=json.loads(p.read_text()); d['status']='completed'; d['conclusion']=os.environ.get('JOB_STATUS','unknown'); p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RUN_POINTER"
          git commit -m "Finalize blind frontier rebuild [skip ci]" || true
          git fetch origin feature/critelli-2026-public-corpus
          git rebase origin/feature/critelli-2026-public-corpus
          git push origin HEAD:feature/critelli-2026-public-corpus
