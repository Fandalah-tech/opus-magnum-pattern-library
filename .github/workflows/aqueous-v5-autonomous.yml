name: Aqueous V5 Autonomous Search

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}
  VALIDATOR_URL: https://opus-validator-6gflgqb25q-nn.a.run.app
  SEARCH_DIR: reports/aqueous-v7
  FALLBACK_ARTIFACT_ID: "9026389922"

jobs:
  search:
    name: resumable coupled structural search
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aqueous-dagger-fragment-planner-final

      - name: Materialize puzzle and 27c seed
        run: |
          mkdir -p reports
          python - <<'PY'
          import base64
          from pathlib import Path
          pairs = [
              ('fixtures/weeklies2026/aqueous-dagger.puzzle.b64','reports/aqueous-dagger.puzzle'),
              ('fixtures/weeklies2026/aqueous-dagger-27c-single-reference.solution.b64','reports/single27.solution'),
          ]
          for src, dst in pairs:
              Path(dst).write_bytes(base64.b64decode(Path(src).read_text().strip()))
          PY

      - name: Restore latest persistent search knowledge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${SEARCH_DIR}"
          artifact_id=$(gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=aqueous-v7-search&per_page=100" \
            --jq '.artifacts | map(select(.expired == false and .workflow_run.head_branch == "feature/aqueous-dagger-fragment-planner-final")) | sort_by(.created_at) | reverse | .[0].id // empty')
          if [ -z "$artifact_id" ]; then artifact_id="${FALLBACK_ARTIFACT_ID}"; fi
          echo "restoring artifact ${artifact_id}"
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/previous.zip
          unzip -q -o /tmp/previous.zip -d "${SEARCH_DIR}"

      - name: Activate v9 search neighborhood
        run: |
          sed -i 's/GENERATOR_VERSION = 8/GENERATOR_VERSION = 9/' tools/run_aqueous_evolution_v7.py
          sed -i 's#tools/search_aqueous_structural.py#tools/search_aqueous_structural_v9.py#' tools/run_aqueous_evolution_v7.py
          python -m py_compile tools/solution_identity.py tools/run_aqueous_evolution_v7.py tools/search_aqueous_structural.py tools/search_aqueous_structural_v9.py tools/validate_aqueous_offsets.py

      - name: Resumable autonomous search to 26c
        run: >-
          python tools/run_aqueous_evolution_v7.py
          --validator-url "${VALIDATOR_URL}"
          --puzzle reports/aqueous-dagger.puzzle
          --seed reports/single27.solution
          --work "${SEARCH_DIR}"
          --generations 300
          --target-cycles 26
          --workers 8
          --watchdog-seconds 25
          --generation-seconds 600
          --retry-batch 32

      - name: Upload persistent search state and solutions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqueous-v7-search
          path: |
            ${{ env.SEARCH_DIR }}/results.json
            ${{ env.SEARCH_DIR }}/checkpoint.json
            ${{ env.SEARCH_DIR }}/state-v7.json
            ${{ env.SEARCH_DIR }}/attempted.txt
            ${{ env.SEARCH_DIR }}/expanded.txt
            ${{ env.SEARCH_DIR }}/retryable.txt
            ${{ env.SEARCH_DIR }}/retry/
            ${{ env.SEARCH_DIR }}/top-1.solution
            ${{ env.SEARCH_DIR }}/top-2.solution
            ${{ env.SEARCH_DIR }}/top-3.solution
            ${{ env.SEARCH_DIR }}/archive/
          if-no-files-found: warn
