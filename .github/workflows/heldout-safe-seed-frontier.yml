name: Blind GEN249 safe-seed frontier

on:
  push:
    branches: [feature/critelli-2026-public-corpus]
    paths:
      - .github/workflows/heldout-safe-seed-frontier.yml
      - tools/probe_holdout_safe_seed_frontier.py
      - reports/generated/heldout-24hour-seed/latest-omsim-mechanical-preflight.json
      - packages/opus_solver/**
      - packages/opus_engine/**
      - packages/opus_analysis/**
  workflow_dispatch:

concurrency:
  group: heldout-gen249-safe-seed-frontier-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  MECHANICAL_POINTER: reports/generated/heldout-24hour-seed/latest-omsim-mechanical-preflight.json
  PUZZLE_ROOT: .datasets/heldout-safe-seed-frontier
  BASELINE_ROOT: .baseline/heldout-safe-seed-frontier
  REPORT_ROOT: reports/heldout-safe-seed-frontier
  LATEST_REPORT: reports/generated/heldout-24hour-seed/latest-safe-seed-frontier.json
  OPUSSOLVER_COMMIT: fdedd3f01a238b941ceba8bace7ea35cbd3b8c41

jobs:
  frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch GEN249 puzzle bytes only
        run: |
          mkdir -p .tools "$PUZZLE_ROOT"
          git clone --filter=blob:none --no-checkout https://github.com/gtw123/OpusSolver.git .tools/opussolver
          git -C .tools/opussolver sparse-checkout init --no-cone
          git -C .tools/opussolver sparse-checkout set test/puzzles/24hour-1-puzzles/GEN249.puzzle
          git -C .tools/opussolver checkout "$OPUSSOLVER_COMMIT"
          cp .tools/opussolver/test/puzzles/24hour-1-puzzles/GEN249.puzzle "$PUZZLE_ROOT"/
          if find .tools/opussolver -type f -name '*.solution' | grep -q .; then exit 1; fi

      - name: Restore OMSim-safer target-free seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r run_id solution_name < <(python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads(Path(os.environ['MECHANICAL_POINTER']).read_text())
          assert p['targetSolutionBytesUsed']==0
          assert p['best']['failureCycle'] and int(p['best']['failureCycle']) > 1
          print(p['runId'], Path(p['best']['solution']).name)
          PY
          )
          meta="$RUNNER_TEMP/mechanical.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" > "$meta"
          read -r aid digest < <(python - "$meta" "$run_id" <<'PY'
          import json,sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text()); name=f'heldout-omsim-mechanical-{sys.argv[2]}'; m=[x for x in d['artifacts'] if x['name']==name and not x['expired']]; assert len(m)==1; print(m[0]['id'],str(m[0]['digest']).split(':',1)[1])
          PY
          )
          mkdir -p "$BASELINE_ROOT"; archive="$RUNNER_TEMP/mechanical.zip"
          curl --fail --location -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}/zip" -o "$archive"
          echo "$digest  $archive" | sha256sum --check
          unzip -q "$archive" -d "$BASELINE_ROOT"
          find "$BASELINE_ROOT" -type f -maxdepth 3 -print
          seed="$(find "$BASELINE_ROOT" -type f -name "$solution_name" | head -1)"
          test -s "$seed"
          cp "$seed" "$BASELINE_ROOT/GEN249-safe-seed.solution"

      - name: Probe chemistry frontier
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p "$REPORT_ROOT"
          python tools/probe_holdout_safe_seed_frontier.py \
            --puzzle "$PUZZLE_ROOT/GEN249.puzzle" \
            --solution "$BASELINE_ROOT/GEN249-safe-seed.solution" \
            --max-cycles 500 \
            --output "$REPORT_ROOT/GEN249.json"

      - name: Persist compact frontier checkpoint
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads((Path(os.environ['REPORT_ROOT'])/'GEN249.json').read_text())
          mechanical=json.loads(Path(os.environ['MECHANICAL_POINTER']).read_text())
          payload={
            'schemaVersion':'0.1.0','kind':'heldout-safe-seed-frontier-checkpoint',
            'runId':os.environ['GITHUB_RUN_ID'],'sourceCommit':os.environ['GITHUB_SHA'],
            'mechanicalRunId':mechanical['runId'],'mechanicalBest':mechanical['best'],
            'targetSolutionBytesUsed':0,'target':report['targetPuzzle'],
            'request':report['request'],'purificationProfile':report['purificationProfile'],
            'replaySummary':report['replaySummary'],'additiveSummary':report['additiveSummary'],
            'additiveOpportunities':report['additiveOpportunities'],
            'convergenceSummary':report['convergenceSummary'],'convergenceObservations':report['convergenceObservations'],
          }
          out=Path(os.environ['LATEST_REPORT']); out.parent.mkdir(parents=True,exist_ok=True); out.write_text(json.dumps(payload,indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LATEST_REPORT"
          git commit -m "Update blind safe-seed frontier [skip ci]" || true
          git fetch origin feature/critelli-2026-public-corpus
          git rebase origin/feature/critelli-2026-public-corpus
          git push origin HEAD:feature/critelli-2026-public-corpus

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heldout-safe-seed-frontier-${{ github.run_id }}
          path: ${{ env.REPORT_ROOT }}/
          retention-days: 14
