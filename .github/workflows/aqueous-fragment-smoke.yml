name: Aqueous fragment planner smoke

on:
  pull_request:
    paths:
      - packages/opus_solver/fragment_planner.py
      - tests/test_fragment_planner.py
      - tests/test_aqueous_candidate.py
      - tests/test_aqueous_exact_puzzle.py
      - .github/workflows/aqueous-fragment-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run Aqueous planner and candidate tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python -m pytest
          tests/test_fragment_planner.py
          tests/test_aqueous_candidate.py
          tests/test_aqueous_exact_puzzle.py
          -q
