name: Aqueous fragment planner smoke

on:
  pull_request:
    paths:
      - packages/opus_solver/fragment_planner.py
      - tests/test_fragment_planner.py
      - tests/test_aqueous_candidate.py
      - tests/test_aqueous_exact_puzzle.py
      - tools/build_aqueous_probe.py
      - tools/search_aqueous_16c_offsets.py
      - tools/search_aqueous_16c_structural.py
      - tools/validate_aqueous_offsets.py
      - fixtures/weeklies2026/aqueous-dagger.puzzle.b64
      - fixtures/weeklies2026/aqueous-dagger-16c-reference.solution.b64
      - .github/workflows/aqueous-fragment-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  VALIDATOR_URL: https://opus-validator-6gflgqb25q-nn.a.run.app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run Aqueous planner and candidate tests
        run: >-
          python -m pytest
          tests/test_fragment_planner.py
          tests/test_aqueous_candidate.py
          tests/test_aqueous_exact_puzzle.py
          -q
      - name: Build exact binary probe
        run: python tools/build_aqueous_probe.py
      - name: Validate probe with OMSim service
        run: |
          curl --fail-with-body -sS \
            -F "puzzle=@reports/aqueous-dagger.puzzle" \
            -F "solution=@reports/aqueous-dagger-probe.solution" \
            "${VALIDATOR_URL}/api/v1/analyze" > reports/aqueous-dagger-omsim.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('reports/aqueous-dagger-omsim.json').read_text())
          validation = report.get('validation', {})
          print(json.dumps(validation, indent=2))
          if validation.get('valid') is not True:
              raise SystemExit('OMSim rejected the exact Aqueous probe')
          PY
      - name: Generate one-cycle-earlier variants from 16c reference
        run: python tools/search_aqueous_16c_offsets.py
      - name: Diagnose simple one-cycle offsets
        run: >-
          python tools/validate_aqueous_offsets.py
          --validator-url "${VALIDATOR_URL}"
      - name: Generate structural compression variants
        run: python tools/search_aqueous_16c_structural.py
      - name: Search structural variants for 15 cycles
        run: >-
          python tools/validate_aqueous_offsets.py
          --validator-url "${VALIDATOR_URL}"
          --variants reports/aqueous-structural-search
