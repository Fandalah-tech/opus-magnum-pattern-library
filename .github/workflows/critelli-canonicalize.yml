name: Critelli canonical manifest

on:
  push:
    branches:
      - feature/disjoint-solver-readiness
    paths:
      - "reports/critelli-solution-catalog.json"
      - "reports/critelli-event-catalog.json"
      - "tools/build_critelli_manifest.py"
      - ".github/workflows/critelli-canonicalize.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/disjoint-solver-readiness
          fetch-depth: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build latest canonical Critelli manifest
        if: ${{ hashFiles('reports/critelli-solution-catalog.json') != '' }}
        run: |
          python tools/build_critelli_manifest.py \
            --events reports/critelli-event-catalog.json \
            --solutions reports/critelli-solution-catalog.json \
            --output database/critelli-public-events.manifest.json

      - name: Commit canonical manifest
        if: ${{ hashFiles('database/critelli-public-events.manifest.json') != '' }}
        run: |
          git config user.name "codex-catalog-bot"
          git config user.email "codex-catalog-bot@users.noreply.github.com"
          git add database/critelli-public-events.manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh canonical Critelli manifest"
          git pull --rebase origin feature/disjoint-solver-readiness
          git push origin HEAD:feature/disjoint-solver-readiness
