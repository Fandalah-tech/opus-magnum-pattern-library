name: One-time rotary repeat patch

on:
  push:
    branches:
      - feature/critelli-2026-public-corpus
    paths:
      - .github/workflows/one-time-rotary-repeat-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch rotary accumulator program
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/opus_solver/candidate_solution.py')
          text = path.read_text(encoding='utf-8')
          old = '''            selected_arm["program"] = [
                {"cycle": 0, "instruction": "grab"},
                {"cycle": 1, "instruction": "rotate_cw" if step == -1 else "rotate_ccw"},
                {"cycle": 2, "instruction": "drop"},
                {"cycle": 3, "instruction": "rotate_ccw" if step == -1 else "rotate_cw"},
            ]
'''
          new = '''            selected_arm["program"] = [
                {"cycle": 0, "instruction": "grab"},
                {"cycle": 1, "instruction": "rotate_cw" if step == -1 else "rotate_ccw"},
                {"cycle": 2, "instruction": "drop"},
                {"cycle": 3, "instruction": "rotate_ccw" if step == -1 else "rotate_cw"},
                # Opus Magnum's repeat instruction copies the preceding physical
                # tape block. Chaining repeats at powers of two expands the
                # four-cycle accumulator to 128 cycles using only five extra
                # instruction cells. This is enough for six standard outputs
                # while keeping the serialized solution metric-free.
                {"cycle": 4, "instruction": "repeat"},
                {"cycle": 8, "instruction": "repeat"},
                {"cycle": 16, "instruction": "repeat"},
                {"cycle": 32, "instruction": "repeat"},
                {"cycle": 64, "instruction": "repeat"},
            ]
'''
          if old not in text:
              raise SystemExit('Expected rotary program block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-rotary-repeat-patch.yml
          git add packages/opus_solver/candidate_solution.py
          git commit -m "Expand rotary accumulator with compact repeat tape [skip ci]"
          git pull --rebase origin feature/critelli-2026-public-corpus
          git push origin HEAD:feature/critelli-2026-public-corpus
