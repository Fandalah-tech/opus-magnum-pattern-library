name: OM local research worker

on:
  push:
    branches:
      - feature/disjoint-solver-readiness
    paths:
      - ".om-bridge/tasks/pending/*.json"
  workflow_dispatch:
    inputs:
      task_file:
        description: "Repository-relative path to one approved task JSON"
        required: true
        type: string

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      task_file: ${{ steps.task.outputs.task_file }}
      has_task: ${{ steps.task.outputs.has_task }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/disjoint-solver-readiness
          fetch-depth: 50

      - name: Resolve actionable task
        id: task
        env:
          DISPATCH_TASK: ${{ inputs.task_file }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          python tools/resolve_om_task.py \
            --event "$EVENT_NAME" \
            --dispatch-task "$DISPATCH_TASK" \
            --trigger-sha "$TRIGGER_SHA" \
            --output "$GITHUB_OUTPUT" \
            --allow-empty

  execute:
    needs: guard
    if: needs.guard.outputs.has_task == 'true' && (github.event_name == 'workflow_dispatch' || github.actor == 'Fandalah-tech')
    runs-on: [self-hosted, Windows, X64, omsim]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/disjoint-solver-readiness
          fetch-depth: 50

      - name: Confirm task is still pending
        id: live_task
        shell: pwsh
        run: |
          $task = '${{ needs.guard.outputs.task_file }}'
          $exists = Test-Path -LiteralPath $task -PathType Leaf
          "should_run=$($exists.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if (-not $exists) {
            Write-Host "Task was already consumed or superseded: $task"
          }

      - name: Prepare Python test environment
        if: steps.live_task.outputs.should_run == 'true'
        shell: cmd
        run: |
          python -m pip install --upgrade pip pytest

      - name: Execute approved operation
        if: steps.live_task.outputs.should_run == 'true'
        id: worker
        shell: cmd
        env:
          OM_LIVE_STATUS_TOKEN: ${{ github.token }}
          OM_LIVE_STATUS_BRANCH: feature/disjoint-solver-readiness
        run: |
          setlocal EnableDelayedExpansion
          python --version
          python tools/om_worker.py --task "${{ needs.guard.outputs.task_file }}" --results-root ".om-bridge/results"
          set code=!ERRORLEVEL!
          echo exit_code=!code!>>"%GITHUB_OUTPUT%"
          exit /b 0

      - name: Finalize queue task
        if: steps.live_task.outputs.should_run == 'true'
        shell: pwsh
        run: |
          $task = '${{ needs.guard.outputs.task_file }}'
          if (-not (Test-Path -LiteralPath $task -PathType Leaf)) {
            Write-Host "Task was already finalized by another trusted consumer: $task"
            exit 0
          }
          $exitCode = [int]'${{ steps.worker.outputs.exit_code }}'
          $destinationFolder = if ($exitCode -eq 0) { '.om-bridge/tasks/completed' } else { '.om-bridge/tasks/failed' }
          New-Item -ItemType Directory -Force -Path $destinationFolder | Out-Null
          $destination = Join-Path $destinationFolder ([IO.Path]::GetFileName($task))
          git mv -- "$task" "$destination"
          if ($LASTEXITCODE -ne 0) { throw "Unable to finalize queue task $task" }

      - name: Commit research result
        if: steps.live_task.outputs.should_run == 'true'
        shell: cmd
        run: |
          git config user.name "om-local-worker"
          git config user.email "om-local-worker@users.noreply.github.com"
          git add .om-bridge reports packages/opus_engine/final_simulator.py
          git diff --cached --quiet || git commit -m "Record OMSIM worker result"
          git fetch origin feature/disjoint-solver-readiness
          git rebase origin/feature/disjoint-solver-readiness
          git push origin HEAD:feature/disjoint-solver-readiness

      - name: Fail workflow when operation failed
        if: steps.live_task.outputs.should_run == 'true' && steps.worker.outputs.exit_code != '0'
        shell: cmd
        run: exit /b ${{ steps.worker.outputs.exit_code }}
