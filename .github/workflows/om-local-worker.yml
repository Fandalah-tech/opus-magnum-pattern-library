name: OM local research worker (legacy)

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Legacy diagnostic only. The OM User Agent now consumes the queue directly."
        required: false
        type: string

permissions:
  contents: read

jobs:
  legacy:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy worker disabled
        run: |
          echo "The self-hosted GitHub Actions OMSIM runner is retired from automatic queue processing."
          echo "Pending tasks are consumed by the OM User Agent running in the signed-in Windows session."
          echo "This workflow remains only as a manual diagnostic marker during migration."
