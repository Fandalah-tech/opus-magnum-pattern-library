name: OM local research worker

on:
  push:
    branches:
      - feature/disjoint-solver-readiness
    paths:
      - ".om-bridge/tasks/pending/*.json"
  workflow_dispatch:
    inputs:
      task_file:
        description: "Repository-relative path to one approved task JSON"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: om-local-worker
  cancel-in-progress: false

jobs:
  execute:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'Fandalah-tech'
    runs-on: [self-hosted, Windows, X64, omsim]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/disjoint-solver-readiness
          fetch-depth: 2

      - name: Resolve task file
        id: task
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $task = "${{ inputs.task_file }}"
          } else {
            $task = git diff --name-only --diff-filter=AM HEAD^ HEAD -- ".om-bridge/tasks/pending/*.json" | Select-Object -First 1
          }
          if (-not $task) { throw "No pending task JSON was found." }
          if ($task -notmatch '^\.om-bridge/tasks/pending/[A-Za-z0-9._-]+\.json$') {
            throw "Unsafe task path: $task"
          }
          "task_file=$task" >> $env:GITHUB_OUTPUT

      - name: Execute approved operation
        id: worker
        shell: pwsh
        run: |
          python --version
          python tools/om_worker.py --task "${{ steps.task.outputs.task_file }}" --results-root ".om-bridge/results"
          $code = $LASTEXITCODE
          "exit_code=$code" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Commit research result
        shell: pwsh
        run: |
          git config user.name "om-local-worker"
          git config user.email "om-local-worker@users.noreply.github.com"
          git add .om-bridge/results
          if (-not (git diff --cached --quiet)) {
            git commit -m "Record OMSIM worker result"
            git push origin HEAD:feature/disjoint-solver-readiness
          }

      - name: Fail workflow when operation failed
        if: steps.worker.outputs.exit_code != '0'
        shell: pwsh
        run: exit ${{ steps.worker.outputs.exit_code }}
