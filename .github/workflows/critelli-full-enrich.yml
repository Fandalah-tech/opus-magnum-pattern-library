name: Critelli full metadata enrichment

on:
  workflow_dispatch:
  push:
    branches:
      - feature/disjoint-solver-readiness
    paths:
      - ".github/workflows/critelli-full-enrich.yml"

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/disjoint-solver-readiness
          fetch-depth: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enrich all currently public Critelli solutions ephemerally
        run: |
          python tools/enrich_critelli_solutions.py \
            --catalog reports/critelli-event-catalog.json \
            --delay 0.20 \
            --output reports/critelli-solution-catalog.json

      - name: Build canonical Critelli manifest
        run: |
          python tools/build_critelli_manifest.py \
            --events reports/critelli-event-catalog.json \
            --solutions reports/critelli-solution-catalog.json \
            --output database/critelli-public-events.manifest.json

      - name: Commit metadata only
        run: |
          git config user.name "codex-catalog-bot"
          git config user.email "codex-catalog-bot@users.noreply.github.com"
          git add reports/critelli-solution-catalog.json database/critelli-public-events.manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "Build full Critelli public solution metadata catalog"
          git pull --rebase origin feature/disjoint-solver-readiness
          git push origin HEAD:feature/disjoint-solver-readiness
