name: Deploy validator service only

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-validator-service.yml
      - services/validator/**
      - packages/opus_parser/**
      - packages/opus_validator/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: opus-magnum-codex
  REGION: northamerica-northeast1
  REPOSITORY: opus-services
  SERVICE: opus-validator
  IMAGE: northamerica-northeast1-docker.pkg.dev/opus-magnum-codex/opus-services/opus-validator
  WORKLOAD_IDENTITY_PROVIDER: projects/740016697359/locations/global/workloadIdentityPools/github-actions/providers/opus-pattern-library
  DEPLOYER_SERVICE_ACCOUNT: opus-github-deployer@opus-magnum-codex.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: opus-validator-runtime@opus-magnum-codex.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validator unit tests
        run: |
          python -m unittest discover -s packages/opus_parser/tests -v
          python -m unittest discover -s packages/opus_validator/tests -v

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Authenticate Docker
        uses: docker/login-action@v4
        with:
          registry: northamerica-northeast1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/validator/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Deploy
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          region: ${{ env.REGION }}
          service: ${{ env.SERVICE }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          flags: >-
            --service-account=${{ env.RUNTIME_SERVICE_ACCOUNT }}
            --allow-unauthenticated
            --port=8080
            --cpu=1
            --memory=512Mi
            --min-instances=0
            --max-instances=2
            --concurrency=8
            --timeout=60

      - name: Verify fast validator
        run: |
          BASE_URL="${{ steps.deploy.outputs.url }}"
          curl --fail --show-error --silent "$BASE_URL/health" > health.json
          curl --fail --show-error --silent "$BASE_URL/openapi.json" > openapi.json
          python - <<'PY'
          import json
          health=json.load(open('health.json'))
          api=json.load(open('openapi.json'))
          assert health['status']=='ok', health
          assert '/api/v1/validate' in api['paths'], api['paths'].keys()
          PY
