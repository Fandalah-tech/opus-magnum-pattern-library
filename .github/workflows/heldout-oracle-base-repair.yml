name: Blind GEN249 OMSim collision-base repair

on:
  push:
    branches: [feature/critelli-2026-public-corpus]
    paths:
      - .github/workflows/heldout-oracle-base-repair.yml
      - tools/run_holdout_oracle_base_repair.py
      - tools/run_holdout_frontier_rebuild.py
      - packages/opus_solver/intermediate_convergence.py
      - packages/opus_solver/product_delivery.py
      - reports/generated/heldout-24hour-seed/latest-omsim-mechanical-preflight.json
  workflow_dispatch:

concurrency:
  group: heldout-gen249-oracle-base-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  MECHANICAL_POINTER: reports/generated/heldout-24hour-seed/latest-omsim-mechanical-preflight.json
  PUZZLE_ROOT: .datasets/heldout-oracle-base
  BASELINE_ROOT: .baseline/heldout-oracle-base
  REPORT_ROOT: reports/heldout-oracle-base
  LATEST_REPORT: reports/generated/heldout-24hour-seed/latest-oracle-base-repair.json
  FRONTIER_REPORT: reports/generated/heldout-24hour-seed/latest-frontier-rebuild.json
  OPUSSOLVER_COMMIT: fdedd3f01a238b941ceba8bace7ea35cbd3b8c41
  OMSIM_COMMIT: 758f4a4b4c9e24f50294801da774a0960c922bab

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch GEN249 puzzle bytes only
        run: |
          mkdir -p .tools "$PUZZLE_ROOT"
          git clone --filter=blob:none --no-checkout https://github.com/gtw123/OpusSolver.git .tools/opussolver
          git -C .tools/opussolver sparse-checkout init --no-cone
          git -C .tools/opussolver sparse-checkout set test/puzzles/24hour-1-puzzles/GEN249.puzzle
          git -C .tools/opussolver checkout "$OPUSSOLVER_COMMIT"
          cp .tools/opussolver/test/puzzles/24hour-1-puzzles/GEN249.puzzle "$PUZZLE_ROOT"/
          if find .tools/opussolver -type f -name '*.solution' | grep -q .; then exit 1; fi

      - name: Restore OMSim-safer target-free seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r run_id solution_name < <(python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(Path(os.environ['MECHANICAL_POINTER']).read_text())
          assert p['targetSolutionBytesUsed'] == 0
          print(p['runId'], Path(p['best']['solution']).name)
          PY
          )
          metadata="$RUNNER_TEMP/mechanical.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" > "$metadata"
          read -r artifact_id digest < <(python - "$metadata" "$run_id" <<'PY'
          import json, sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text()); name=f'heldout-omsim-mechanical-{sys.argv[2]}'; m=[x for x in d['artifacts'] if x['name']==name and not x['expired']]; assert len(m)==1; print(m[0]['id'],str(m[0]['digest']).split(':',1)[1])
          PY
          )
          mkdir -p "$BASELINE_ROOT"
          archive="$RUNNER_TEMP/mechanical.zip"
          curl --fail --location -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" -o "$archive"
          echo "$digest  $archive" | sha256sum --check
          unzip -q "$archive" -d "$BASELINE_ROOT"
          seed="$(find "$BASELINE_ROOT" -type f -name "$solution_name" | head -1)"
          test -s "$seed"
          cp "$seed" "$BASELINE_ROOT/GEN249-safe-seed.solution"

      - name: Build pinned OMSim
        run: |
          git clone https://github.com/ianh/omsim.git .tools/omsim
          git -C .tools/omsim checkout "$OMSIM_COMMIT"
          make -C .tools/omsim omsim
          test -x .tools/omsim/omsim

      - name: Iterate chemistry-preserving collision-base repairs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p "$REPORT_ROOT/search"
          python tools/run_holdout_oracle_base_repair.py \
            --omsim .tools/omsim/omsim \
            --puzzle "$PUZZLE_ROOT/GEN249.puzzle" \
            --baseline "$BASELINE_ROOT/GEN249-safe-seed.solution" \
            --generations 5 \
            --max-arm-length 3 \
            --output-dir "$REPORT_ROOT/search" \
            --output "$REPORT_ROOT/GEN249.json"

      - name: Persist compact oracle checkpoint
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads((Path(os.environ['REPORT_ROOT'])/'GEN249.json').read_text())
          mechanical=json.loads(Path(os.environ['MECHANICAL_POINTER']).read_text())
          payload={
            'schemaVersion':'0.2.0','kind':'heldout-oracle-base-repair-checkpoint',
            'runId':os.environ['GITHUB_RUN_ID'],'sourceCommit':os.environ['GITHUB_SHA'],
            'mechanicalRunId':mechanical['runId'],'targetSolutionBytesUsed':0,
            'requestedGenerations':report['requestedGenerations'],'maxArmLength':report.get('maxArmLength'),
            'generationCount':report['generationCount'],'history':report['history'],
            'finalOMSim':report['finalOMSim'],'localPurificationProfile':report.get('localPurificationProfile'),
            'localReplaySummary':report.get('localReplaySummary'),'acceptedProductOne':report['acceptedProductOne'],
            'acceptedSolution':report.get('acceptedSolution'),'omsimCommit':os.environ['OMSIM_COMMIT'],
          }
          out=Path(os.environ['LATEST_REPORT']); out.parent.mkdir(parents=True,exist_ok=True); out.write_text(json.dumps(payload,indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LATEST_REPORT"
          git commit -m "Update blind oracle base repair [skip ci]" || true
          git fetch origin feature/critelli-2026-public-corpus
          git rebase origin/feature/critelli-2026-public-corpus
          git push origin HEAD:feature/critelli-2026-public-corpus

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heldout-oracle-base-repair-${{ github.run_id }}
          path: ${{ env.REPORT_ROOT }}/
          retention-days: 14

  frontier-rebuild:
    needs: repair
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: heldout-oracle-base-repair-${{ github.run_id }}
          path: .baseline/oracle-run

      - name: Fetch GEN249 puzzle bytes only
        run: |
          mkdir -p .tools .datasets/frontier-rebuild
          git clone --filter=blob:none --no-checkout https://github.com/gtw123/OpusSolver.git .tools/opussolver
          git -C .tools/opussolver sparse-checkout init --no-cone
          git -C .tools/opussolver sparse-checkout set test/puzzles/24hour-1-puzzles/GEN249.puzzle
          git -C .tools/opussolver checkout "$OPUSSOLVER_COMMIT"
          cp .tools/opussolver/test/puzzles/24hour-1-puzzles/GEN249.puzzle .datasets/frontier-rebuild/
          if find .tools/opussolver -type f -name '*.solution' | grep -q .; then exit 1; fi

      - name: Build pinned OMSim
        run: |
          git clone https://github.com/ianh/omsim.git .tools/omsim
          git -C .tools/omsim checkout "$OMSIM_COMMIT"
          make -C .tools/omsim omsim

      - name: Rebuild chemistry after mechanical advances
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p reports/heldout-frontier-rebuild
          python tools/run_holdout_frontier_rebuild.py \
            --omsim .tools/omsim/omsim \
            --puzzle .datasets/frontier-rebuild/GEN249.puzzle \
            --oracle-report .baseline/oracle-run/GEN249.json \
            --oracle-artifact-root .baseline/oracle-run \
            --output-dir reports/heldout-frontier-rebuild/search \
            --seed-limit 6 --convergence-limit 12 --preflight-limit 8 --delivery-limit 8 --max-cycles 500 \
            --output reports/heldout-frontier-rebuild/GEN249.json

      - name: Persist frontier rebuild checkpoint
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('reports/heldout-frontier-rebuild/GEN249.json').read_text())
          payload={
            'schemaVersion':'0.1.0','kind':'heldout-frontier-rebuild-checkpoint',
            'runId':os.environ['GITHUB_RUN_ID'],'sourceCommit':os.environ['GITHUB_SHA'],'targetSolutionBytesUsed':0,
            'request':r.get('request'),'seedCount':r.get('seedCount'),'seeds':r.get('seeds'),
            'convergenceCandidateCount':r.get('convergenceCandidateCount'),'deliveryCandidateCount':r.get('deliveryCandidateCount'),
            'bestOMSim':r.get('bestOMSim'),'acceptedProductOne':r.get('acceptedProductOne'),'acceptedSolution':r.get('acceptedSolution'),
            'topConvergenceCandidates':(r.get('convergenceCandidates') or [])[:12],
            'topDeliveryCandidates':(r.get('deliveryCandidates') or [])[:12],
            'omsimCommit':os.environ['OMSIM_COMMIT'],
          }
          out=Path(os.environ['FRONTIER_REPORT']); out.parent.mkdir(parents=True,exist_ok=True); out.write_text(json.dumps(payload,indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FRONTIER_REPORT"
          git commit -m "Update blind frontier rebuild checkpoint [skip ci]" || true
          git fetch origin feature/critelli-2026-public-corpus
          git rebase origin/feature/critelli-2026-public-corpus
          git push origin HEAD:feature/critelli-2026-public-corpus

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heldout-frontier-rebuild-${{ github.run_id }}
          path: reports/heldout-frontier-rebuild/
          retention-days: 14
