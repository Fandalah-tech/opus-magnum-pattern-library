name: Pivot to training corpus

on:
  push:
    branches:
      - feature/aqueous-dagger-fragment-planner-final
    paths:
      - '.github/workflows/pivot-to-training-corpus.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Cancel obsolete Aqueous searches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for status in in_progress queued; do
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?status=${status}&per_page=100" \
              --jq '.workflow_runs[] | [.id,.name] | @tsv' | \
            while IFS=$'\t' read -r id name; do
              [[ -z "$id" ]] && continue
              [[ "$id" == "${GITHUB_RUN_ID}" ]] && continue
              if [[ "$name" == Aqueous* ]]; then
                echo "Cancelling $id $name"
                gh api -X POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" || true
              fi
            done
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install corpus dependencies
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium

      - name: Import full campaign corpus
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -rf .datasets/campaign-corpus
          python tools/import_campaign_corpus.py \
            --root .datasets/campaign-corpus \
            --force

      - name: Audit campaign corpus
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p reports/training-corpus
          python tools/audit_campaign_corpus.py \
            --root .datasets/campaign-corpus \
            --output reports/training-corpus/campaign-audit.json || true

      - name: Fetch public challenge puzzle corpora
        run: |
          mkdir -p .datasets/external reports/training-corpus/inventory
          for id in panic-24hour-sample-100 panic-24hour-test-1000 panic-24hour-official-1000; do
            python tools/datasets/fetch_dataset.py "$id" \
              --output-dir .datasets/external \
              --accept-unknown-license
          done

      - name: Extract and inventory challenge corpora
        shell: bash
        run: |
          set -euo pipefail
          for zip in .datasets/external/*.zip; do
            id=$(basename "$zip" .zip)
            dir=".datasets/external/${id}"
            mkdir -p "$dir"
            unzip -q -o "$zip" -d "$dir"
            python tools/datasets/inventory.py "$dir" \
              --dataset-id "$id" \
              --output "reports/training-corpus/inventory/${id}.json"
          done

      - name: Build corpus summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.datasets/campaign-corpus')
          idx=json.loads((root/'index.json').read_text())
          inv={}
          for p in Path('reports/training-corpus/inventory').glob('*.json'):
              d=json.loads(p.read_text())
              inv[d['datasetId']]={
                  'totalFiles': d['totalFiles'],
                  'countsByExtension': d['countsByExtension'],
                  'trackedFiles': len(d['trackedFiles']),
              }
          audit={}
          ap=Path('reports/training-corpus/campaign-audit.json')
          if ap.exists(): audit=json.loads(ap.read_text()).get('summary',{})
          out={
              'campaign': {
                  'puzzles': idx.get('puzzleCount',0),
                  'solutionRecords': idx.get('solutionRecordCount',0),
                  'solutionFiles': idx.get('solutionFileCount',0),
                  'solutionErrors': idx.get('solutionErrorCount',0),
                  'audit': audit,
              },
              'externalPuzzleCorpora': inv,
          }
          Path('reports/training-corpus/summary.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY

      - name: Upload training corpus
        uses: actions/upload-artifact@v4
        with:
          name: opus-training-corpus-${{ github.run_id }}
          path: |
            .datasets/campaign-corpus/
            .datasets/external/
            reports/training-corpus/
          if-no-files-found: error
          retention-days: 90

      - name: Publish summary
        run: |
          echo '## Opus training corpus' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat reports/training-corpus/summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
