name: Critelli reference regression

on:
  push:
    branches:
      - main
      - feature/critelli-2026-public-corpus
    paths:
      - .github/workflows/critelli-reference-regression.yml
      - fixtures/reference/critelli-aqueous-dagger/**
      - tools/import_critelli_event.py
      - tools/validate_critelli_reference.py
      - tools/solve_puzzle.py
      - tools/build_engine_fragment_flow_index.py
      - tests/test_autonomous_solver.py
      - tests/test_engine_fragment_flow.py
      - packages/opus_analysis/**
      - packages/opus_engine/**
      - packages/opus_parser/**
      - packages/opus_solver/**
  workflow_dispatch:

permissions:
  contents: write

env:
  EVENT_ID: 31a11c8c2b284d8f0664f3f069f9e11e
  EVENT_PAGE: https://events.critelli.technology/OM2026Weeklies6_AqueousDagger
  REFERENCE_ROOT: .datasets/critelli-aqueous-dagger-reference
  FIXTURE_ROOT: fixtures/reference/critelli-aqueous-dagger
  KNOWLEDGE_INDEX: database/engine-fragment-flow-index.json

jobs:
  regression:
    name: Validate learned Aqueous Dagger references
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test autonomous solver routing
        run: python -m unittest tests.test_autonomous_solver -v

      - name: Fetch only the official event puzzle
        run: |
          python tools/import_critelli_event.py \
            --event-id "$EVENT_ID" \
            --event-page-url "$EVENT_PAGE" \
            --root "$REFERENCE_ROOT" \
            --puzzle-name weeklies2026_aqueous-dagger \
            --require-puzzle \
            --puzzle-only \
            --force

      - name: Validate persisted novel mechanisms
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python tools/validate_critelli_reference.py \
            --puzzle "$REFERENCE_ROOT/puzzle/weeklies2026_aqueous-dagger.puzzle" \
            --solutions-dir "$FIXTURE_ROOT/generated-novel" \
            --manifest "$FIXTURE_ROOT/manifest.json" \
            --output reports/critelli-aqueous-dagger-reference-regression.json \
            --strict

      - name: Solve clean checkout with committed objectives
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          test -f "$KNOWLEDGE_INDEX"
          python tools/solve_puzzle.py \
            "$REFERENCE_ROOT/puzzle/weeklies2026_aqueous-dagger.puzzle" \
            reports/critelli-aqueous-dagger-cycles.solution \
            --objective cycles \
            --composition-limit 10 \
            --report reports/critelli-aqueous-dagger-cycles.json
          python tools/solve_puzzle.py \
            "$REFERENCE_ROOT/puzzle/weeklies2026_aqueous-dagger.puzzle" \
            reports/critelli-aqueous-dagger-instructions.solution \
            --objective instructions \
            --composition-limit 10 \
            --report reports/critelli-aqueous-dagger-instructions.json
          python - <<'PY'
          import json
          from pathlib import Path

          cycles = json.loads(Path('reports/critelli-aqueous-dagger-cycles.json').read_text(encoding='utf-8'))
          instructions = json.loads(Path('reports/critelli-aqueous-dagger-instructions.json').read_text(encoding='utf-8'))
          cv = cycles['validation']
          iv = instructions['validation']
          cm = cv['localCandidateMetrics']
          im = iv['localCandidateMetrics']

          assert cv['complete'] is True and iv['complete'] is True
          assert cv['solverRoute'] == 'knowledge-fragment-composition-v1'
          assert iv['solverRoute'] == 'knowledge-fragment-composition-v1'
          assert cv['optimizationObjective'] == 'cycles'
          assert iv['optimizationObjective'] == 'instructions'
          assert cv['compositionCompleteCandidateCount'] >= 2
          assert iv['compositionCompleteCandidateCount'] == cv['compositionCompleteCandidateCount']
          assert cm['cycles'] <= im['cycles']
          assert im['instructions'] <= cm['instructions']
          assert cycles['knowledgeResolution']['flowIndex'] == 'database/engine-fragment-flow-index.json'
          assert cycles['knowledgeResolution']['flowIndexExplicit'] is False
          assert instructions['knowledgeResolution']['flowIndexExplicit'] is False
          print(json.dumps({
              'cycles': {
                  'rank': cv['compositionCandidateRank'],
                  'metrics': cm,
              },
              'instructions': {
                  'rank': iv['compositionCandidateRank'],
                  'metrics': im,
              },
              'completeCandidates': cv['compositionCompleteCandidateCount'],
          }, sort_keys=True))
          PY

      - name: Build compact learned knowledge index
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          fixture_root = Path('fixtures/reference/critelli-aqueous-dagger')
          puzzle_path = Path('.datasets/critelli-aqueous-dagger-reference/puzzle/weeklies2026_aqueous-dagger.puzzle')
          manifest = json.loads((fixture_root / 'manifest.json').read_text(encoding='utf-8'))
          results = [
              {
                  'status': 'engine-complete',
                  'puzzleId': manifest['puzzleFileId'],
                  'puzzlePath': str(puzzle_path),
                  'solutionPath': str(fixture_root / item['file']),
              }
              for item in manifest['novelFixtures']
          ]
          audit = {
              'schemaVersion': '0.2.0',
              'solutionRoot': '.',
              'summary': {'solutionCount': len(results)},
              'results': results,
          }
          Path('reports').mkdir(exist_ok=True)
          Path('reports/critelli-aqueous-dagger-mini-audit.json').write_text(
              json.dumps(audit, indent=2), encoding='utf-8'
          )
          PY
          python tools/build_engine_fragment_flow_index.py \
            --audit reports/critelli-aqueous-dagger-mini-audit.json \
            --workers 6 \
            --sample-limit 6 \
            --output reports/critelli-aqueous-dagger-mini-engine-flow.json
          python - <<'PY'
          import json
          from pathlib import Path
          index = json.loads(Path('reports/critelli-aqueous-dagger-mini-engine-flow.json').read_text(encoding='utf-8'))
          summary = index['summary']
          assert summary['eligibleEngineCompleteSolutionCount'] == 6
          assert summary['replayValidatedSolutionCount'] == 6
          assert summary['validationDriftCount'] == 0
          assert summary['errorCount'] == 0
          assert all(
              str(path).startswith('fixtures/reference/critelli-aqueous-dagger/generated-novel/')
              for transition in index['transitions']
              for path in transition.get('sourceSolutions', [])
          )
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Refresh validated knowledge database
        if: github.ref_name == 'feature/critelli-2026-public-corpus' && github.actor == 'Fandalah-tech'
        run: |
          if ! cmp -s reports/critelli-aqueous-dagger-mini-engine-flow.json "$KNOWLEDGE_INDEX"; then
            cp reports/critelli-aqueous-dagger-mini-engine-flow.json "$KNOWLEDGE_INDEX"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$KNOWLEDGE_INDEX"
          if git diff --cached --quiet; then
            echo "Knowledge index already current and reproducible."
            exit 0
          fi
          git commit -m "Update validated learned knowledge index [skip ci]"
          git fetch origin feature/critelli-2026-public-corpus
          git rebase origin/feature/critelli-2026-public-corpus
          git push origin HEAD:feature/critelli-2026-public-corpus

      - name: Write regression summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          def load(path, fallback):
              path = Path(path)
              return json.loads(path.read_text(encoding='utf-8')) if path.exists() else fallback

          reference = load('reports/critelli-aqueous-dagger-reference-regression.json', {'summary': {}})
          cycles = load('reports/critelli-aqueous-dagger-cycles.json', {'validation': {}})
          instructions = load('reports/critelli-aqueous-dagger-instructions.json', {'validation': {}})
          cv = cycles.get('validation', {})
          iv = instructions.get('validation', {})
          summary = {
              **reference.get('summary', {}),
              'autonomousCyclesComplete': bool(cv.get('complete')),
              'autonomousCyclesRank': cv.get('compositionCandidateRank'),
              'autonomousCyclesLocalMetrics': cv.get('localCandidateMetrics'),
              'autonomousInstructionsComplete': bool(iv.get('complete')),
              'autonomousInstructionsRank': iv.get('compositionCandidateRank'),
              'autonomousInstructionsLocalMetrics': iv.get('localCandidateMetrics'),
              'autonomousCompleteCandidates': cv.get('compositionCompleteCandidateCount'),
              'autonomousKnowledgeIndex': cycles.get('knowledgeResolution', {}).get('flowIndex'),
          }
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('## Aqueous Dagger learned-reference regression\n\n')
              for key, value in summary.items():
                  out.write(f'- {key}: {value}\n')
          print(json.dumps(summary))
          PY

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critelli-aqueous-dagger-reference-${{ github.run_id }}
          path: |
            reports/critelli-aqueous-dagger-reference-regression.json
            reports/critelli-aqueous-dagger-mini-engine-flow.json
            reports/critelli-aqueous-dagger-cycles.json
            reports/critelli-aqueous-dagger-cycles.solution
            reports/critelli-aqueous-dagger-instructions.json
            reports/critelli-aqueous-dagger-instructions.solution
          if-no-files-found: warn
          retention-days: 30
