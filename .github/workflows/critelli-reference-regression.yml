name: Critelli reference regression

on:
  push:
    branches:
      - main
      - feature/critelli-2026-public-corpus
    paths:
      - .github/workflows/critelli-reference-regression.yml
      - fixtures/reference/critelli-aqueous-dagger/**
      - tools/import_critelli_event.py
      - tools/validate_critelli_reference.py
      - tools/solve_puzzle.py
      - tools/build_engine_fragment_flow_index.py
      - tests/test_autonomous_solver.py
      - packages/opus_analysis/**
      - packages/opus_engine/**
      - packages/opus_parser/**
      - packages/opus_solver/**
  workflow_dispatch:

permissions:
  contents: read

env:
  EVENT_ID: 31a11c8c2b284d8f0664f3f069f9e11e
  EVENT_PAGE: https://events.critelli.technology/OM2026Weeklies6_AqueousDagger
  REFERENCE_ROOT: .datasets/critelli-aqueous-dagger-reference
  FIXTURE_ROOT: fixtures/reference/critelli-aqueous-dagger

jobs:
  regression:
    name: Validate learned Aqueous Dagger references
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test autonomous solver routing
        run: python -m unittest tests.test_autonomous_solver -v

      - name: Fetch only the official event puzzle
        run: |
          python tools/import_critelli_event.py \
            --event-id "$EVENT_ID" \
            --event-page-url "$EVENT_PAGE" \
            --root "$REFERENCE_ROOT" \
            --puzzle-name weeklies2026_aqueous-dagger \
            --require-puzzle \
            --puzzle-only \
            --force

      - name: Validate persisted novel mechanisms
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python tools/validate_critelli_reference.py \
            --puzzle "$REFERENCE_ROOT/puzzle/weeklies2026_aqueous-dagger.puzzle" \
            --solutions-dir "$FIXTURE_ROOT/generated-novel" \
            --manifest "$FIXTURE_ROOT/manifest.json" \
            --output reports/critelli-aqueous-dagger-reference-regression.json \
            --strict

      - name: Build compact learned knowledge index
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from packages.opus_parser import parse_solution, write_solution

          fixture_root = Path('fixtures/reference/critelli-aqueous-dagger')
          puzzle_path = Path('.datasets/critelli-aqueous-dagger-reference/puzzle/weeklies2026_aqueous-dagger.puzzle')
          mini_root = Path('reports/critelli-aqueous-dagger-mini-corpus')
          mini_root.mkdir(parents=True, exist_ok=True)
          manifest = json.loads((fixture_root / 'manifest.json').read_text(encoding='utf-8'))
          results = []
          for item in manifest['novelFixtures']:
              source = fixture_root / item['file']
              solution = parse_solution(source)
              # The generated fixtures intentionally omit the solved-metric block.
              # Engine-flow learning uses declared cycles as its replay horizon, so
              # attach the already-proven completion horizon without changing any
              # mechanism geometry or program instructions.
              solution['metrics'] = {
                  'cycles': int(item['engineRequestedCycles']),
                  'cost': 0,
                  'area': 0,
                  'instructions': 0,
              }
              destination = mini_root / Path(item['file']).name
              write_solution(solution, destination, version=7)
              results.append({
                  'status': 'engine-complete',
                  'puzzleId': manifest['puzzleFileId'],
                  'puzzlePath': str(puzzle_path),
                  'solutionPath': str(destination),
              })
          audit = {
              'schemaVersion': '0.1.0',
              'solutionRoot': '.',
              'summary': {'solutionCount': len(results)},
              'results': results,
          }
          Path('reports/critelli-aqueous-dagger-mini-audit.json').write_text(
              json.dumps(audit, indent=2), encoding='utf-8'
          )
          PY
          python tools/build_engine_fragment_flow_index.py \
            --audit reports/critelli-aqueous-dagger-mini-audit.json \
            --workers 6 \
            --sample-limit 6 \
            --output reports/critelli-aqueous-dagger-mini-engine-flow.json

      - name: Solve autonomously from learned knowledge
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python tools/solve_puzzle.py \
            "$REFERENCE_ROOT/puzzle/weeklies2026_aqueous-dagger.puzzle" \
            reports/critelli-aqueous-dagger-autonomous.solution \
            --flow-index reports/critelli-aqueous-dagger-mini-engine-flow.json \
            --fragment-index reports/critelli-aqueous-dagger-mini-engine-flow.json \
            --composition-limit 10 \
            --report reports/critelli-aqueous-dagger-autonomous.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('reports/critelli-aqueous-dagger-autonomous.json').read_text(encoding='utf-8'))
          validation = report['validation']
          assert validation['complete'] is True
          assert validation['solverRoute'] == 'knowledge-fragment-composition-v1'
          assert report['strategy'].startswith('paired-bonded-clusters-v1')
          print(json.dumps({
              'strategy': report['strategy'],
              'route': validation['solverRoute'],
              'candidateRank': validation['compositionCandidateRank'],
              'delivered': validation['totalDelivered'],
          }))
          PY

      - name: Write regression summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          reference_path = Path('reports/critelli-aqueous-dagger-reference-regression.json')
          autonomous_path = Path('reports/critelli-aqueous-dagger-autonomous.json')
          reference = json.loads(reference_path.read_text(encoding='utf-8')) if reference_path.exists() else {'summary': {}}
          autonomous = json.loads(autonomous_path.read_text(encoding='utf-8')) if autonomous_path.exists() else {'validation': {}}
          summary = {
              **reference.get('summary', {}),
              'autonomousComplete': bool(autonomous.get('validation', {}).get('complete')),
              'autonomousRoute': autonomous.get('validation', {}).get('solverRoute'),
              'autonomousStrategy': autonomous.get('strategy'),
              'autonomousCandidateRank': autonomous.get('validation', {}).get('compositionCandidateRank'),
          }
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('## Aqueous Dagger learned-reference regression\n\n')
              for key, value in summary.items():
                  out.write(f'- {key}: {value}\n')
          print(json.dumps(summary))
          PY

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critelli-aqueous-dagger-reference-${{ github.run_id }}
          path: |
            reports/critelli-aqueous-dagger-reference-regression.json
            reports/critelli-aqueous-dagger-mini-engine-flow.json
            reports/critelli-aqueous-dagger-autonomous.json
            reports/critelli-aqueous-dagger-autonomous.solution
          if-no-files-found: warn
          retention-days: 30
