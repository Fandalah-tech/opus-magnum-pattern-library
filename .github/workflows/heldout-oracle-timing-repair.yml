name: Blind GEN249 oracle timing repair

on:
  push:
    branches: [feature/critelli-2026-public-corpus]
    paths:
      - .github/workflows/heldout-oracle-timing-repair.yml
      - tools/run_holdout_oracle_timing_repair.py
      - reports/generated/heldout-24hour-seed/latest-oracle-beam-repair.json
  workflow_dispatch:

concurrency:
  group: heldout-gen249-oracle-timing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  BEAM_POINTER: reports/generated/heldout-24hour-seed/latest-oracle-beam-repair.json
  PUZZLE_ROOT: .datasets/heldout-oracle-timing
  BASELINE_ROOT: .baseline/heldout-oracle-timing
  REPORT_ROOT: reports/heldout-oracle-timing
  LATEST_REPORT: reports/generated/heldout-24hour-seed/latest-oracle-timing-repair.json
  OPUSSOLVER_COMMIT: fdedd3f01a238b941ceba8bace7ea35cbd3b8c41
  OMSIM_COMMIT: 758f4a4b4c9e24f50294801da774a0960c922bab

jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch GEN249 puzzle bytes only
        run: |
          mkdir -p .tools "$PUZZLE_ROOT"
          git clone --filter=blob:none --no-checkout https://github.com/gtw123/OpusSolver.git .tools/opussolver
          git -C .tools/opussolver sparse-checkout init --no-cone
          git -C .tools/opussolver sparse-checkout set test/puzzles/24hour-1-puzzles/GEN249.puzzle
          git -C .tools/opussolver checkout "$OPUSSOLVER_COMMIT"
          cp .tools/opussolver/test/puzzles/24hour-1-puzzles/GEN249.puzzle "$PUZZLE_ROOT"/
          if find .tools/opussolver -type f -name '*.solution' | grep -q .; then exit 1; fi

      - name: Restore target-free beam frontier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads(Path(os.environ['BEAM_POINTER']).read_text()); assert p['targetSolutionBytesUsed']==0; print(p['runId'])
          PY
          )"
          meta="$RUNNER_TEMP/beam.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" > "$meta"
          read -r artifact_id digest < <(python - "$meta" "$run_id" <<'PY'
          import json,sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text()); name=f'heldout-oracle-beam-repair-{sys.argv[2]}'; m=[x for x in d['artifacts'] if x['name']==name and not x['expired']]; assert len(m)==1; print(m[0]['id'],str(m[0]['digest']).split(':',1)[1])
          PY
          )
          mkdir -p "$BASELINE_ROOT"
          archive="$RUNNER_TEMP/beam.zip"
          curl --fail --location --retry 8 --retry-delay 2 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" -o "$archive"
          echo "$digest  $archive" | sha256sum --check
          unzip -q "$archive" -d "$BASELINE_ROOT"
          test -s "$BASELINE_ROOT/search/GEN249-best-oracle-beam.solution"

      - name: Build pinned OMSim
        run: |
          git clone https://github.com/ianh/omsim.git .tools/omsim
          git -C .tools/omsim checkout "$OMSIM_COMMIT"
          make -C .tools/omsim omsim

      - name: Search local timing perturbations at official collision
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p "$REPORT_ROOT/search"
          python tools/run_holdout_oracle_timing_repair.py \
            --omsim .tools/omsim/omsim \
            --puzzle "$PUZZLE_ROOT/GEN249.puzzle" \
            --baseline "$BASELINE_ROOT/search/GEN249-best-oracle-beam.solution" \
            --max-cycles 500 --window 8 --max-delay 8 \
            --output-dir "$REPORT_ROOT/search" \
            --output "$REPORT_ROOT/GEN249.json"

      - name: Persist timing checkpoint
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['REPORT_ROOT'])/'GEN249.json').read_text())
          payload={
            'schemaVersion':'0.1.0','kind':'heldout-oracle-timing-repair-checkpoint','runId':os.environ['GITHUB_RUN_ID'],'sourceCommit':os.environ['GITHUB_SHA'],
            'targetSolutionBytesUsed':0,'request':r.get('request'),'baselineOMSim':r.get('baselineOMSim'),'baselinePurificationProfile':r.get('baselinePurificationProfile'),
            'searchedVariantCount':r.get('searchedVariantCount'),'precursorPreservingCount':r.get('precursorPreservingCount'),'oracleAdvancingCount':r.get('oracleAdvancingCount'),
            'best':r.get('best'),'bestSolution':r.get('bestSolution'),'acceptedProductOne':r.get('acceptedProductOne'),'omsimCommit':os.environ['OMSIM_COMMIT'],
          }
          out=Path(os.environ['LATEST_REPORT']); out.parent.mkdir(parents=True,exist_ok=True); out.write_text(json.dumps(payload,indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LATEST_REPORT"
          git commit -m "Update blind oracle timing repair [skip ci]" || true
          git fetch origin feature/critelli-2026-public-corpus
          git rebase origin/feature/critelli-2026-public-corpus
          git push origin HEAD:feature/critelli-2026-public-corpus

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heldout-oracle-timing-repair-${{ github.run_id }}
          path: ${{ env.REPORT_ROOT }}/
          retention-days: 14
