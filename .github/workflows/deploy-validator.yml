name: Deploy validator and Solver Lab to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-validator.yml
      - packages/opus_parser/**
      - packages/opus_analysis/**
      - packages/opus_engine/**
      - packages/opus_solver/**
      - packages/opus_validator/**
      - services/validator/**
      - tools/omsim_adapter/**
      - "*.html"
      - assets/**
      - data/**
      - opusjs/**
      - samples/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: opus-magnum-codex
  PROJECT_NUMBER: "740016697359"
  REGION: northamerica-northeast1
  REPOSITORY: opus-services
  SERVICE: opus-validator
  IMAGE: northamerica-northeast1-docker.pkg.dev/opus-magnum-codex/opus-services/opus-validator
  WORKLOAD_IDENTITY_PROVIDER: projects/740016697359/locations/global/workloadIdentityPools/github-actions/providers/opus-pattern-library
  DEPLOYER_SERVICE_ACCOUNT: opus-github-deployer@opus-magnum-codex.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: opus-validator-runtime@opus-magnum-codex.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run SDK and renderer checks
        run: |
          python -m unittest discover -s packages/opus_parser/tests -v
          python -m unittest discover -s packages/opus_analysis/tests -v
          python -m unittest discover -s packages/opus_validator/tests -v
          python -m py_compile tools/capture_visual_replay.py
          node --check assets/js/solution-viewer.js
          node --check assets/js/replay-molecules.js
          node --check assets/js/replay-arm-animation.js
          node --check assets/js/solution-viewer-bridge.js
          node --check assets/js/output-product-preview.js
          node --check assets/js/viewer-interactions.js
          node --check assets/js/used-area-overlay.js
          node --check assets/js/product-delivery-animation.js
          grep -F 'LAYER_ORDER = ["grid", "track", "glyph", "part", "bond", "atom", "arm", "overlay"]' assets/js/solution-viewer.js
          grep -F 'Output mode' assets/js/solution-viewer.js
          grep -F 'data-output-preview' assets/js/output-product-preview.js
          grep -F '__OPUS_CLEAR_SELECTION__' assets/js/viewer-interactions.js
          grep -F '__OPUS_USED_AREA__' assets/js/used-area-overlay.js
          grep -F 'product-delivered' assets/js/product-delivery-animation.js
          grep -F 'data-arm-shadow' assets/js/replay-arm-animation.js

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: northamerica-northeast1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push validator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/validator/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          region: ${{ env.REGION }}
          service: ${{ env.SERVICE }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          flags: >-
            --service-account=${{ env.RUNTIME_SERVICE_ACCOUNT }}
            --allow-unauthenticated
            --port=8080
            --cpu=1
            --memory=512Mi
            --min-instances=0
            --max-instances=2
            --concurrency=8
            --timeout=60

      - name: Verify deployed API and Solver Lab
        run: |
          BASE_URL="${{ steps.deploy.outputs.url }}"

          curl --fail --show-error --silent "${BASE_URL}/health" > health.json
          python - <<'PY'
          import json
          data = json.load(open('health.json'))
          assert data['status'] == 'ok'
          assert data['apiVersion'] == '1.9.0'
          PY

          curl --fail --show-error --silent "${BASE_URL}/openapi.json" > openapi.json
          python - <<'PY'
          import json
          data = json.load(open('openapi.json'))
          assert '/api/v1/analyze' in data['paths']
          assert '/api/v1/replay' in data['paths']
          assert '/api/v1/replay/legacy' in data['paths']
          assert '/api/v1/engine/replay' in data['paths']
          PY

          curl --fail --show-error --silent "${BASE_URL}/solver-lab.html" > solver-lab.html
          grep -F "P007 — Stabilized Water" solver-lab.html
          curl --fail --show-error --silent "${BASE_URL}/assets/css/solver-lab.css" > solver-lab.css
          curl --fail --show-error --silent "${BASE_URL}/assets/css/viewer-replay-enhancements.css" > viewer-replay-enhancements.css
          curl --fail --show-error --silent "${BASE_URL}/assets/js/solver-lab.js" > solver-lab.js
          curl --fail --show-error --silent "${BASE_URL}/assets/js/output-product-preview.js" > output-product-preview.js
          curl --fail --show-error --silent "${BASE_URL}/assets/js/viewer-interactions.js" > viewer-interactions.js
          curl --fail --show-error --silent "${BASE_URL}/assets/js/used-area-overlay.js" > used-area-overlay.js
          curl --fail --show-error --silent "${BASE_URL}/assets/js/product-delivery-animation.js" > product-delivery-animation.js
          test -s solver-lab.css
          test -s viewer-replay-enhancements.css
          test -s solver-lab.js
          test -s output-product-preview.js
          test -s viewer-interactions.js
          test -s used-area-overlay.js
          test -s product-delivery-animation.js
          curl --fail --show-error --silent "${BASE_URL}/samples/solver/P007.puzzle" > live-P007.puzzle
          curl --fail --show-error --silent "${BASE_URL}/samples/solver/P007-auto.solution" > live-P007-auto.solution
          cmp samples/solver/P007.puzzle live-P007.puzzle
          cmp samples/solver/P007-auto.solution live-P007-auto.solution

          curl --fail --show-error --silent \
            -F "puzzle=@live-P007.puzzle" \
            -F "solution=@live-P007-auto.solution" \
            "${BASE_URL}/api/v1/analyze" > live-analysis.json
          python - <<'PY'
          import json
          data = json.load(open('live-analysis.json'))
          validation = data['validation']
          replay = data['replay']
          assert validation['status'] == 'valid', validation
          assert validation['metrics']['cycles'] == 77, validation
          assert data['solution']['name'] == 'Opus Solver MVP - bonded pair v1'
          assert data['apiVersion'] == '1.9.0'
          assert replay['traceType'] == 'opus-engine-visual', replay
          assert replay['capabilities']['engineReplay'] is True, replay
          assert replay['capabilities']['bondState'] is True, replay
          assert replay['capabilities']['elementTransmutation'] is True, replay
          assert len(replay['frames']) == 78, len(replay['frames'])
          assert any(
              atom.get('element') == 'salt'
              for frame in replay['frames']
              for molecule in frame.get('molecules', [])
              for atom in molecule.get('atoms', [])
          ), 'No calcified salt atom found in visual replay'
          assert any(
              molecule.get('bonds')
              for frame in replay['frames']
              for molecule in frame.get('molecules', [])
          ), 'No bonder-created molecule found in visual replay'
          deliveries = [
              event
              for frame in replay['frames']
              for event in frame.get('events', [])
              if event.get('kind') == 'product-delivered'
          ]
          assert len(deliveries) == 6, deliveries
          assert all(event.get('atomIds') for event in deliveries)
          PY

      - name: Deployment summary
        run: |
          echo "### Cloud Run deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service: ${{ env.SERVICE }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Region: ${{ env.REGION }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Solver Lab: ${{ steps.deploy.outputs.url }}/solver-lab.html" >> "$GITHUB_STEP_SUMMARY"
          echo "- API version: 1.9.0" >> "$GITHUB_STEP_SUMMARY"
          echo "- Live P007 validation: 77 cycles" >> "$GITHUB_STEP_SUMMARY"
          echo "- Visual replay: delivery animation, clean arm motion, deselection, cumulative used area" >> "$GITHUB_STEP_SUMMARY"
          echo "- Visual archive workflow: one PNG per replay frame plus manifest" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: ${{ env.IMAGE }}:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
