name: Aqueous 27c Evolution Dashboard

on:
  pull_request:
    paths:
      - tools/search_aqueous_28c_single.py
      - tools/validate_aqueous_offsets.py
      - fixtures/weeklies2026/aqueous-dagger-27c-single-reference.solution.b64
      - .github/workflows/aqueous-28c-single-search.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}
  VALIDATOR_URL: https://opus-validator-6gflgqb25q-nn.a.run.app
  SEARCH_DIR: reports/aqueous-27c-evolution
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  search:
    name: 27c → 26c search
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Materialize puzzle + canonical 27c seed
        run: |
          mkdir -p reports
          python - <<'PY'
          import base64
          from pathlib import Path
          for src,dst in [
            ('fixtures/weeklies2026/aqueous-dagger.puzzle.b64','reports/aqueous-dagger.puzzle'),
            ('fixtures/weeklies2026/aqueous-dagger-27c-single-reference.solution.b64','reports/single27.solution')]:
              Path(dst).write_bytes(base64.b64decode(Path(src).read_text().strip()))
          PY

      - name: Validate 27c seed
        run: |
          curl --fail-with-body -sS \
            -F "puzzle=@reports/aqueous-dagger.puzzle" \
            -F "solution=@reports/single27.solution" \
            "${VALIDATOR_URL}/api/v1/analyze" > reports/single27.json
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('reports/single27.json').read_text()).get('validation',{})
          print(json.dumps(v, indent=2))
          if not v.get('valid') or v.get('metrics',{}).get('cycles') != 27:
              raise SystemExit('27c seed did not validate as expected')
          PY

      - name: Generate mutations from 27c
        run: >-
          python tools/search_aqueous_28c_single.py
          --fixture fixtures/weeklies2026/aqueous-dagger-27c-single-reference.solution.b64
          --out "${SEARCH_DIR}"

      - name: 🔴 LIVE SEARCH — dashboard updates every 10 candidates
        run: >-
          python tools/validate_aqueous_offsets.py
          --validator-url "${VALIDATOR_URL}"
          --variants "${SEARCH_DIR}"
          --workers 24
          --progress-every 10
          --seed-cycles 27
          --target-cycles 26
          --generation 1
          --live-repo "${GITHUB_REPOSITORY}"
          --live-branch aqueous-dashboard-live
          --live-path aqueous-dashboard/status.json

      - name: Build GitHub summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['SEARCH_DIR'])
          p=root/'results.json'
          if not p.exists():
              Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('# Aqueous Dagger — Evolution Dashboard\n\nSearch did not produce results.json.\n')
              raise SystemExit(0)
          r=json.loads(p.read_text())
          best=r.get('best') or {}
          tested=r.get('tested',0)
          valid=len(r.get('valid') or [])
          target=26
          bestc=r.get('bestCycles',27)
          hit = isinstance(bestc,int) and bestc <= target
          status='✅ TARGET REACHED' if hit else '🟡 SEARCH COMPLETE'
          mutation=best.get('kind','seed')
          lines=[
            '# Aqueous Dagger — Evolution Dashboard','',f'## {status}','',
            '| Metric | Value |','|---|---:|',
            '| Seed | **27 cycles** |',f'| Best | **{bestc} cycles** |',f'| Target | **{target} cycles** |',
            f'| Candidates tested | **{tested}** |',f'| Valid candidates | **{valid}** |',
            f'| Valid rate | **{(100*valid/tested if tested else 0):.1f}%** |',f'| Best mutation | `{mutation}` |','',
            'Live HTML: https://htmlpreview.github.io/?https://github.com/Fandalah-tech/opus-magnum-pattern-library/blob/aqueous-dashboard-live/aqueous-dashboard/index.html'
          ]
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines))
          PY

      - name: Upload best solution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqueous-best-solution
          path: |
            ${{ env.SEARCH_DIR }}/best.solution
            ${{ env.SEARCH_DIR }}/results.json
          if-no-files-found: warn
