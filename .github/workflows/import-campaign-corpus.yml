name: Import campaign corpus

on:
  workflow_dispatch:
    inputs:
      puzzle_limit:
        description: Maximum campaign puzzles to scan; leave empty for all
        required: false
        default: ""
      limit_per_puzzle:
        description: Maximum ZLBB solutions downloaded per puzzle
        required: false
        default: "3"
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-campaign-corpus.yml
      - tools/import_campaign_corpus.py

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium

      - name: Import campaign puzzles and ZLBB solutions
        env:
          PUZZLE_LIMIT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.puzzle_limit || '' }}
          LIMIT_PER_PUZZLE: ${{ github.event.inputs.limit_per_puzzle || '3' }}
        run: |
          args=(
            --root .datasets/campaign-corpus
            --limit-per-puzzle "$LIMIT_PER_PUZZLE"
            --force
          )
          if [[ -n "$PUZZLE_LIMIT" ]]; then
            args+=(--puzzle-limit "$PUZZLE_LIMIT")
          fi
          python tools/import_campaign_corpus.py "${args[@]}"

      - name: Summarize corpus
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('.datasets/campaign-corpus/index.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          successful = [item for item in data.get('solutions', []) if item.get('file')]
          failed = [item for item in data.get('solutions', []) if item.get('error')]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('## Campaign corpus import\n\n')
              out.write(f"- Campaign puzzles indexed: {data.get('puzzleCount', 0)}\n")
              out.write(f"- Solutions downloaded: {len(successful)}\n")
              out.write(f"- Failed puzzle/download records: {len(failed)}\n")
              if failed:
                  out.write('\n### First failures\n\n')
                  for item in failed[:20]:
                      out.write(f"- {item.get('puzzleId')}: {item.get('error')}\n")
          PY

      - name: Upload campaign corpus
        uses: actions/upload-artifact@v4
        with:
          name: campaign-corpus-${{ github.run_id }}
          path: .datasets/campaign-corpus/
          if-no-files-found: error
          retention-days: 30
