name: Import campaign corpus

on:
  workflow_dispatch:
    inputs:
      puzzle_limit:
        description: Maximum campaign puzzles to scan; leave empty for all
        required: false
        default: ""
      limit_per_puzzle:
        description: Maximum ZLBB solutions downloaded per puzzle
        required: false
        default: "3"
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-campaign-corpus.yml
      - tools/import_campaign_corpus.py
      - tools/audit_campaign_corpus.py
      - packages/opus_engine/**
      - packages/opus_analysis/**
      - packages/opus_parser/**

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore campaign corpus
        id: corpus_cache
        uses: actions/cache@v4
        with:
          path: .datasets/campaign-corpus
          key: opus-campaign-corpus-v1-3-per-puzzle

      - name: Install Playwright
        if: steps.corpus_cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium

      - name: Import campaign puzzles and ZLBB solutions
        if: steps.corpus_cache.outputs.cache-hit != 'true'
        env:
          PUZZLE_LIMIT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.puzzle_limit || '' }}
          LIMIT_PER_PUZZLE: ${{ github.event.inputs.limit_per_puzzle || '3' }}
        run: |
          args=(
            --root .datasets/campaign-corpus
            --limit-per-puzzle "$LIMIT_PER_PUZZLE"
            --force
          )
          if [[ -n "$PUZZLE_LIMIT" ]]; then
            args+=(--puzzle-limit "$PUZZLE_LIMIT")
          fi
          python tools/import_campaign_corpus.py "${args[@]}"

      - name: Trace P041 with OMSim
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/ianh/omsim.git /tmp/omsim
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/omsim/sim.c')
          text = path.read_text()
          needle = '        consume_outputs(solution, board);\n'
          injected = '''        consume_outputs(solution, board);
          if (board->cycle >= 218 && board->cycle <= 245) {
              struct vector p1 = {1, -1};
              struct vector p2 = {2, -1};
              struct vector p0 = {0, -1};
              struct vector p3 = {0, -3};
              atom a1 = *lookup_atom(board, p1);
              atom a2 = *lookup_atom(board, p2);
              atom a0 = *lookup_atom(board, p0);
              atom a3 = *lookup_atom(board, p3);
              fprintf(stderr, "TRACE cycle=%llu half=%u p1=%016llx p2=%016llx p0m1=%016llx p0m3=%016llx",
                      (unsigned long long)board->cycle, board->half_cycle,
                      (unsigned long long)a1, (unsigned long long)a2,
                      (unsigned long long)a0, (unsigned long long)a3);
              for (size_t debug_i = 0; debug_i < solution->number_of_arms; ++debug_i) {
                  struct mechanism debug_arm = solution->arms[debug_i];
                  fprintf(stderr, " arm%zu=(%d,%d du=%d,%d type=%08x move=%d,%d rot=%d)",
                          debug_i, debug_arm.position.u, debug_arm.position.v,
                          debug_arm.direction_u.u, debug_arm.direction_u.v,
                          debug_arm.type, debug_arm.movement.u, debug_arm.movement.v,
                          debug_arm.arm_rotation);
              }
              fputc('\\n', stderr);
          }
          if ((board->cycle == 236 || board->cycle == 237) && board->half_cycle == 2) {
              fprintf(stderr, "WHEELGRID cycle=%llu half=%u", (unsigned long long)board->cycle, board->half_cycle);
              for (int v = 1; v >= -4; --v) {
                  for (int u = -4; u <= 1; ++u) {
                      struct vector p = {u, v};
                      atom a = *lookup_atom(board, p);
                      if ((a & VALID) && !(a & REMOVED))
                          fprintf(stderr, " (%d,%d)=%016llx", u, v, (unsigned long long)a);
                  }
              }
              fprintf(stderr, " overlaps=%u", board->number_of_overlapped_atoms);
              for (uint32_t oi = 0; oi < board->number_of_overlapped_atoms; ++oi) {
                  struct atom_at_position oa = board->overlapped_atoms[oi];
                  fprintf(stderr, " ov(%d,%d)=%016llx", oa.position.u, oa.position.v,
                          (unsigned long long)oa.atom);
              }
              fputc('\\n', stderr);
          }
          '''
          if needle not in text:
              raise SystemExit('injection point not found')
          path.write_text(text.replace(needle, injected, 1))
          PY
          make -C /tmp/omsim
          puzzle=$(find .datasets/campaign-corpus/puzzles -name 'P041.puzzle' -print -quit)
          solution=$(find .datasets/campaign-corpus/solutions/zlbb/P041 -name '002-*.solution' -print -quit)
          /tmp/omsim/omsim --disable-limits --metric cycles --puzzle-file "$puzzle" "$solution" 2> /tmp/p041-trace.log
          echo '--- OMSim focused trace ---'
          grep -E 'cycle=(21[8-9]|22[0-9]|23[0-9]|24[0-5]) |WHEELGRID' /tmp/p041-trace.log

      - name: Audit solutions against opus_engine
        id: engine_audit
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python tools/audit_campaign_corpus.py \
            --root .datasets/campaign-corpus \
            --output reports/campaign-corpus-audit.json

      - name: Summarize corpus
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          corpus = json.loads(Path('.datasets/campaign-corpus/index.json').read_text(encoding='utf-8'))
          audit_path = Path('reports/campaign-corpus-audit.json')
          audit = json.loads(audit_path.read_text(encoding='utf-8')) if audit_path.exists() else {'summary': {}}
          successful = [item for item in corpus.get('solutions', []) if item.get('file')]
          failed = [item for item in corpus.get('solutions', []) if item.get('error')]
          summary = audit.get('summary', {})
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('## Campaign corpus audit\n\n')
              out.write(f"- Campaign puzzles indexed: {corpus.get('puzzleCount', 0)}\n")
              out.write(f"- Solutions downloaded: {len(successful)}\n")
              out.write(f"- Download errors: {len(failed)}\n")
              out.write(f"- Engine complete: {summary.get('engineComplete', 0)}\n")
              out.write(f"- Engine incomplete: {summary.get('engineIncomplete', 0)}\n")
              out.write(f"- Semantic gaps: {summary.get('semanticGaps', 0)}\n")
              out.write(f"- Engine errors: {summary.get('engineErrors', 0)}\n")
          PY

      - name: Upload campaign corpus and audit
        uses: actions/upload-artifact@v4
        with:
          name: campaign-corpus-${{ github.run_id }}
          path: |
            .datasets/campaign-corpus/
            reports/campaign-corpus-audit.json
          if-no-files-found: error
          retention-days: 30
