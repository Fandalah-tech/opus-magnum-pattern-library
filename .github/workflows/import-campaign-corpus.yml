name: Build training corpus

on:
  workflow_dispatch:
    inputs:
      puzzle_limit:
        description: Maximum campaign puzzles to scan; leave empty for all
        required: false
        default: ""
      limit_per_puzzle:
        description: Maximum ZLBB solutions per puzzle; leave empty for all
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-campaign-corpus.yml
      - tools/import_campaign_corpus.py
      - tools/import_external_puzzle_corpus.py
      - tools/audit_campaign_corpus.py
      - datasets/registry.json
      - packages/opus_engine/**
      - packages/opus_analysis/**
      - packages/opus_parser/**

permissions:
  contents: read

env:
  CAMPAIGN_ROOT: .datasets/campaign-corpus
  EXTERNAL_ROOT: .datasets/external-corpus

jobs:
  campaign:
    name: Full campaign + ZLBB corpus
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore full corpus cache
        uses: actions/cache@v4
        with:
          path: .datasets/campaign-corpus
          key: opus-campaign-corpus-full-v3-${{ github.ref_name }}
          restore-keys: |
            opus-campaign-corpus-full-v3-
            opus-campaign-corpus-

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium

      - name: Import campaign puzzles and all available ZLBB records
        env:
          PUZZLE_LIMIT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.puzzle_limit || '' }}
          LIMIT_PER_PUZZLE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.limit_per_puzzle || '' }}
        run: |
          args=(--root "$CAMPAIGN_ROOT")
          if [[ -n "$PUZZLE_LIMIT" ]]; then
            args+=(--puzzle-limit "$PUZZLE_LIMIT")
          fi
          if [[ -n "$LIMIT_PER_PUZZLE" ]]; then
            args+=(--limit-per-puzzle "$LIMIT_PER_PUZZLE")
          fi
          python tools/import_campaign_corpus.py "${args[@]}"

      - name: Audit all downloaded solutions against opus_engine
        id: engine_audit
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python tools/audit_campaign_corpus.py \
            --root "$CAMPAIGN_ROOT" \
            --output reports/campaign-corpus-audit.json

      - name: Write campaign summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          index_path = Path('.datasets/campaign-corpus/index.json')
          index = json.loads(index_path.read_text(encoding='utf-8')) if index_path.exists() else {}
          audit_path = Path('reports/campaign-corpus-audit.json')
          audit = json.loads(audit_path.read_text(encoding='utf-8')) if audit_path.exists() else {'summary': {}}
          summary = audit.get('summary', {})
          payload = {
              'campaignPuzzles': index.get('puzzleCount', 0),
              'solutionRecords': index.get('solutionRecordCount', 0),
              'solutionFiles': index.get('solutionFileCount', 0),
              'downloadErrors': index.get('solutionErrorCount', 0),
              'engineComplete': summary.get('engineComplete', 0),
              'engineIncomplete': summary.get('engineIncomplete', 0),
              'engineErrors': summary.get('engineErrors', 0),
          }
          Path('reports').mkdir(exist_ok=True)
          Path('reports/training-corpus-campaign-summary.json').write_text(json.dumps(payload, indent=2), encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('## Training corpus — campaign/ZLBB\n\n')
              for key, value in payload.items():
                  out.write(f'- {key}: {value}\n')
          print(json.dumps(payload))
          PY

      - name: Upload campaign corpus checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-corpus-campaign-${{ github.run_id }}
          path: |
            .datasets/campaign-corpus/
            reports/campaign-corpus-audit.json
            reports/training-corpus-campaign-summary.json
          if-no-files-found: warn
          retention-days: 30

  external:
    name: 24 Hour Challenge puzzle corpora
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore external corpus cache
        uses: actions/cache@v4
        with:
          path: .datasets/external-corpus
          key: opus-external-puzzle-corpus-v1

      - name: Download and inventory registered external puzzle corpora
        run: |
          python tools/import_external_puzzle_corpus.py \
            --registry datasets/registry.json \
            --root "$EXTERNAL_ROOT"

      - name: Write external summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          index = json.loads(Path('.datasets/external-corpus/index.json').read_text(encoding='utf-8'))
          payload = {
              'externalDatasets': index.get('datasetCount', 0),
              'externalPuzzles': index.get('puzzleCount', 0),
              'byDataset': {item['id']: item.get('puzzleCount', 0) for item in index.get('datasets', [])},
          }
          Path('reports').mkdir(exist_ok=True)
          Path('reports/training-corpus-external-summary.json').write_text(json.dumps(payload, indent=2), encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('## Training corpus — external puzzles\n\n')
              out.write(f"- datasets: {payload['externalDatasets']}\n")
              out.write(f"- puzzles: {payload['externalPuzzles']}\n")
              for key, value in payload['byDataset'].items():
                  out.write(f'- {key}: {value}\n')
          print(json.dumps(payload))
          PY

      - name: Upload external corpus checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: training-corpus-external-${{ github.run_id }}
          path: |
            .datasets/external-corpus/
            reports/training-corpus-external-summary.json
          if-no-files-found: error
          retention-days: 30
