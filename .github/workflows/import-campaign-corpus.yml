name: Import campaign corpus

on:
  workflow_dispatch:
    inputs:
      puzzle_limit:
        description: Maximum campaign puzzles to scan; leave empty for all
        required: false
        default: ""
      limit_per_puzzle:
        description: Maximum ZLBB solutions downloaded per puzzle
        required: false
        default: "3"
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-campaign-corpus.yml
      - tools/import_campaign_corpus.py
      - tools/audit_campaign_corpus.py
      - tools/audit_first_solver.py
      - tools/solve_puzzle.py
      - packages/opus_engine/**
      - packages/opus_analysis/**
      - packages/opus_parser/**
      - packages/opus_solver/**

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore campaign corpus
        id: corpus_cache
        uses: actions/cache@v4
        with:
          path: .datasets/campaign-corpus
          key: opus-campaign-corpus-v1-3-per-puzzle

      - name: Install Playwright
        if: steps.corpus_cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium

      - name: Import campaign puzzles and ZLBB solutions
        if: steps.corpus_cache.outputs.cache-hit != 'true'
        env:
          PUZZLE_LIMIT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.puzzle_limit || '' }}
          LIMIT_PER_PUZZLE: ${{ github.event.inputs.limit_per_puzzle || '3' }}
        run: |
          args=(
            --root .datasets/campaign-corpus
            --limit-per-puzzle "$LIMIT_PER_PUZZLE"
            --force
          )
          if [[ -n "$PUZZLE_LIMIT" ]]; then
            args+=(--puzzle-limit "$PUZZLE_LIMIT")
          fi
          python tools/import_campaign_corpus.py "${args[@]}"

      - name: Audit solutions against opus_engine
        id: engine_audit
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python tools/audit_campaign_corpus.py \
            --root .datasets/campaign-corpus \
            --output reports/campaign-corpus-audit.json

      - name: Generate first autonomous campaign solution
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python tools/audit_first_solver.py \
            --root .datasets/campaign-corpus \
            --output-dir reports/generated

      - name: Validate autonomous solution with OMSim
        run: |
          git clone --depth 1 https://github.com/ianh/omsim.git /tmp/omsim
          make -C /tmp/omsim
          puzzle=$(find .datasets/campaign-corpus/puzzles -name 'P007.puzzle' -print -quit)
          /tmp/omsim/omsim \
            --disable-limits \
            --metric cycles \
            --puzzle-file "$puzzle" \
            reports/generated/P007-auto.solution

      - name: Summarize corpus
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          corpus = json.loads(Path('.datasets/campaign-corpus/index.json').read_text(encoding='utf-8'))
          audit_path = Path('reports/campaign-corpus-audit.json')
          audit = json.loads(audit_path.read_text(encoding='utf-8')) if audit_path.exists() else {'summary': {}}
          solver = json.loads(Path('reports/generated/P007-auto.json').read_text(encoding='utf-8'))
          successful = [item for item in corpus.get('solutions', []) if item.get('file')]
          failed = [item for item in corpus.get('solutions', []) if item.get('error')]
          summary = audit.get('summary', {})
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('## Campaign corpus audit\n\n')
              out.write(f"- Campaign puzzles indexed: {corpus.get('puzzleCount', 0)}\n")
              out.write(f"- Solutions downloaded: {len(successful)}\n")
              out.write(f"- Download errors: {len(failed)}\n")
              out.write(f"- Engine complete: {summary.get('engineComplete', 0)}\n")
              out.write(f"- Engine incomplete: {summary.get('engineIncomplete', 0)}\n")
              out.write(f"- Semantic gaps: {summary.get('semanticGaps', 0)}\n")
              out.write(f"- Engine errors: {summary.get('engineErrors', 0)}\n")
              out.write('\n## First autonomous solve\n\n')
              out.write(f"- Puzzle: {solver.get('puzzleName')}\n")
              out.write(f"- Strategy: {solver.get('strategy')}\n")
              out.write(f"- Engine complete: {solver.get('roundTripValidation', {}).get('complete')}\n")
              out.write(f"- Matches a reference file: {solver.get('matchesReferenceSolution')}\n")
          PY

      - name: Upload campaign corpus and audit
        uses: actions/upload-artifact@v4
        with:
          name: campaign-corpus-${{ github.run_id }}
          path: |
            .datasets/campaign-corpus/
            reports/campaign-corpus-audit.json
            reports/generated/P007-auto.solution
            reports/generated/P007-auto.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce complete campaign regression
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(
              Path('reports/campaign-corpus-audit.json').read_text(encoding='utf-8')
          )['summary']
          solver = json.loads(
              Path('reports/generated/P007-auto.json').read_text(encoding='utf-8')
          )
          total = int(summary.get('total', 0))
          complete = int(summary.get('engineComplete', 0))
          incomplete = int(summary.get('engineIncomplete', 0))
          gaps = int(summary.get('semanticGaps', 0))
          errors = int(summary.get('engineErrors', 0))
          solver_complete = bool(solver.get('roundTripValidation', {}).get('complete'))
          copied_reference = bool(solver.get('matchesReferenceSolution'))
          if total != 108 or complete != total or incomplete or gaps or errors:
              raise SystemExit(
                  f"Campaign regression failed: total={total}, complete={complete}, "
                  f"incomplete={incomplete}, semanticGaps={gaps}, errors={errors}"
              )
          if not solver_complete or copied_reference:
              raise SystemExit(
                  f"Autonomous solve failed: complete={solver_complete}, "
                  f"matchesReferenceSolution={copied_reference}"
              )
          print(f"Campaign regression passed: {complete}/{total}")
          print("Autonomous solve passed: P007")
          PY
