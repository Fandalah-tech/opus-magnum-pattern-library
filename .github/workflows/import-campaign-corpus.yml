name: Import campaign corpus

on:
  workflow_dispatch:
    inputs:
      puzzle_limit:
        description: Maximum campaign puzzles to scan; leave empty for all
        required: false
        default: ""
      limit_per_puzzle:
        description: Maximum ZLBB solutions downloaded per puzzle
        required: false
        default: "3"
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-campaign-corpus.yml
      - tools/import_campaign_corpus.py
      - tools/audit_campaign_corpus.py
      - packages/opus_engine/**
      - packages/opus_analysis/**
      - packages/opus_parser/**

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium

      - name: Import campaign puzzles and ZLBB solutions
        env:
          PUZZLE_LIMIT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.puzzle_limit || '' }}
          LIMIT_PER_PUZZLE: ${{ github.event.inputs.limit_per_puzzle || '3' }}
        run: |
          args=(
            --root .datasets/campaign-corpus
            --limit-per-puzzle "$LIMIT_PER_PUZZLE"
            --force
          )
          if [[ -n "$PUZZLE_LIMIT" ]]; then
            args+=(--puzzle-limit "$PUZZLE_LIMIT")
          fi
          python tools/import_campaign_corpus.py "${args[@]}"

      - name: Audit solutions against opus_engine
        id: engine_audit
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python tools/audit_campaign_corpus.py \
            --root .datasets/campaign-corpus \
            --output reports/campaign-corpus-audit.json

      - name: Summarize corpus
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          corpus = json.loads(Path('.datasets/campaign-corpus/index.json').read_text(encoding='utf-8'))
          audit_path = Path('reports/campaign-corpus-audit.json')
          audit = json.loads(audit_path.read_text(encoding='utf-8')) if audit_path.exists() else {'summary': {}}
          successful = [item for item in corpus.get('solutions', []) if item.get('file')]
          failed = [item for item in corpus.get('solutions', []) if item.get('error')]
          summary = audit.get('summary', {})
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('## Campaign corpus import\n\n')
              out.write(f"- Campaign puzzles indexed: {corpus.get('puzzleCount', 0)}\n")
              out.write(f"- Solutions downloaded: {len(successful)}\n")
              out.write(f"- Download errors: {len(failed)}\n")
              out.write(f"- Engine simulations completed: {summary.get('simulated', 0)}\n")
              out.write(f"- Engine errors: {summary.get('engineErrors', 0)}\n")
              failures = [item for item in audit.get('results', []) if item.get('status') == 'engine-error']
              if failures:
                  out.write('\n### First engine failures\n\n')
                  for item in failures[:20]:
                      out.write(f"- {item.get('puzzleId')} [{', '.join(item.get('partTypes', []))}]: {item.get('message')}\n")
          PY

      - name: Upload campaign corpus and audit
        uses: actions/upload-artifact@v4
        with:
          name: campaign-corpus-${{ github.run_id }}
          path: |
            .datasets/campaign-corpus/
            reports/campaign-corpus-audit.json
          if-no-files-found: error
          retention-days: 30
