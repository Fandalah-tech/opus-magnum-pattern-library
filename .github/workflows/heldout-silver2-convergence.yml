name: Blind GEN249 silver2 convergence

on:
  push:
    branches: [feature/critelli-2026-public-corpus]
    paths:
      - .github/workflows/heldout-silver2-convergence.yml
      - reports/generated/heldout-24hour-seed/latest-post-detour-chemistry.json
      - packages/opus_solver/intermediate_convergence.py
      - tools/probe_holdout_intermediate_convergence.py
      - packages/opus_engine/**
      - packages/opus_analysis/**
  workflow_dispatch:

concurrency:
  group: heldout-gen249-silver2-convergence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  CHEMISTRY_POINTER: reports/generated/heldout-24hour-seed/latest-post-detour-chemistry.json
  PUZZLE_ROOT: .datasets/heldout-silver2-convergence
  BASELINE_ROOT: .baseline/heldout-silver2-convergence
  REPORT_ROOT: reports/heldout-silver2-convergence
  LATEST_REPORT: reports/generated/heldout-24hour-seed/latest-silver2-convergence.json
  OPUSSOLVER_COMMIT: fdedd3f01a238b941ceba8bace7ea35cbd3b8c41
  OMSIM_COMMIT: 758f4a4b4c9e24f50294801da774a0960c922bab

jobs:
  convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch GEN249 puzzle bytes only
        run: |
          mkdir -p .tools "$PUZZLE_ROOT"
          git clone --filter=blob:none --no-checkout https://github.com/gtw123/OpusSolver.git .tools/opussolver
          git -C .tools/opussolver sparse-checkout init --no-cone
          git -C .tools/opussolver sparse-checkout set test/puzzles/24hour-1-puzzles/GEN249.puzzle
          git -C .tools/opussolver checkout "$OPUSSOLVER_COMMIT"
          cp .tools/opussolver/test/puzzles/24hour-1-puzzles/GEN249.puzzle "$PUZZLE_ROOT"/
          if find .tools/opussolver -type f -name '*.solution' | grep -q .; then exit 1; fi

      - name: Restore best target-free two-silver chemistry candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path(os.environ['CHEMISTRY_POINTER']).read_text()); assert p['targetSolutionBytesUsed']==0; print(p['runId'])
          PY
          )"
          meta="$RUNNER_TEMP/chemistry.json"; gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" > "$meta"
          read -r aid digest < <(python - "$meta" "$run_id" <<'PY'
          import json,sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text()); name=f'heldout-post-detour-chemistry-{sys.argv[2]}'; m=[x for x in d['artifacts'] if x['name']==name and not x['expired']]; assert len(m)==1; print(m[0]['id'],str(m[0]['digest']).split(':',1)[1])
          PY
          )
          mkdir -p "$BASELINE_ROOT"; archive="$RUNNER_TEMP/chemistry.zip"
          curl --fail --location -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}/zip" -o "$archive"
          echo "$digest  $archive" | sha256sum --check
          unzip -q "$archive" -d "$BASELINE_ROOT"
          candidate="$(python - "$BASELINE_ROOT/GEN249.json" <<'PY'
          import json,sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text()); variants=d.get('topVariants') or []
          def score(v):
              p=v.get('purificationProfile') or {}; c=p.get('countsByElement') or {}; o=v.get('omsim') or {}
              return (int(c.get('silver',0)),int(c.get('gold',0)),int(o.get('progressCycle',0)),int(p.get('count',0)))
          best=max(variants,key=score); assert int((best.get('purificationProfile') or {}).get('countsByElement',{}).get('silver',0))>=2; print(best['solutionPath'])
          PY
          )"
          seed="$(find "$BASELINE_ROOT" -type f -name "${candidate##*/}" | head -1)"
          test -s "$seed"; cp "$seed" "$BASELINE_ROOT/GEN249-silver2.solution"

      - name: Synthesize gold convergence locally
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p "$REPORT_ROOT"
          python tools/probe_holdout_intermediate_convergence.py \
            --puzzle "$PUZZLE_ROOT/GEN249.puzzle" \
            --baseline-solution "$BASELINE_ROOT/GEN249-silver2.solution" \
            --element silver --max-cycles 500 --observation-limit 160 --result-limit 24 \
            --solution-output "$REPORT_ROOT/GEN249-gold-convergence.solution" \
            --output "$REPORT_ROOT/GEN249.json"
          test -s "$REPORT_ROOT/GEN249-gold-convergence.solution"

      - name: Build pinned OMSim
        run: |
          git clone https://github.com/ianh/omsim.git .tools/omsim
          git -C .tools/omsim checkout "$OMSIM_COMMIT"
          make -C .tools/omsim omsim

      - name: Validate gold convergence with OMSim
        run: |
          set +e
          output="$(.tools/omsim/omsim --puzzle-file "$PUZZLE_ROOT/GEN249.puzzle" --metric "product 1 cycles" "$REPORT_ROOT/GEN249-gold-convergence.solution" 2>&1)"; rc=$?
          set -e
          python - "$REPORT_ROOT/omsim.json" "$rc" "$output" <<'PY'
          import json,os,re,sys
          from pathlib import Path
          text=sys.argv[3]; m=re.search(r'collision during motion phase on cycle (\d+) at (-?\d+) (-?\d+)',text)
          Path(sys.argv[1]).write_text(json.dumps({'exitCode':int(sys.argv[2]),'output':text,'collisionCycle':int(m.group(1)) if m else None,'collisionLocation':[int(m.group(2)),int(m.group(3))] if m else None,'omsimCommit':os.environ['OMSIM_COMMIT'],'targetSolutionBytesUsed':0},indent=2)+'\n')
          PY

      - name: Persist compact convergence checkpoint
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          local=json.loads((Path(os.environ['REPORT_ROOT'])/'GEN249.json').read_text()); oracle=json.loads((Path(os.environ['REPORT_ROOT'])/'omsim.json').read_text()); source=json.loads(Path(os.environ['CHEMISTRY_POINTER']).read_text())
          payload={'schemaVersion':'0.2.0','kind':'heldout-silver2-convergence-checkpoint','runId':os.environ['GITHUB_RUN_ID'],'sourceCommit':os.environ['GITHUB_SHA'],'chemistryRunId':source['runId'],'targetSolutionBytesUsed':0,'summary':local['summary'],'baselinePurificationProfile':local['baselinePurificationProfile'],'observations':local['observations'],'variants':local['variants'],'omsim':oracle}
          out=Path(os.environ['LATEST_REPORT']); out.parent.mkdir(parents=True,exist_ok=True); out.write_text(json.dumps(payload,indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LATEST_REPORT"; git commit -m "Update blind silver2 convergence [skip ci]" || true
          git fetch origin feature/critelli-2026-public-corpus; git rebase origin/feature/critelli-2026-public-corpus; git push origin HEAD:feature/critelli-2026-public-corpus

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heldout-silver2-convergence-${{ github.run_id }}
          path: ${{ env.REPORT_ROOT }}/
          retention-days: 14
