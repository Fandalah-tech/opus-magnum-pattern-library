name: Blind GEN249 one-time transport delay

on:
  push:
    branches: [feature/critelli-2026-public-corpus]
    paths:
      - .github/workflows/heldout-one-time-transport-delay.yml
      - tools/run_holdout_one_time_transport_delay.py
      - reports/generated/heldout-24hour-seed/latest-oracle-base-repair.json
      - packages/opus_analysis/**
      - packages/opus_engine/**
  workflow_dispatch:

concurrency:
  group: heldout-gen249-one-time-delay-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  ORACLE_POINTER: reports/generated/heldout-24hour-seed/latest-oracle-base-repair.json
  PUZZLE_ROOT: .datasets/heldout-one-time-delay
  BASELINE_ROOT: .baseline/heldout-one-time-delay
  REPORT_ROOT: reports/heldout-one-time-delay
  LATEST_REPORT: reports/generated/heldout-24hour-seed/latest-one-time-transport-delay.json
  OPUSSOLVER_COMMIT: fdedd3f01a238b941ceba8bace7ea35cbd3b8c41
  OMSIM_COMMIT: 758f4a4b4c9e24f50294801da774a0960c922bab

jobs:
  delay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch GEN249 puzzle bytes only
        run: |
          mkdir -p .tools "$PUZZLE_ROOT"
          git clone --filter=blob:none --no-checkout https://github.com/gtw123/OpusSolver.git .tools/opussolver
          git -C .tools/opussolver sparse-checkout init --no-cone
          git -C .tools/opussolver sparse-checkout set test/puzzles/24hour-1-puzzles/GEN249.puzzle
          git -C .tools/opussolver checkout "$OPUSSOLVER_COMMIT"
          cp .tools/opussolver/test/puzzles/24hour-1-puzzles/GEN249.puzzle "$PUZZLE_ROOT"/
          if find .tools/opussolver -type f -name '*.solution' | grep -q .; then exit 1; fi

      - name: Restore oracle-repaired target-free seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path(os.environ['ORACLE_POINTER']).read_text()); assert p['targetSolutionBytesUsed']==0; print(p['runId'])
          PY
          )"
          meta="$RUNNER_TEMP/oracle.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" > "$meta"
          read -r aid digest < <(python - "$meta" "$run_id" <<'PY'
          import json,sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text()); name=f'heldout-oracle-base-repair-{sys.argv[2]}'; m=[x for x in d['artifacts'] if x['name']==name and not x['expired']]; assert len(m)==1; print(m[0]['id'],str(m[0]['digest']).split(':',1)[1])
          PY
          )
          mkdir -p "$BASELINE_ROOT"; archive="$RUNNER_TEMP/oracle.zip"
          curl --fail --location -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}/zip" -o "$archive"
          echo "$digest  $archive" | sha256sum --check
          unzip -q "$archive" -d "$BASELINE_ROOT"
          seed="$(find "$BASELINE_ROOT" -type f -name 'GEN249-best-oracle-base-repair.solution' | head -1)"
          test -s "$seed"; cp "$seed" "$BASELINE_ROOT/GEN249-oracle-seed.solution"

      - name: Build pinned OMSim
        run: |
          git clone https://github.com/ianh/omsim.git .tools/omsim
          git -C .tools/omsim checkout "$OMSIM_COMMIT"
          make -C .tools/omsim omsim

      - name: Search one-time delay
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p "$REPORT_ROOT/search"
          python tools/run_holdout_one_time_transport_delay.py \
            --omsim .tools/omsim/omsim \
            --puzzle "$PUZZLE_ROOT/GEN249.puzzle" \
            --baseline "$BASELINE_ROOT/GEN249-oracle-seed.solution" \
            --horizon 500 --radius 15 --max-delay 3 \
            --output-dir "$REPORT_ROOT/search" \
            --output "$REPORT_ROOT/GEN249.json"

      - name: Persist compact delay checkpoint
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads((Path(os.environ['REPORT_ROOT'])/'GEN249.json').read_text())
          oracle=json.loads(Path(os.environ['ORACLE_POINTER']).read_text())
          payload={
            'schemaVersion':'0.1.0','kind':'heldout-one-time-transport-delay-checkpoint',
            'runId':os.environ['GITHUB_RUN_ID'],'sourceCommit':os.environ['GITHUB_SHA'],
            'oracleRunId':oracle['runId'],'targetSolutionBytesUsed':0,
            'baselineOMSim':report['baselineOMSim'],'baselinePurificationProfile':report['baselinePurificationProfile'],
            'transportArmPartId':report.get('transportArmPartId'),'collisionCycleEvidence':report.get('collisionCycleEvidence'),
            'delayWindow':report.get('delayWindow'),'variantCount':report['variantCount'],
            'frontierPreservingVariantCount':report.get('frontierPreservingVariantCount',0),
            'best':report['best'],'topVariants':report['topVariants'],'omsimCommit':os.environ['OMSIM_COMMIT'],
          }
          out=Path(os.environ['LATEST_REPORT']); out.parent.mkdir(parents=True,exist_ok=True); out.write_text(json.dumps(payload,indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LATEST_REPORT"
          git commit -m "Update blind one-time transport delay [skip ci]" || true
          git fetch origin feature/critelli-2026-public-corpus
          git rebase origin/feature/critelli-2026-public-corpus
          git push origin HEAD:feature/critelli-2026-public-corpus

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heldout-one-time-delay-${{ github.run_id }}
          path: ${{ env.REPORT_ROOT }}/
          retention-days: 14
