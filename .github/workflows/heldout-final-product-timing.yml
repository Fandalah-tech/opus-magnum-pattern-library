name: Blind GEN249 final product timing

on:
  push:
    branches: [feature/critelli-2026-public-corpus]
    paths:
      - .github/workflows/heldout-final-product-timing.yml
      - tools/run_holdout_oracle_timing_repair.py
      - tools/run_holdout_oracle_timing_chain.py
      - reports/generated/heldout-24hour-seed/latest-adjacent-pair-artifact.json
      - packages/opus_analysis/**
      - packages/opus_engine/**
  workflow_dispatch:

concurrency:
  group: heldout-gen249-final-product-timing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  ADJACENT_POINTER: reports/generated/heldout-24hour-seed/latest-adjacent-pair-artifact.json
  RUN_POINTER: reports/generated/heldout-24hour-seed/latest-final-product-timing-run.json
  LATEST_REPORT: reports/generated/heldout-24hour-seed/latest-final-product-timing.json
  PUZZLE_ROOT: .datasets/heldout-final-product-timing
  BASELINE_ROOT: .baseline/heldout-final-product-timing
  REPORT_ROOT: reports/heldout-final-product-timing
  OPUSSOLVER_COMMIT: fdedd3f01a238b941ceba8bace7ea35cbd3b8c41
  OMSIM_COMMIT: 758f4a4b4c9e24f50294801da774a0960c922bab

jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Publish running pointer
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUN_POINTER']); p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps({
            'schemaVersion':'0.1.0','kind':'heldout-final-product-timing-run-pointer',
            'runId':os.environ['GITHUB_RUN_ID'],'runNumber':os.environ['GITHUB_RUN_NUMBER'],
            'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'status':'in_progress',
            'sourceCommit':os.environ['GITHUB_SHA'],'targetSolutionBytesUsed':0,
          },indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RUN_POINTER"
          git commit -m "Record running blind final product timing [skip ci]"
          git fetch origin feature/critelli-2026-public-corpus
          git rebase origin/feature/critelli-2026-public-corpus
          git push origin HEAD:feature/critelli-2026-public-corpus

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch GEN249 puzzle bytes only
        run: |
          mkdir -p .tools "$PUZZLE_ROOT"
          git clone --filter=blob:none --no-checkout https://github.com/gtw123/OpusSolver.git .tools/opussolver
          git -C .tools/opussolver sparse-checkout init --no-cone
          git -C .tools/opussolver sparse-checkout set test/puzzles/24hour-1-puzzles/GEN249.puzzle
          git -C .tools/opussolver checkout "$OPUSSOLVER_COMMIT"
          cp .tools/opussolver/test/puzzles/24hour-1-puzzles/GEN249.puzzle "$PUZZLE_ROOT"/
          if find .tools/opussolver -type f -name '*.solution' | grep -q .; then exit 1; fi

      - name: Restore target-free local-delivery frontier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r artifact_id expected_digest run_id < <(python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads(Path(os.environ['ADJACENT_POINTER']).read_text()); assert p['targetSolutionBytesUsed']==0
          print(p['artifactId'],p['artifactSha256'],p['runId'])
          PY
          )
          mkdir -p "$BASELINE_ROOT"
          archive="$RUNNER_TEMP/adjacent.zip"
          curl --fail --location --retry 8 --retry-delay 2 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" -o "$archive"
          echo "$expected_digest  $archive" | sha256sum --check
          unzip -q "$archive" -d "$BASELINE_ROOT"
          python - <<'PY'
          import json,os,shutil
          from pathlib import Path
          root=Path(os.environ['BASELINE_ROOT'])
          report=json.loads((root/'GEN249.json').read_text())
          candidates=[item for item in report.get('deliveryCandidates',[]) if int((item.get('localSummary') or {}).get('productDeliveredCount') or 0)>=1]
          assert candidates, report.get('deliveryCandidateCount')
          chosen=candidates[0]
          name=Path(chosen['solutionPath']).name
          matches=list(root.rglob(name)); assert len(matches)==1, matches
          shutil.copyfile(matches[0],root/'GEN249-local-product1.solution')
          (root/'selected.json').write_text(json.dumps({'chosen':chosen,'targetSolutionBytesUsed':0},indent=2)+'\n')
          PY

      - name: Build pinned OMSim
        run: |
          git clone https://github.com/ianh/omsim.git .tools/omsim
          git -C .tools/omsim checkout "$OMSIM_COMMIT"
          make -C .tools/omsim omsim

      - name: Search one-cycle timing escape
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p "$REPORT_ROOT/timing"
          python tools/run_holdout_oracle_timing_repair.py \
            --omsim .tools/omsim/omsim \
            --puzzle "$PUZZLE_ROOT/GEN249.puzzle" \
            --baseline "$BASELINE_ROOT/GEN249-local-product1.solution" \
            --max-cycles 1600 --window 10 --max-delay 12 \
            --output-dir "$REPORT_ROOT/timing" \
            --output "$REPORT_ROOT/timing.json"

      - name: Iterate if a single timing edit is insufficient
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['REPORT_ROOT'])/'timing.json').read_text())
          Path(os.environ['REPORT_ROOT']).joinpath('single-accepted.txt').write_text('1' if r.get('acceptedProductOne') else '0')
          PY
          if [ "$(cat "$REPORT_ROOT/single-accepted.txt")" = "0" ]; then
            mkdir -p "$REPORT_ROOT/chain"
            python tools/run_holdout_oracle_timing_chain.py \
              --omsim .tools/omsim/omsim \
              --puzzle "$PUZZLE_ROOT/GEN249.puzzle" \
              --baseline "$REPORT_ROOT/timing/GEN249-best-oracle-timing.solution" \
              --depth 3 --beam-width 4 --window 10 --max-delay 12 --max-cycles 1600 \
              --output-dir "$REPORT_ROOT/chain" \
              --output "$REPORT_ROOT/chain.json"
          else
            printf '{"skipped":true,"acceptedProductOne":true}\n' > "$REPORT_ROOT/chain.json"
          fi

      - name: Promote authoritative first product if found
        run: |
          python - <<'PY'
          import json,os,shutil
          from pathlib import Path
          root=Path(os.environ['REPORT_ROOT'])
          timing=json.loads((root/'timing.json').read_text())
          chain=json.loads((root/'chain.json').read_text())
          accepted=False; source=None; oracle=None
          if timing.get('acceptedProductOne'):
              accepted=True; source=Path(timing['bestSolution']); oracle=(timing.get('best') or {}).get('omsim')
          elif chain.get('acceptedProductOne'):
              accepted=True; source=Path((chain.get('best') or {}).get('solutionPath')); oracle=(chain.get('best') or {}).get('omsim')
          if accepted:
              assert source and source.is_file(), source
              shutil.copyfile(source,root/'GEN249-omsim-product1.solution')
          payload={
            'schemaVersion':'0.1.0','kind':'heldout-final-product-timing-checkpoint',
            'runId':os.environ['GITHUB_RUN_ID'],'sourceCommit':os.environ['GITHUB_SHA'],'targetSolutionBytesUsed':0,
            'adjacentRunId':json.loads(Path(os.environ['ADJACENT_POINTER']).read_text()).get('runId'),
            'selectedLocalDelivery':json.loads((Path(os.environ['BASELINE_ROOT'])/'selected.json').read_text()).get('chosen'),
            'timing':{
              'request':timing.get('request'),'baselineOMSim':timing.get('baselineOMSim'),
              'physicalPhaseProgramIndices':timing.get('physicalPhaseProgramIndices'),
              'searchedVariantCount':timing.get('searchedVariantCount'),'precursorPreservingCount':timing.get('precursorPreservingCount'),
              'oracleAdvancingCount':timing.get('oracleAdvancingCount'),'best':timing.get('best'),'acceptedProductOne':timing.get('acceptedProductOne'),
            },
            'chain':{
              'skipped':chain.get('skipped',False),'request':chain.get('request'),'generations':chain.get('generations'),
              'best':chain.get('best'),'acceptedProductOne':chain.get('acceptedProductOne',False),
            },
            'acceptedProductOne':accepted,'acceptedSolution':str(root/'GEN249-omsim-product1.solution') if accepted else None,
            'acceptedOMSim':oracle,'omsimCommit':os.environ['OMSIM_COMMIT'],
          }
          out=Path(os.environ['LATEST_REPORT']); out.parent.mkdir(parents=True,exist_ok=True); out.write_text(json.dumps(payload,indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LATEST_REPORT"
          git commit -m "Update blind final product timing checkpoint [skip ci]" || true
          git fetch origin feature/critelli-2026-public-corpus
          git rebase origin/feature/critelli-2026-public-corpus
          git push origin HEAD:feature/critelli-2026-public-corpus

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heldout-final-product-timing-${{ github.run_id }}
          path: ${{ env.REPORT_ROOT }}/
          if-no-files-found: error
          retention-days: 14

      - name: Finalize run pointer
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUN_POINTER'])
          if not p.exists(): raise SystemExit(0)
          d=json.loads(p.read_text()); d['status']='completed'; d['conclusion']=os.environ.get('JOB_STATUS','unknown'); p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RUN_POINTER"
          git commit -m "Finalize blind final product timing [skip ci]" || true
          git fetch origin feature/critelli-2026-public-corpus
          git rebase origin/feature/critelli-2026-public-corpus
          git push origin HEAD:feature/critelli-2026-public-corpus
