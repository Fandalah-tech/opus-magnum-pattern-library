name: Temporary Paint 318 validator bootstrap

on:
  push:
    branches:
      - tmp/paint-318-validator

permissions:
  contents: read

jobs:
  build-omsim:
    runs-on: ubuntu-latest
    steps:
      - name: Clone and build OMSim
        run: |
          git clone --depth 1 https://github.com/ianh/omsim.git omsim-src
          make -C omsim-src omsim libverify.so
          sha256sum omsim-src/omsim omsim-src/libverify.so
      - name: Upload OMSim build and source
        uses: actions/upload-artifact@v4
        with:
          name: omsim-linux-source-build
          path: |
            omsim-src/omsim
            omsim-src/libverify.so
            omsim-src/*.c
            omsim-src/*.h
            omsim-src/Makefile
            omsim-src/README
          retention-days: 1
