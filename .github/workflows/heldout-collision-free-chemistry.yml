name: Blind GEN249 collision-free chemistry rebuild

on:
  push:
    branches: [feature/critelli-2026-public-corpus]
    paths:
      - .github/workflows/heldout-collision-free-chemistry.yml
      - tools/run_holdout_mechanical_first_chemistry.py
      - packages/opus_solver/additive_purification_search.py
      - packages/opus_solver/product_delivery.py
      - reports/generated/heldout-24hour-seed/latest-collision-phase-neutralization.json
      - packages/opus_engine/**
      - packages/opus_analysis/**
  workflow_dispatch:

concurrency:
  group: heldout-gen249-collision-free-chemistry-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  NEUTRAL_POINTER: reports/generated/heldout-24hour-seed/latest-collision-phase-neutralization.json
  RUN_POINTER: reports/generated/heldout-24hour-seed/latest-collision-free-chemistry-run.json
  LATEST_REPORT: reports/generated/heldout-24hour-seed/latest-collision-free-chemistry.json
  PUZZLE_ROOT: .datasets/heldout-collision-free-chemistry
  BASELINE_ROOT: .baseline/heldout-collision-free-chemistry
  REPORT_ROOT: reports/heldout-collision-free-chemistry
  OPUSSOLVER_COMMIT: fdedd3f01a238b941ceba8bace7ea35cbd3b8c41
  OMSIM_COMMIT: 758f4a4b4c9e24f50294801da774a0960c922bab

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Publish running pointer
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUN_POINTER']); p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps({'schemaVersion':'0.1.0','kind':'heldout-collision-free-chemistry-run-pointer','runId':os.environ['GITHUB_RUN_ID'],'status':'in_progress','sourceCommit':os.environ['GITHUB_SHA'],'targetSolutionBytesUsed':0},indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RUN_POINTER"; git commit -m "Record running blind collision-free chemistry rebuild [skip ci]"
          git fetch origin feature/critelli-2026-public-corpus; git rebase origin/feature/critelli-2026-public-corpus; git push origin HEAD:feature/critelli-2026-public-corpus

      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Fetch puzzle and restore collision-free neutralized machine
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir -p .tools "$PUZZLE_ROOT" "$BASELINE_ROOT"
          git clone --filter=blob:none --no-checkout https://github.com/gtw123/OpusSolver.git .tools/opussolver
          git -C .tools/opussolver sparse-checkout init --no-cone
          git -C .tools/opussolver sparse-checkout set test/puzzles/24hour-1-puzzles/GEN249.puzzle
          git -C .tools/opussolver checkout "$OPUSSOLVER_COMMIT"
          cp .tools/opussolver/test/puzzles/24hour-1-puzzles/GEN249.puzzle "$PUZZLE_ROOT"/
          if find .tools/opussolver -type f -name '*.solution' | grep -q .; then exit 1; fi
          read -r run_id solution_path < <(python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads(Path(os.environ['NEUTRAL_POINTER']).read_text()); assert p['targetSolutionBytesUsed']==0
          candidates=[x for x in p.get('topVariants',[]) if (x.get('omsim') or {}).get('collisionCycle') is None and 'cycle limit' in str((x.get('omsim') or {}).get('output','')).lower()]
          assert candidates, p.get('topVariants',[])[:3]
          print('32275128535',candidates[0]['solutionPath'])
          PY
          )
          meta="$RUNNER_TEMP/neutral.json"; gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" > "$meta"
          read -r artifact_id digest < <(python - "$meta" "$run_id" <<'PY'
          import json,sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text()); name=f'heldout-collision-phase-neutralization-{sys.argv[2]}'; m=[x for x in d['artifacts'] if x['name']==name and not x['expired']]; assert len(m)==1; print(m[0]['id'],str(m[0]['digest']).split(':',1)[1])
          PY
          )
          archive="$RUNNER_TEMP/neutral.zip"
          curl --fail --location -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" -o "$archive"
          echo "$digest  $archive" | sha256sum --check
          unzip -q "$archive" -d "$BASELINE_ROOT"
          name="$(basename "$solution_path")"; source="$(find "$BASELINE_ROOT" -type f -name "$name" | head -1)"; test -s "$source"
          cp "$source" "$BASELINE_ROOT/GEN249-collision-free.solution"

      - name: Build pinned OMSim
        run: |
          git clone https://github.com/ianh/omsim.git .tools/omsim
          git -C .tools/omsim checkout "$OMSIM_COMMIT"
          make -C .tools/omsim omsim

      - name: Rebuild full metal ladder on collision-free mechanics
        env: {PYTHONPATH: "${{ github.workspace }}"}
        run: |
          mkdir -p "$REPORT_ROOT/search"
          python tools/run_holdout_mechanical_first_chemistry.py \
            --omsim .tools/omsim/omsim --puzzle "$PUZZLE_ROOT/GEN249.puzzle" \
            --baseline "$BASELINE_ROOT/GEN249-collision-free.solution" \
            --depth 8 --beam-width 4 --variants-per-state 12 --max-cycles 1600 \
            --output-dir "$REPORT_ROOT/search" --output "$REPORT_ROOT/GEN249.json"

      - name: Persist result
        run: |
          cp "$REPORT_ROOT/GEN249.json" "$LATEST_REPORT"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LATEST_REPORT"; git commit -m "Update blind collision-free chemistry checkpoint [skip ci]" || true
          git fetch origin feature/critelli-2026-public-corpus; git rebase origin/feature/critelli-2026-public-corpus; git push origin HEAD:feature/critelli-2026-public-corpus

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heldout-collision-free-chemistry-${{ github.run_id }}
          path: ${{ env.REPORT_ROOT }}/
          if-no-files-found: error
          retention-days: 14

      - name: Finalize pointer
        if: always()
        env: {JOB_STATUS: "${{ job.status }}"}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUN_POINTER']);
          if not p.exists(): raise SystemExit(0)
          d=json.loads(p.read_text()); d['status']='completed'; d['conclusion']=os.environ.get('JOB_STATUS'); p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RUN_POINTER"; git commit -m "Finalize blind collision-free chemistry rebuild [skip ci]" || true
          git fetch origin feature/critelli-2026-public-corpus; git rebase origin/feature/critelli-2026-public-corpus; git push origin HEAD:feature/critelli-2026-public-corpus
