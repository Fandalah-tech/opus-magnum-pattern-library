name: Inspect Aqueous V5 Artifact

on:
  push:
    branches:
      - feature/aqueous-dagger-fragment-planner-final
    paths:
      - .github/workflows/inspect-aqueous-v5-artifact.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  ARTIFACT_ID: "9015995565"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aqueous-dagger-fragment-planner-final
      - name: Download completed v5 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H "Accept: application/vnd.github+json" \
            /repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip > /tmp/v5.zip
          mkdir -p /tmp/v5
          unzip -q /tmp/v5.zip -d /tmp/v5
      - name: Materialize inspection report
        run: |
          mkdir -p reports/aqueous-v5-inspection
          python - <<'PY'
          import base64, json, shutil
          from pathlib import Path
          from packages.opus_parser import parse_solution_bytes
          src=Path('/tmp/v5')
          out=Path('reports/aqueous-v5-inspection')
          found={p.name:p for p in src.rglob('*') if p.is_file()}
          for name in ['results.json','checkpoint.json','attempted.txt','expanded.txt']:
              if name in found:
                  shutil.copy2(found[name], out/name)
          summary={}
          for name in ['results.json','checkpoint.json']:
              p=found.get(name)
              if p:
                  d=json.loads(p.read_text())
                  summary[name]={k:d.get(k) for k in ['state','bestCycles','tested','valid','attemptedMechanisms','validMechanisms','expandedParents','frontier','timeouts']}
                  summary[name]['history']=(d.get('history') or [])[-20:]
                  summary[name]['top']=d.get('top') or d.get('topSolutions') or []
          (out/'summary.json').write_text(json.dumps(summary,indent=2))

          seed_b64=Path('fixtures/weeklies2026/aqueous-dagger-27c-single-reference.solution.b64')
          model=parse_solution_bytes(base64.b64decode(seed_b64.read_text().strip()), source_name='seed27.solution')
          parts=[]
          for i,p in enumerate(model.get('parts') or []):
              parts.append({
                  'index': i,
                  'type': p.get('type'),
                  'position': p.get('position'),
                  'length': p.get('length'),
                  'rotation': p.get('rotation'),
                  'which': p.get('which'),
                  'armNumber': p.get('armNumber'),
                  'trackHexes': p.get('trackHexes'),
                  'program': p.get('program') or [],
              })
          seed_report={'metrics':model.get('metrics'),'puzzleFile':model.get('puzzleFile'),'parts':parts}
          (out/'seed-structure.json').write_text(json.dumps(seed_report,indent=2))
          print(json.dumps(seed_report,indent=2))
          PY
      - name: Commit inspection data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/aqueous-v5-inspection
          git diff --cached --quiet && exit 0
          git commit -m "Record Aqueous 27c seed structure"
          git push origin HEAD:feature/aqueous-dagger-fragment-planner-final
