name: Viewer visual smoke test

on:
  push:
    branches: [main]
    paths:
      - "viewer.html"
      - "library.html"
      - "data/viewer-demo-payload.json"
      - "data/viewer-arm-gallery-payload.json"
      - "data/viewer-piece-gallery-payload.json"
      - "data/viewer-io-gallery-payload.json"
      - "assets/js/pair-library.js"
      - "assets/js/viewer-pair-library.js"
      - "assets/js/opus-geometry.js"
      - "assets/js/opus-piece-symbols.js"
      - "assets/js/opus-renderer-core.js"
      - "assets/js/static-arm-fidelity.js"
      - "assets/js/solution-viewer.js"
      - "assets/js/opus-viewer-runtime.js"
      - "assets/js/viewer-app.js"
      - "assets/js/output-product-preview.js"
      - "assets/js/replay-controls.js"
      - "assets/js/replay-arm-animation.js"
      - "assets/js/replay-molecules.js"
      - "assets/css/solution-viewer.css"
      - ".github/workflows/viewer-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viewer-visual-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium
      - name: Run standalone viewer fixtures
        run: |
          mkdir -p reports/visual/viewer-smoke
          python -m http.server 8765 >/tmp/viewer-http.log 2>&1 &
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          out = Path('reports/visual/viewer-smoke')
          demo_payload = Path('data/viewer-demo-payload.json').read_text(encoding='utf-8')
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={'width': 1500, 'height': 960}, device_scale_factor=1)
              errors = []
              page.on('pageerror', lambda exc: errors.append(str(exc)))

              # Physical replay fixture.
              page.goto('http://127.0.0.1:8765/viewer.html?fixture=demo', wait_until='networkidle', timeout=120000)
              page.wait_for_function("document.body.dataset.viewerDemoReady === 'true'", timeout=30000)
              page.wait_for_selector('#solution-viewer [data-part-id="arm-main"]')
              page.wait_for_selector('#solution-viewer [data-part-id="arm-six"]')
              page.wait_for_selector('#solution-viewer [data-atom-id="atom-salt"]', state='attached')
              page.wait_for_timeout(240)
              assert page.locator('#viewer-metric-area').inner_text() == '18'
              assert page.locator('[data-replay-range]').get_attribute('max') == '3'
              atom = page.locator('#solution-viewer [data-atom-id="atom-salt"] .replay-atom-core')
              arm_shaft = page.locator('#solution-viewer [data-part-id="arm-main"] [data-arm-shaft="0"]')
              initial_atom = (float(atom.get_attribute('cx')), float(atom.get_attribute('cy')))
              initial_tip = (float(arm_shaft.get_attribute('x2')), float(arm_shaft.get_attribute('y2')))
              page.locator('#solution-viewer').screenshot(path=str(out / '00-initial.png'))

              page.locator('[data-replay-next]').click(); page.wait_for_timeout(260)
              assert 'Cycle 1' in page.locator('[data-replay-cycle]').inner_text()
              cycle1_atom = (float(atom.get_attribute('cx')), float(atom.get_attribute('cy')))
              assert abs(cycle1_atom[0] - initial_atom[0]) + abs(cycle1_atom[1] - initial_atom[1]) > 80
              page.locator('#solution-viewer').screenshot(path=str(out / '01-cycle-1.png'))

              page.locator('[data-replay-next]').click(); page.wait_for_timeout(260)
              assert 'Cycle 2' in page.locator('[data-replay-cycle]').inner_text()
              cycle2_tip = (float(arm_shaft.get_attribute('x2')), float(arm_shaft.get_attribute('y2')))
              assert abs(cycle2_tip[0] - initial_tip[0]) + abs(cycle2_tip[1] - initial_tip[1]) > 50
              page.locator('#solution-viewer').screenshot(path=str(out / '02-cycle-2.png'))

              page.locator('[data-replay-next]').click(); page.wait_for_timeout(260)
              assert 'Cycle 3' in page.locator('[data-replay-cycle]').inner_text()
              page.locator('#solution-viewer').screenshot(path=str(out / '03-cycle-3.png'))

              # Canonical static arm-family fixture.
              page.goto('http://127.0.0.1:8765/viewer.html?fixture=arms', wait_until='networkidle', timeout=120000)
              page.wait_for_function("document.body.dataset.viewerDemoReady === 'true'", timeout=30000)
              expected = {
                  'gallery-arm1': 1,
                  'gallery-arm2': 2,
                  'gallery-arm3': 3,
                  'gallery-arm6': 6,
                  'gallery-baron': 6,
                  'gallery-piston': 1,
              }
              for part_id, branch_count in expected.items():
                  group = page.locator(f'#solution-viewer [data-part-id="{part_id}"]')
                  assert int(group.get_attribute('data-branch-count')) == branch_count
                  assert group.locator('[data-arm-shaft]').count() == branch_count
                  assert group.locator('[data-arm-tip]').count() == branch_count
              piston = page.locator('#solution-viewer [data-part-id="gallery-piston"]')
              assert piston.locator('[data-piston-sleeve]').count() == 1
              assert piston.locator('[data-piston-rod]').count() == 1
              page.locator('#solution-viewer').screenshot(path=str(out / '10-arm-family.png'))

              # Canonical stations/glyphs/track fixture.
              page.goto('http://127.0.0.1:8765/viewer.html?fixture=pieces', wait_until='networkidle', timeout=120000)
              page.wait_for_function("document.body.dataset.viewerDemoReady === 'true'", timeout=30000)
              footprint_cells = {
                  'piece-input': 1,
                  'piece-output': 1,
                  'piece-output-repeat': 1,
                  'piece-bonder': 2,
                  'piece-unbonder': 2,
                  'piece-multibonder': 4,
                  'piece-calcification': 1,
                  'piece-equilibrium': 1,
                  'piece-disposal': 7,
                  'piece-projection': 2,
                  'piece-purification': 3,
                  'piece-duplication': 2,
                  'piece-life-death': 2,
                  'piece-marker': 1,
                  'piece-prisma-bonder': 3,
                  'piece-prisma-unbonder': 3,
                  'piece-conduit': 1,
              }
              for part_id, cell_count in footprint_cells.items():
                  group = page.locator(f'#solution-viewer [data-part-id="{part_id}"]')
                  assert group.count() == 1
                  assert group.locator('.viewer-piece-footprint > polygon').count() == cell_count * 2
                  assert group.locator('title').count() == 1
              specialized = [
                  'piece-multibonder','piece-equilibrium','piece-disposal','piece-projection',
                  'piece-purification','piece-duplication','piece-life-death',
                  'piece-prisma-bonder','piece-prisma-unbonder'
              ]
              for part_id in specialized:
                  group = page.locator(f'#solution-viewer [data-part-id="{part_id}"]')
                  assert group.locator(':scope > text').count() == 0
                  assert group.locator(':scope > path, :scope > line, :scope > circle').count() > 0
              track = page.locator('#solution-viewer [data-part-id="piece-track"]')
              assert track.get_attribute('data-part-kind') == 'track'
              assert track.locator('.viewer-track-rail').count() == 1
              assert track.locator(':scope > circle').count() == 4
              page.locator('#solution-viewer').screenshot(path=str(out / '20-piece-gallery.png'))

              # Reagent/product molecule previews.
              page.goto('http://127.0.0.1:8765/viewer.html?fixture=io', wait_until='networkidle', timeout=120000)
              page.wait_for_function("document.body.dataset.viewerDemoReady === 'true'", timeout=30000)
              input_group = page.locator('#solution-viewer [data-part-id="io-input"]')
              output_group = page.locator('#solution-viewer [data-part-id="io-output"]')
              assert input_group.locator('[data-input-preview]').count() == 1
              assert output_group.locator('[data-output-preview]').count() == 1
              assert input_group.locator('.viewer-input-atom-core').count() == 2
              assert output_group.locator('.viewer-output-atom-core').count() == 3
              assert input_group.locator('.viewer-input-bond-normal').count() == 1
              assert output_group.locator('.viewer-output-bond-normal').count() == 1
              assert output_group.locator('.viewer-output-bond-triplex').count() == 1
              page.locator('#solution-viewer').screenshot(path=str(out / '25-io-molecule-previews.png'))

              # Browser-private Library -> Viewer bridge.
              page.goto('http://127.0.0.1:8765/viewer.html', wait_until='networkidle', timeout=120000)
              pair_id = page.evaluate("""async () => {
                const puzzle = new File(['fixture puzzle'], 'local-fixture.puzzle', {type:'application/octet-stream'});
                const solution = new File(['fixture solution'], 'local-fixture.solution', {type:'application/octet-stream'});
                const record = await window.OpusPairLibrary.save(puzzle, solution, 'Local Viewer Fixture');
                return record.id;
              }""")
              page.goto('http://127.0.0.1:8765/library.html', wait_until='networkidle', timeout=120000)
              page.wait_for_selector('#local-rows .viewer-link')
              local_row = page.locator('#local-rows tr').filter(has_text='Local Viewer Fixture')
              assert local_row.count() == 1
              href = local_row.locator('.viewer-link').get_attribute('href')
              assert 'viewer.html?pair=' in href

              page.route('**/api/v1/analyze', lambda route: route.fulfill(status=200, content_type='application/json', body=demo_payload))
              page.goto(f'http://127.0.0.1:8765/viewer.html?pair={pair_id}', wait_until='networkidle', timeout=120000)
              page.wait_for_selector('#viewer-result:not([hidden])', timeout=30000)
              page.wait_for_function("document.querySelector('#viewer-solution-title').textContent === 'Renderer Demo Machine'", timeout=30000)
              assert page.locator('#viewer-saved-pair').input_value() == pair_id
              page.screenshot(path=str(out / '30-library-viewer-bridge.png'), full_page=True)

              if errors:
                  raise AssertionError('Browser errors: ' + ' | '.join(errors))
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-smoke-${{ github.run_id }}
          path: reports/visual/viewer-smoke/
          if-no-files-found: error
          retention-days: 14
