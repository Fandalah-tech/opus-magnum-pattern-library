name: Blind GEN249 first product delivery

on:
  push:
    branches: [feature/critelli-2026-public-corpus]
    paths:
      - .github/workflows/heldout-product-delivery.yml
      - packages/opus_solver/product_delivery.py
      - packages/opus_solver/output_placement.py
      - tests/test_product_delivery.py
      - tests/test_output_placement.py
      - tools/probe_holdout_product_delivery.py
      - reports/generated/heldout-24hour-seed/latest-intermediate-convergence.json
      - packages/opus_engine/**
      - packages/opus_analysis/**
  workflow_dispatch:

concurrency:
  group: heldout-gen249-product-delivery-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  GOLD_POINTER: reports/generated/heldout-24hour-seed/latest-intermediate-convergence.json
  RUN_POINTER: reports/generated/heldout-24hour-seed/latest-product-delivery-run.json
  LATEST_REPORT: reports/generated/heldout-24hour-seed/latest-product-delivery.json
  PUZZLE_ROOT: .datasets/heldout-product-delivery
  BASELINE_ROOT: .baseline/heldout-product-delivery
  REPORT_ROOT: reports/heldout-product-delivery
  OPUSSOLVER_COMMIT: fdedd3f01a238b941ceba8bace7ea35cbd3b8c41
  OMSIM_COMMIT: 758f4a4b4c9e24f50294801da774a0960c922bab

jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Publish running pointer
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUN_POINTER'])
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({
              'schemaVersion': '0.2.0',
              'kind': 'heldout-product-delivery-run-pointer',
              'runId': os.environ['GITHUB_RUN_ID'],
              'runNumber': os.environ['GITHUB_RUN_NUMBER'],
              'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'status': 'in_progress',
              'sourceCommit': os.environ['GITHUB_SHA'],
              'targetSolutionBytesUsed': 0,
          }, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RUN_POINTER"
          git commit -m "Record running blind product delivery workflow [skip ci]"
          git fetch origin feature/critelli-2026-public-corpus
          git rebase origin/feature/critelli-2026-public-corpus
          git push origin HEAD:feature/critelli-2026-public-corpus

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test product delivery synthesis
        run: python -m unittest tests.test_output_placement tests.test_product_delivery -v

      - name: Fetch GEN249 puzzle bytes only
        run: |
          mkdir -p .tools "$PUZZLE_ROOT"
          git clone --filter=blob:none --no-checkout https://github.com/gtw123/OpusSolver.git .tools/opussolver
          git -C .tools/opussolver sparse-checkout init --no-cone
          git -C .tools/opussolver sparse-checkout set test/puzzles/24hour-1-puzzles/GEN249.puzzle
          git -C .tools/opussolver checkout "$OPUSSOLVER_COMMIT"
          cp .tools/opussolver/test/puzzles/24hour-1-puzzles/GEN249.puzzle "$PUZZLE_ROOT"/
          test "$(find "$PUZZLE_ROOT" -maxdepth 1 -name '*.puzzle' | wc -l)" -eq 1
          if find .tools/opussolver -type f -name '*.solution' | grep -q .; then
            echo "Target solution bytes unexpectedly materialized" >&2
            exit 1
          fi

      - name: Restore target-free first-gold frontier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path(os.environ['GOLD_POINTER']).read_text())
          assert p['targetSolutionBytesUsed']==0 and p['summary']['goldReached'] is True
          print(p['runId'])
          PY
          )"
          meta="$RUNNER_TEMP/gold.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" > "$meta"
          read -r artifact_id digest < <(python - "$meta" "$run_id" <<'PY'
          import json,sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text()); name=f'heldout-intermediate-convergence-{sys.argv[2]}'
          m=[x for x in d['artifacts'] if x['name']==name and not x['expired']]; assert len(m)==1
          print(m[0]['id'], str(m[0]['digest']).split(':',1)[1])
          PY
          )
          mkdir -p "$BASELINE_ROOT"
          archive="$RUNNER_TEMP/gold.zip"
          curl --fail --location --retry 8 --retry-delay 2 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" -o "$archive"
          echo "$digest  $archive" | sha256sum --check
          unzip -q "$archive" -d "$BASELINE_ROOT"
          test -s "$BASELINE_ROOT/GEN249-first-gold.solution"

      - name: Search local first-product deliveries
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p "$REPORT_ROOT/candidates"
          python tools/probe_holdout_product_delivery.py \
            --puzzle "$PUZZLE_ROOT/GEN249.puzzle" \
            --baseline-solution "$BASELINE_ROOT/GEN249-first-gold.solution" \
            --max-cycles 500 --opportunity-limit 80 --result-limit 24 \
            --candidate-dir "$REPORT_ROOT/candidates" \
            --solution-output "$REPORT_ROOT/GEN249-best-local-delivery.solution" \
            --output "$REPORT_ROOT/GEN249.json"

      - name: Persist local diagnostic
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads((Path(os.environ['REPORT_ROOT'])/'GEN249.json').read_text())
          gold=json.loads(Path(os.environ['GOLD_POINTER']).read_text())
          Path(os.environ['LATEST_REPORT']).write_text(json.dumps({
            'schemaVersion':'0.2.0','kind':'heldout-product-delivery-checkpoint',
            'runId':os.environ['GITHUB_RUN_ID'],'sourceCommit':os.environ['GITHUB_SHA'],'phase':'local-search',
            'goldRunId':gold['runId'],'targetSolutionBytesUsed':0,'target':report['targetPuzzle'],
            'request':report['request'],'summary':report['summary'],'baseline':report['baseline'],
            'opportunities':report['opportunities'],'bestLocalVariant':(report['variants'] or [None])[0],'omsim':None,
          },indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LATEST_REPORT"
          git commit -m "Update blind local product delivery checkpoint [skip ci]" || true
          git fetch origin feature/critelli-2026-public-corpus
          git rebase origin/feature/critelli-2026-public-corpus
          git push origin HEAD:feature/critelli-2026-public-corpus

      - name: Require local delivery
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['REPORT_ROOT'])/'GEN249.json').read_text())
          assert r['targetSolutionBytesUsed']==0
          assert r['summary']['hasDelivery'] is True, r['summary']
          assert int(r['summary']['bestProductDeliveredCount'])>=1
          assert r['candidateOutputs']
          PY

      - name: Build pinned OMSim
        run: |
          git clone https://github.com/ianh/omsim.git .tools/omsim
          git -C .tools/omsim checkout "$OMSIM_COMMIT"
          make -C .tools/omsim omsim

      - name: Prove one product with OMSim
        run: |
          set -euo pipefail
          attempts="$REPORT_ROOT/omsim-attempts.json"; printf '[]\n' > "$attempts"
          accepted=""; accepted_metric=""
          for solution in "$REPORT_ROOT"/candidates/*.solution; do
            set +e
            output="$(.tools/omsim/omsim --puzzle-file "$PUZZLE_ROOT/GEN249.puzzle" --metric "product 1 cycles" "$solution" 2>&1)"; rc=$?
            set -e
            python - "$attempts" "$solution" "$rc" "$output" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]); d=json.loads(p.read_text()); d.append({'solution':sys.argv[2],'exitCode':int(sys.argv[3]),'output':sys.argv[4]}); p.write_text(json.dumps(d,indent=2)+'\n')
          PY
            if [ "$rc" -eq 0 ]; then accepted="$solution"; accepted_metric="$output"; break; fi
          done
          test -n "$accepted"
          cp "$accepted" "$REPORT_ROOT/GEN249-omsim-first-product.solution"
          python - "$accepted" "$accepted_metric" <<'PY'
          import json,os,re,sys
          from pathlib import Path
          m=re.search(r'product 1 cycles:\s*([0-9.]+)',sys.argv[2])
          Path(os.environ['REPORT_ROOT']).joinpath('omsim-product-1.json').write_text(json.dumps({
            'accepted':True,'solution':sys.argv[1],'metric':'product 1 cycles','metricValue':float(m.group(1)) if m else None,
            'rawOutput':sys.argv[2],'omsimCommit':os.environ['OMSIM_COMMIT'],'targetSolutionBytesUsed':0},indent=2)+'\n')
          PY

      - name: Promote authoritative checkpoint
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['LATEST_REPORT']); d=json.loads(p.read_text()); d['schemaVersion']='0.3.0'; d['phase']='omsim-product-1'; d['omsim']=json.loads((Path(os.environ['REPORT_ROOT'])/'omsim-product-1.json').read_text()); p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          rp=Path(os.environ['RUN_POINTER']); r=json.loads(rp.read_text()); r['status']='completed'; r['conclusion']='success'; rp.write_text(json.dumps(r,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LATEST_REPORT" "$RUN_POINTER"
          git commit -m "Promote blind first-product checkpoint [skip ci]" || true
          git fetch origin feature/critelli-2026-public-corpus
          git rebase origin/feature/critelli-2026-public-corpus
          git push origin HEAD:feature/critelli-2026-public-corpus

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heldout-product-delivery-${{ github.run_id }}
          path: ${{ env.REPORT_ROOT }}/
          if-no-files-found: error
          retention-days: 14
