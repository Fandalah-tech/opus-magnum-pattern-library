name: Critelli canonical analysis

on:
  push:
    branches:
      - feature/disjoint-solver-readiness
    paths:
      - "database/critelli-public-events.manifest.json"
      - "tools/analyze_critelli_manifest.py"
      - "tests/test_analyze_critelli_manifest.py"
      - ".github/workflows/critelli-analyze.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/disjoint-solver-readiness
          fetch-depth: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test analysis engine
        run: python -m pip install pytest && python -m pytest -q tests/test_analyze_critelli_manifest.py

      - name: Analyze canonical Critelli manifest
        if: ${{ hashFiles('database/critelli-public-events.manifest.json') != '' }}
        run: python tools/analyze_critelli_manifest.py

      - name: Commit analysis report
        if: ${{ hashFiles('reports/critelli-analysis.json') != '' }}
        run: |
          git config user.name "codex-catalog-bot"
          git config user.email "codex-catalog-bot@users.noreply.github.com"
          git add reports/critelli-analysis.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Critelli canonical analysis"
          git pull --rebase origin feature/disjoint-solver-readiness
          git push origin HEAD:feature/disjoint-solver-readiness
