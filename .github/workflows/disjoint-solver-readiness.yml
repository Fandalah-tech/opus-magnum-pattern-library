name: Validate disjoint solver readiness

on:
  push:
    branches:
      - feature/disjoint-solver-readiness
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip pytest
      - name: Run disjoint and Rotor solver tests
        run: |
          python -m pytest \
            tests/test_engine_disjoint.py \
            tests/test_disjoint_product_plan.py \
            tests/test_solver_explorer.py \
            tests/test_rotor_recipe.py \
            tests/test_rotor_blueprint.py \
            tests/test_rotor_schedule.py \
            tests/test_rotor_layout.py \
            tests/test_rotor_corpus.py \
            tests/test_rotor_seed_fixture.py \
            tests/test_rotor_trace.py \
            tests/test_rotor_macros.py \
            tests/test_rotor_template.py \
            tests/test_rotor_prefix.py \
            -q
      - name: Search compact Rotor continuation
        timeout-minutes: 3
        run: python tools/search_rotor_continuation.py
      - name: Report corrected Rotor prefix state
        if: always()
        run: python tools/report_rotor_prefix.py
      - name: Report learned Rotor macro structure
        if: always()
        run: python tools/report_rotor_macros.py
