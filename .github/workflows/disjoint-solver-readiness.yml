name: Validate disjoint solver readiness

on:
  push:
    branches:
      - feature/disjoint-solver-readiness
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip pytest
      - name: Run disjoint and solver tests
        run: |
          python -m pytest \
            tests/test_engine_disjoint.py \
            tests/test_disjoint_product_plan.py \
            tests/test_solver_explorer.py \
            -q
