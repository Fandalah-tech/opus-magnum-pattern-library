name: Blind GEN249 silver-pair finish

on:
  push:
    branches: [feature/critelli-2026-public-corpus]
    paths:
      - .github/workflows/heldout-silver-pair-finish.yml
      - tools/run_holdout_oracle_timing_chain.py
      - tools/probe_holdout_product_delivery.py
      - packages/opus_solver/product_delivery.py
      - reports/generated/heldout-24hour-seed/latest-mechanical-first-chemistry.json
      - packages/opus_analysis/**
      - packages/opus_engine/**
  workflow_dispatch:

concurrency:
  group: heldout-gen249-silver-pair-finish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  CHEMISTRY_POINTER: reports/generated/heldout-24hour-seed/latest-mechanical-first-chemistry.json
  PUZZLE_ROOT: .datasets/heldout-silver-pair-finish
  BASELINE_ROOT: .baseline/heldout-silver-pair-finish
  REPORT_ROOT: reports/heldout-silver-pair-finish
  LATEST_REPORT: reports/generated/heldout-24hour-seed/latest-silver-pair-finish.json
  OPUSSOLVER_COMMIT: fdedd3f01a238b941ceba8bace7ea35cbd3b8c41
  OMSIM_COMMIT: 758f4a4b4c9e24f50294801da774a0960c922bab

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch GEN249 puzzle bytes only
        run: |
          mkdir -p .tools "$PUZZLE_ROOT"
          git clone --filter=blob:none --no-checkout https://github.com/gtw123/OpusSolver.git .tools/opussolver
          git -C .tools/opussolver sparse-checkout init --no-cone
          git -C .tools/opussolver sparse-checkout set test/puzzles/24hour-1-puzzles/GEN249.puzzle
          git -C .tools/opussolver checkout "$OPUSSOLVER_COMMIT"
          cp .tools/opussolver/test/puzzles/24hour-1-puzzles/GEN249.puzzle "$PUZZLE_ROOT"/
          if find .tools/opussolver -type f -name '*.solution' | grep -q .; then
            echo "Target solution bytes unexpectedly materialized" >&2
            exit 1
          fi

      - name: Restore target-free official silver-pair frontier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r run_id recorded_path < <(python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads(Path(os.environ['CHEMISTRY_POINTER']).read_text())
          assert p['targetSolutionBytesUsed']==0
          best=p['bestChemistry']
          assert int((best.get('reachableCounts') or {}).get('silver',0))>=2, best
          print(p['runId'], best['solutionPath'])
          PY
          )
          meta="$RUNNER_TEMP/chemistry.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" > "$meta"
          read -r artifact_id digest < <(python - "$meta" "$run_id" <<'PY'
          import json,sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text()); name=f'heldout-mechanical-first-chemistry-{sys.argv[2]}'; m=[x for x in d['artifacts'] if x['name']==name and not x['expired']]; assert len(m)==1; print(m[0]['id'],str(m[0]['digest']).split(':',1)[1])
          PY
          )
          mkdir -p "$BASELINE_ROOT"
          archive="$RUNNER_TEMP/chemistry.zip"
          curl --fail --location --retry 8 --retry-delay 2 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" -o "$archive"
          echo "$digest  $archive" | sha256sum --check
          unzip -q "$archive" -d "$BASELINE_ROOT"
          name="$(basename "$recorded_path")"
          source="$(find "$BASELINE_ROOT" -type f -name "$name" | head -1)"
          test -s "$source"
          cp "$source" "$BASELINE_ROOT/GEN249-silver-pair.solution"

      - name: Build pinned OMSim
        run: |
          git clone https://github.com/ianh/omsim.git .tools/omsim
          git -C .tools/omsim checkout "$OMSIM_COMMIT"
          make -C .tools/omsim omsim
          test -x .tools/omsim/omsim

      - name: Push the official collision past the existing gold event
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p "$REPORT_ROOT/timing"
          python tools/run_holdout_oracle_timing_chain.py \
            --omsim .tools/omsim/omsim \
            --puzzle "$PUZZLE_ROOT/GEN249.puzzle" \
            --baseline "$BASELINE_ROOT/GEN249-silver-pair.solution" \
            --depth 4 --beam-width 4 --window 10 --max-delay 12 --max-cycles 1500 \
            --output-dir "$REPORT_ROOT/timing" \
            --output "$REPORT_ROOT/timing.json"

      - name: Search product placement if gold is officially reachable
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['REPORT_ROOT'])/'timing.json').read_text())
          counts=(r.get('best') or {}).get('reachableCounts') or {}
          Path(os.environ['REPORT_ROOT']).joinpath('gold-reachable.txt').write_text('1' if int(counts.get('gold',0))>=1 else '0')
          PY
          if [ "$(cat "$REPORT_ROOT/gold-reachable.txt")" = "1" ]; then
            mkdir -p "$REPORT_ROOT/delivery-candidates"
            python tools/probe_holdout_product_delivery.py \
              --puzzle "$PUZZLE_ROOT/GEN249.puzzle" \
              --baseline-solution "$REPORT_ROOT/timing/GEN249-best-oracle-timing-chain.solution" \
              --max-cycles 1500 --opportunity-limit 120 --result-limit 24 \
              --candidate-dir "$REPORT_ROOT/delivery-candidates" \
              --solution-output "$REPORT_ROOT/GEN249-best-local-delivery.solution" \
              --output "$REPORT_ROOT/delivery.json"
          else
            printf '{"skipped":true,"reason":"gold-not-officially-reachable"}\n' > "$REPORT_ROOT/delivery.json"
          fi

      - name: OMSim prove first product across delivery candidates
        run: |
          set -euo pipefail
          accepted=""
          if compgen -G "$REPORT_ROOT/delivery-candidates/*.solution" > /dev/null; then
            for solution in "$REPORT_ROOT"/delivery-candidates/*.solution; do
              set +e
              output="$(.tools/omsim/omsim --puzzle-file "$PUZZLE_ROOT/GEN249.puzzle" --metric "product 1 cycles" "$solution" 2>&1)"; rc=$?
              set -e
              if [ "$rc" -eq 0 ]; then
                accepted="$solution"; printf '%s\n' "$output" > "$REPORT_ROOT/accepted-omsim.txt"; break
              fi
            done
          fi
          if [ -n "$accepted" ]; then cp "$accepted" "$REPORT_ROOT/GEN249-omsim-product1.solution"; fi
          printf '%s\n' "$accepted" > "$REPORT_ROOT/accepted-path.txt"

      - name: Persist compact silver-pair finish checkpoint
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          root=Path(os.environ['REPORT_ROOT'])
          timing=json.loads((root/'timing.json').read_text())
          delivery=json.loads((root/'delivery.json').read_text())
          accepted=(root/'accepted-path.txt').read_text().strip()
          raw=(root/'accepted-omsim.txt').read_text().strip() if (root/'accepted-omsim.txt').exists() else ''
          match=re.search(r'product 1 cycles:\s*([0-9.]+)',raw)
          payload={
            'schemaVersion':'0.1.0','kind':'heldout-silver-pair-finish-checkpoint',
            'runId':os.environ['GITHUB_RUN_ID'],'sourceCommit':os.environ['GITHUB_SHA'],'targetSolutionBytesUsed':0,
            'chemistryRunId':json.loads(Path(os.environ['CHEMISTRY_POINTER']).read_text()).get('runId'),
            'timingRequest':timing.get('request'),'timingInitial':timing.get('initial'),'timingGenerations':timing.get('generations'),
            'timingBest':timing.get('best'),'reachableSilverPair':timing.get('reachableSilverPair'),
            'goldOfficiallyReachable':int(((timing.get('best') or {}).get('reachableCounts') or {}).get('gold',0))>=1,
            'deliverySummary':delivery.get('summary') if isinstance(delivery,dict) else None,
            'acceptedProductOne':bool(accepted),'acceptedSolution':accepted or None,
            'omsimProduct1Cycles':float(match.group(1)) if match else None,'omsimRawOutput':raw or None,
            'omsimCommit':os.environ['OMSIM_COMMIT'],
          }
          out=Path(os.environ['LATEST_REPORT']); out.parent.mkdir(parents=True,exist_ok=True); out.write_text(json.dumps(payload,indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LATEST_REPORT"
          git commit -m "Update blind silver-pair finish checkpoint [skip ci]" || true
          git fetch origin feature/critelli-2026-public-corpus
          git rebase origin/feature/critelli-2026-public-corpus
          git push origin HEAD:feature/critelli-2026-public-corpus

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heldout-silver-pair-finish-${{ github.run_id }}
          path: ${{ env.REPORT_ROOT }}/
          if-no-files-found: error
          retention-days: 14
