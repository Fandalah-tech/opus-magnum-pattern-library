name: Blind GEN249 mechanical-first chemistry rebuild

on:
  push:
    branches: [feature/critelli-2026-public-corpus]
    paths:
      - .github/workflows/heldout-mechanical-first-chemistry.yml
      - tools/run_holdout_mechanical_first_chemistry.py
      - reports/generated/heldout-24hour-seed/latest-oracle-timing-chain.json
      - packages/opus_solver/additive_purification_search.py
      - packages/opus_solver/product_delivery.py
      - packages/opus_solver/reaction_station_synthesis.py
      - packages/opus_engine/**
      - packages/opus_analysis/**
  workflow_dispatch:

concurrency:
  group: heldout-gen249-mechanical-first-chemistry-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  TIMING_CHAIN_POINTER: reports/generated/heldout-24hour-seed/latest-oracle-timing-chain.json
  PUZZLE_ROOT: .datasets/heldout-mechanical-first-chemistry
  BASELINE_ROOT: .baseline/heldout-mechanical-first-chemistry
  REPORT_ROOT: reports/heldout-mechanical-first-chemistry
  LATEST_REPORT: reports/generated/heldout-24hour-seed/latest-mechanical-first-chemistry.json
  OPUSSOLVER_COMMIT: fdedd3f01a238b941ceba8bace7ea35cbd3b8c41
  OMSIM_COMMIT: 758f4a4b4c9e24f50294801da774a0960c922bab

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch GEN249 puzzle bytes only
        run: |
          mkdir -p .tools "$PUZZLE_ROOT"
          git clone --filter=blob:none --no-checkout https://github.com/gtw123/OpusSolver.git .tools/opussolver
          git -C .tools/opussolver sparse-checkout init --no-cone
          git -C .tools/opussolver sparse-checkout set test/puzzles/24hour-1-puzzles/GEN249.puzzle
          git -C .tools/opussolver checkout "$OPUSSOLVER_COMMIT"
          cp .tools/opussolver/test/puzzles/24hour-1-puzzles/GEN249.puzzle "$PUZZLE_ROOT"/
          if find .tools/opussolver -type f -name '*.solution' | grep -q .; then exit 1; fi

      - name: Restore target-free timing-chain artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads(Path(os.environ['TIMING_CHAIN_POINTER']).read_text()); assert p['targetSolutionBytesUsed']==0; print(p['runId'])
          PY
          )"
          meta="$RUNNER_TEMP/timing-chain.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" > "$meta"
          read -r artifact_id digest < <(python - "$meta" "$run_id" <<'PY'
          import json,sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text()); name=f'heldout-oracle-timing-chain-{sys.argv[2]}'; m=[x for x in d['artifacts'] if x['name']==name and not x['expired']]; assert len(m)==1; print(m[0]['id'],str(m[0]['digest']).split(':',1)[1])
          PY
          )
          mkdir -p "$BASELINE_ROOT"
          archive="$RUNNER_TEMP/timing-chain.zip"
          curl --fail --location --retry 8 --retry-delay 2 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" -o "$archive"
          echo "$digest  $archive" | sha256sum --check
          unzip -q "$archive" -d "$BASELINE_ROOT"
          test -s "$BASELINE_ROOT/GEN249.json"

      - name: Select longest-lived chemistry-empty mechanical seed
        run: |
          python - <<'PY'
          import json,os,shutil
          from pathlib import Path
          root=Path(os.environ['BASELINE_ROOT'])
          report=json.loads((root/'GEN249.json').read_text())
          candidates=[]
          for generation in report.get('generations',[]):
              for item in generation.get('variants',[]):
                  if int((item.get('purificationProfile') or {}).get('count') or 0)!=0:
                      continue
                  progress=int((item.get('omsim') or {}).get('progressCycle') or 0)
                  path=Path(str(item.get('solutionPath') or ''))
                  candidates.append((progress,path,item))
          assert candidates, 'No chemistry-empty mechanical candidate found'
          progress,path,item=max(candidates,key=lambda value:value[0])
          prefix=Path('reports/heldout-oracle-timing-chain')
          relative=path.relative_to(prefix) if path.is_relative_to(prefix) else Path('search')/path.name
          source=root/relative
          assert source.is_file(), (source, path)
          target=root/'GEN249-mechanical-seed.solution'
          shutil.copyfile(source,target)
          (root/'selected-seed.json').write_text(json.dumps({
              'sourceSolutionPath':str(path),'artifactRelativePath':str(relative),'omsim':item.get('omsim'),
              'purificationProfile':item.get('purificationProfile'),'targetSolutionBytesUsed':0,
          },indent=2)+'\n')
          print(json.dumps({'selectedProgressCycle':progress,'source':str(source)}))
          PY

      - name: Build pinned OMSim
        run: |
          git clone https://github.com/ianh/omsim.git .tools/omsim
          git -C .tools/omsim checkout "$OMSIM_COMMIT"
          make -C .tools/omsim omsim

      - name: Rebuild chemistry on official long-lived machine
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p "$REPORT_ROOT/search"
          python tools/run_holdout_mechanical_first_chemistry.py \
            --omsim .tools/omsim/omsim \
            --puzzle "$PUZZLE_ROOT/GEN249.puzzle" \
            --baseline "$BASELINE_ROOT/GEN249-mechanical-seed.solution" \
            --depth 7 --beam-width 3 --variants-per-state 8 --max-cycles 1200 \
            --output-dir "$REPORT_ROOT/search" \
            --output "$REPORT_ROOT/GEN249.json"

      - name: Persist compact mechanical-first checkpoint
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads((Path(os.environ['REPORT_ROOT'])/'GEN249.json').read_text())
          seed=json.loads((Path(os.environ['BASELINE_ROOT'])/'selected-seed.json').read_text())
          payload={
            'schemaVersion':'0.1.0','kind':'heldout-mechanical-first-chemistry-checkpoint',
            'runId':os.environ['GITHUB_RUN_ID'],'sourceCommit':os.environ['GITHUB_SHA'],'targetSolutionBytesUsed':0,
            'timingChainRunId':json.loads(Path(os.environ['TIMING_CHAIN_POINTER']).read_text()).get('runId'),
            'selectedSeed':seed,'request':report.get('request'),'initial':report.get('initial'),'generations':report.get('generations'),
            'visitedStateCount':report.get('visitedStateCount'),'bestChemistry':report.get('bestChemistry'),
            'goldReachedBeforeOracleFailure':report.get('goldReachedBeforeOracleFailure'),
            'deliveryCandidateCount':report.get('deliveryCandidateCount'),'topDeliveryCandidates':report.get('topDeliveryCandidates'),
            'acceptedProductOne':report.get('acceptedProductOne'),'acceptedSolution':report.get('acceptedSolution'),'omsimCommit':os.environ['OMSIM_COMMIT'],
          }
          out=Path(os.environ['LATEST_REPORT']); out.parent.mkdir(parents=True,exist_ok=True); out.write_text(json.dumps(payload,indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LATEST_REPORT"
          git commit -m "Update blind mechanical-first chemistry checkpoint [skip ci]" || true
          git fetch origin feature/critelli-2026-public-corpus
          git rebase origin/feature/critelli-2026-public-corpus
          git push origin HEAD:feature/critelli-2026-public-corpus

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heldout-mechanical-first-chemistry-${{ github.run_id }}
          path: ${{ env.REPORT_ROOT }}/
          retention-days: 14
