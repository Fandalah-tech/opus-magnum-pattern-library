name: Blind Paint Preserver solver probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blind-solve:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore historical solver corpus cache
        uses: actions/cache@v4
        with:
          path: |
            .datasets/solution-archive
            .datasets/archive-campaign-reference
            .blind/fragment-index.json
            .blind/fragment-flow-index.json
          key: paint-preserver-blind-historical-corpus-v1

      - name: Download official puzzle only
        shell: bash
        run: |
          mkdir -p .blind reports
          python - <<'PY'
          import base64
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen

          page = 'https://events.critelli.technology/OM2026Weeklies7_PaintPreserver'
          filename = 'weeklies2026_paint-preserver.puzzle'

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() != 'a':
                      return
                  attrs = dict(attrs)
                  if attrs.get('href'):
                      self.hrefs.append(attrs['href'])

          req = Request(page, headers={'User-Agent': 'opus-magnum-pattern-library blind solver probe'})
          html = urlopen(req, timeout=30).read().decode('utf-8', errors='replace')
          parser = Links(); parser.feed(html)

          data_uri = next((h for h in parser.hrefs if h.startswith('data:application/octet-stream;base64,')), None)
          if data_uri:
              data = base64.b64decode(data_uri.split(',', 1)[1], validate=True)
              source = 'embedded data URI on official event page'
          else:
              matches = [h for h in parser.hrefs if filename in h]
              if not matches:
                  raise SystemExit(f'Puzzle payload not found on official page; links={parser.hrefs!r}')
              puzzle_url = urljoin(page, matches[0])
              data = urlopen(Request(puzzle_url, headers={'User-Agent': 'opus-magnum-pattern-library blind solver probe'}), timeout=30).read()
              source = puzzle_url

          out = Path('.blind') / filename
          out.write_bytes(data)
          print(f'Downloaded official puzzle only: {source} -> {out} ({len(data)} bytes)')
          PY

      - name: Preflight current solver support
        id: preflight
        shell: bash
        run: |
          PYTHONPATH=. python - <<'PY'
          import json, os
          from pathlib import Path
          from packages.opus_parser import parse_puzzle
          from packages.opus_solver.manufacturing import build_manufacturing_plan

          puzzle = parse_puzzle(Path('.blind/weeklies2026_paint-preserver.puzzle'))
          plan = build_manufacturing_plan(puzzle)
          payload = {
              'puzzleName': puzzle.get('name'),
              'reagentCount': len(puzzle.get('reagents') or []),
              'productCount': len(puzzle.get('products') or []),
              'productAtomCounts': [len(x.get('atoms') or []) for x in (puzzle.get('products') or [])],
              'strategy': plan.strategy,
              'supported': plan.supported,
              'reason': plan.reason,
              'operationCount': len(plan.operations),
          }
          Path('reports/paint-preserver-blind-preflight.json').write_text(json.dumps(payload, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')
          print(json.dumps(payload, sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"supported={'true' if plan.supported else 'false'}\n")
          if not plan.supported:
              report = {
                  'schemaVersion': 'blind-preflight-v1',
                  'plan': plan.to_dict(),
                  'summary': {
                      'supported': False,
                      'hasCompleteSolution': False,
                      'assemblyCandidateCount': 0,
                      'engineCompleteCount': 0,
                      'temporalVariantCount': 0,
                      'temporalCompleteCount': 0,
                      'geometricVariantCount': 0,
                      'geometricCompleteCount': 0,
                      'failureModes': {'unsupported-manufacturing-plan': 1},
                      'repairRoutes': {},
                  },
                  'candidates': [],
              }
              Path('reports/paint-preserver-blind.json').write_text(json.dumps(report, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')
          PY

      - name: Rebuild historical general corpus
        if: steps.preflight.outputs.supported == 'true'
        shell: bash
        run: |
          python tools/import_om_solution_archive.py --root .datasets/solution-archive
          python tools/import_campaign_corpus.py --root .datasets/archive-campaign-reference --puzzles-only
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          index = json.loads(Path('.datasets/solution-archive/index.json').read_text(encoding='utf-8'))
          suspicious = []
          for item in index.get('solutions', []):
              haystack = ' '.join(str(v) for v in item.values()).lower().replace('_','-')
              if 'paint-preserver' in haystack or 'paint preserver' in haystack:
                  suspicious.append(item)
          if suspicious:
              raise SystemExit(f'Blindness guard failed: Paint Preserver records found in historical corpus: {suspicious[:3]!r}')
          print(f"Blindness guard: historical archive contains {len(index.get('solutions', []))} solutions and zero Paint Preserver records")
          PY

      - name: Build generic solver indexes from historical corpus
        if: steps.preflight.outputs.supported == 'true'
        shell: bash
        run: |
          if [[ ! -s .blind/fragment-index.json ]]; then
            PYTHONPATH=. python tools/build_fragment_index.py \
              --archive-root .datasets/solution-archive \
              --puzzle-root .datasets/archive-campaign-reference \
              --output .blind/fragment-index.json
          fi
          if [[ ! -s .blind/fragment-flow-index.json ]]; then
            PYTHONPATH=. python tools/build_fragment_flow_index.py \
              --archive-root .datasets/solution-archive \
              --puzzle-root .datasets/archive-campaign-reference \
              --output .blind/fragment-flow-index.json
          fi

      - name: Run current generic solver blind
        id: solver
        if: steps.preflight.outputs.supported == 'true'
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python tools/generate_composed_candidates.py \
            .blind/weeklies2026_paint-preserver.puzzle \
            --flow-index .blind/fragment-flow-index.json \
            --fragment-index .blind/fragment-index.json \
            --limit 250 \
            --temporal-radius 3 \
            --temporal-variants 500 \
            --temporal-results 25 \
            --transform-variants 5000 \
            --transform-per-slot 5 \
            --transform-results 25 \
            --report reports/paint-preserver-blind.json \
            --write-best reports/paint-preserver-blind.solution \
            --outcome-index reports/paint-preserver-blind-outcomes.json \
            > reports/paint-preserver-blind-stdout.txt 2> reports/paint-preserver-blind-stderr.txt
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarize blind result
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = Path('reports/paint-preserver-blind.json')
          lines = []
          if not report.exists():
              lines.append('report_missing=true')
          else:
              data = json.loads(report.read_text(encoding='utf-8'))
              s = data.get('summary', {})
              plan = data.get('plan', {})
              lines.extend([
                  f"supported={s.get('supported')}",
                  f"hasCompleteSolution={s.get('hasCompleteSolution')}",
                  f"strategy={plan.get('strategy')}",
                  f"reason={plan.get('reason')}",
                  f"assemblyCandidateCount={s.get('assemblyCandidateCount')}",
                  f"engineCompleteCount={s.get('engineCompleteCount')}",
                  f"temporalVariantCount={s.get('temporalVariantCount')}",
                  f"temporalCompleteCount={s.get('temporalCompleteCount')}",
                  f"geometricVariantCount={s.get('geometricVariantCount')}",
                  f"geometricCompleteCount={s.get('geometricCompleteCount')}",
                  f"failureModes={json.dumps(s.get('failureModes', {}), sort_keys=True)}",
              ])
          Path('reports/paint-preserver-blind-summary.txt').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          print('\n'.join(lines))
          PY

      - name: Upload blind solver artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paint-preserver-blind-solver
          path: |
            reports/paint-preserver-blind*
          if-no-files-found: warn

      - name: Preserve solver exit status
        if: steps.preflight.outputs.supported == 'true' && steps.solver.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "Solver CLI exited with code ${{ steps.solver.outputs.exit_code }}"
          exit 1
