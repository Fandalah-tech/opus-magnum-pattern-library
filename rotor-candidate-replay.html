<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Replay OMSIM — Rotor</title><style>
:root{color-scheme:dark;--bg:#100f0d;--panel:#1b1814;--line:#3a342b;--text:#eee4d3;--muted:#a99d8b;--accent:#d4a35a;--solver:#79a9d1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}main{width:min(1180px,calc(100% - 28px));margin:auto;padding:28px 0 60px}h1{margin:0 0 8px;font:700 42px Georgia,serif}p{color:var(--muted)}.warning{color:#e6b36c}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0}.controls button,.controls select{background:#211d18;color:var(--text);border:1px solid var(--line);padding:10px 14px;cursor:pointer}.controls input{flex:1;min-width:180px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}.board,.side{border:1px solid var(--line);background:var(--panel)}.side{padding:18px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.metric{border:1px solid var(--line);padding:10px}.metric small{display:block;color:var(--muted)}.metric strong{font-size:21px;color:var(--accent)}.segment{display:inline-block;border:1px solid var(--line);padding:5px 8px;color:var(--muted);font-size:12px}.segment.solver{border-color:var(--solver);color:#b9ddfb}.action{white-space:pre-wrap;background:#0b0a09;border:1px solid var(--line);padding:12px;min-height:90px}svg{width:100%;height:650px;display:block}.grid{fill:#080706}.bond{stroke:#e7d6bb;stroke-width:7;stroke-linecap:round}.arm{stroke:#bc8e4f;stroke-width:8;stroke-linecap:round}.origin{fill:#5f4a2e;stroke:#d4a35a;stroke-width:2}.tip{fill:#d4a35a}.atom{stroke:#f5ead9;stroke-width:2}.salt{fill:#d9d4c7}.water{fill:#73a9c8}.label{fill:#191714;font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:middle}@media(max-width:850px){.layout{grid-template-columns:1fr}svg{height:520px}}
</style></head><body><main><h1>Replay du candidat OMSIM — score 599</h1><p class="warning">Le fichier publié peut contenir le segment solver seul ou la timeline complète, selon le dernier run local réussi.</p><div class="controls"><button id="start">Début</button><button id="solver-start">Début du solver</button><button id="prev">◀</button><button id="play">Lecture</button><button id="next">▶</button><select id="mode"><option value="all">Séquence complète</option><option value="solver">Solver seulement</option></select><input id="slider" type="range" min="0" max="0" value="0"><span id="position">—</span></div><div class="layout"><section class="board"><svg id="svg" viewBox="0 0 820 650"></svg></section><aside class="side"><span id="segment" class="segment">—</span><div class="metrics"><div class="metric"><small>Cycle</small><strong id="cycle">—</strong></div><div class="metric"><small>Score</small><strong id="score">—</strong></div><div class="metric"><small>Étape</small><strong id="step">—</strong></div></div><h3>Actions</h3><pre id="action" class="action">Chargement…</pre><p id="status"></p></aside></div></main><script>
const DATA='https://raw.githubusercontent.com/Fandalah-tech/opus-magnum-pattern-library/feature/disjoint-solver-readiness/reports/rotor-tail-best-candidate-replay.json';
const $=id=>document.getElementById(id),svg=$('svg'),slider=$('slider'),mode=$('mode'),play=$('play');let data,index=0,timer;
const NS='http://www.w3.org/2000/svg',node=(n,a={})=>{const x=document.createElementNS(NS,n);for(const[k,v]of Object.entries(a))x.setAttribute(k,v);return x},xy=([q,r])=>[410+q*58+r*29,340-r*50];
function normalize(raw){const frames=(raw.frames||[]).filter(f=>f&&f.state);if(!frames.length)throw Error('Aucune image valide dans le replay');const full=Number.isInteger(raw.solverStartIndex)&&raw.solverStartIndex>=0&&raw.solverStartIndex<frames.length;return{...raw,frames,solverStartIndex:full?raw.solverStartIndex:0,solverEndIndex:Number.isInteger(raw.solverEndIndex)?Math.min(raw.solverEndIndex,frames.length-1):frames.length-1,solverActionCount:Number.isInteger(raw.solverActionCount)?raw.solverActionCount:Math.max(0,frames.length-1),isFullTimeline:full&&raw.solverStartIndex>0}}
function bounds(){return mode.value==='solver'?[data.solverStartIndex,data.solverEndIndex]:[0,data.frames.length-1]}function stop(){clearInterval(timer);timer=null;play.textContent='Lecture'}
function render(){const f=data.frames[index],s=f.state,solver=index>=data.solverStartIndex;svg.replaceChildren();for(let q=-8;q<=8;q++)for(let r=-8;r<=8;r++){const[x,y]=xy([q,r]);svg.append(node('circle',{cx:x,cy:y,r:3,class:'grid'}))}for(const b of s.bonds||[]){const[a,b1]=[xy(b.aPosition),xy(b.bPosition)];svg.append(node('line',{x1:a[0],y1:a[1],x2:b1[0],y2:b1[1],class:'bond'}))}for(const arm of Object.values(s.arms||{})){const o=xy(arm.origin);for(const t of arm.tips||[]){const p=xy(t.position);svg.append(node('line',{x1:o[0],y1:o[1],x2:p[0],y2:p[1],class:'arm'}),node('circle',{cx:p[0],cy:p[1],r:7,class:'tip'}))}svg.append(node('circle',{cx:o[0],cy:o[1],r:14,class:'origin'}))}for(const a of s.atoms||[]){const p=xy(a.position),c=node('circle',{cx:p[0],cy:p[1],r:19,class:`atom ${a.element}`}),t=node('text',{x:p[0],y:p[1],class:'label'});t.textContent=a.element==='salt'?'S':'W';svg.append(c,t)}$('cycle').textContent=s.cycle??'—';$('score').textContent=s.score??'—';$('step').textContent=solver?`${Math.max(0,index-data.solverStartIndex)}/${data.solverActionCount}`:`${index}/${data.solverStartIndex}`;$('position').textContent=`Image ${index+1} / ${data.frames.length}`;$('action').textContent=index===0?(data.isFullTimeline?'État initial avant le préfixe':'Premier état publié : début du segment solver'):JSON.stringify(f.action||{},null,2);$('segment').textContent=solver?'Segment solver':'Préfixe humain';$('segment').className=`segment${solver?' solver':''}`;slider.value=index}
function move(n){const[min,max]=bounds();index=Math.max(min,Math.min(max,n));render()}$('start').onclick=()=>{stop();mode.value='all';move(0)};$('solver-start').onclick=()=>{stop();mode.value='solver';move(data.solverStartIndex)};$('prev').onclick=()=>move(index-1);$('next').onclick=()=>move(index+1);slider.oninput=()=>{stop();index=+slider.value;render()};mode.onchange=()=>{stop();move(bounds()[0])};play.onclick=()=>{if(timer)return stop();const[min,max]=bounds();if(index>=max)move(min);play.textContent='Pause';timer=setInterval(()=>index>=bounds()[1]?stop():move(index+1),500)};
fetch(DATA+'?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`Replay indisponible (${r.status})`);return r.json()}).then(raw=>{data=normalize(raw);slider.max=data.frames.length-1;$('status').textContent=data.isFullTimeline?`${data.frames.length} images chargées · timeline complète.`:`${data.frames.length} images chargées · le dernier run n’a publié que le segment solver.`;render()}).catch(e=>$('status').textContent=e.message);
</script></body></html>
