<!doctype html>
<html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Replay OMSIM — score 599</title><style>
:root{color-scheme:dark;--bg:#100f0d;--panel:#1b1814;--line:#3a342b;--text:#eee4d3;--muted:#a99d8b;--accent:#d4a35a;--solver:#79a9d1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}main{width:min(1180px,calc(100% - 28px));margin:auto;padding:28px 0 60px}h1{margin:0 0 8px;font:700 42px Georgia,serif}p{color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}.board,.side{border:1px solid var(--line);background:var(--panel)}.board{min-height:650px}.side{padding:18px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.metric{border:1px solid var(--line);padding:10px}.metric small{display:block;color:var(--muted)}.metric strong{font-size:22px;color:var(--accent)}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0}.controls button,.controls select{background:#211d18;color:var(--text);border:1px solid var(--line);padding:10px 14px;cursor:pointer}.controls button.active{border-color:var(--solver);color:#b9ddfb}.controls input{flex:1;min-width:180px}.timeline{position:relative;flex:1;min-width:220px}.timeline input{width:100%;margin:0}.solver-mark{position:absolute;top:-5px;width:2px;height:26px;background:var(--solver);pointer-events:none}.segment{display:inline-block;border:1px solid var(--line);padding:5px 8px;color:var(--muted);font-size:12px}.segment.solver{border-color:var(--solver);color:#b9ddfb}.action{white-space:pre-wrap;background:#0b0a09;border:1px solid var(--line);padding:12px;min-height:90px}svg{width:100%;height:650px;display:block}.gridline{stroke:#2a261f;stroke-width:1}.bond{stroke:#e7d6bb;stroke-width:7;stroke-linecap:round}.arm{stroke:#bc8e4f;stroke-width:8;stroke-linecap:round}.origin{fill:#5f4a2e;stroke:#d4a35a;stroke-width:2}.atom{stroke:#f5ead9;stroke-width:2}.salt{fill:#d9d4c7}.water{fill:#73a9c8}.label{fill:#191714;font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:middle}.tip{fill:#d4a35a}.warning{color:#e6b36c}@media(max-width:850px){.layout{grid-template-columns:1fr}.board,svg{min-height:520px;height:520px}}
</style></head><body><main><h1>Replay du candidat OMSIM — score 599</h1><p class="warning">Séquence complète : préfixe humain, puis 19 actions développées par le solver. Ce n’est pas une solution validée ni livrée.</p><div class="controls"><button id="start">Début</button><button id="solver-start">Début du solver</button><button id="prev">◀</button><button id="play">Lecture</button><button id="next">▶</button><select id="mode" aria-label="Plage de lecture"><option value="all">Séquence complète</option><option value="solver">Solver seulement</option></select><div class="timeline"><input id="slider" type="range" min="0" max="0" value="0"><span id="solver-mark" class="solver-mark" hidden></span></div><span id="position">—</span></div><div class="layout"><section class="board"><svg id="svg" viewBox="0 0 820 650" aria-label="État OMSIM"></svg></section><aside class="side"><span id="segment" class="segment">—</span><div class="metrics"><div class="metric"><small>Cycle</small><strong id="cycle">—</strong></div><div class="metric"><small>Score</small><strong id="score">—</strong></div><div class="metric"><small>Étape</small><strong id="step">—</strong></div></div><h3>Actions</h3><pre id="action" class="action">Chargement…</pre><p id="status"></p></aside></div></main><script>
const DATA='https://raw.githubusercontent.com/Fandalah-tech/opus-magnum-pattern-library/feature/disjoint-solver-readiness/reports/rotor-tail-best-candidate-replay.json';
const svg=document.getElementById('svg'),slider=document.getElementById('slider'),mode=document.getElementById('mode'),play=document.getElementById('play');let data=null,index=0,timer=null;
const NS='http://www.w3.org/2000/svg';function el(n,a={}){const x=document.createElementNS(NS,n);Object.entries(a).forEach(([k,v])=>x.setAttribute(k,v));return x}
function xy([q,r]){return[410+q*58+r*29,340-r*50]}
function bounds(){return mode.value==='solver'?[data.solverStartIndex,data.solverEndIndex]:[0,data.frames.length-1]}
function stop(){if(timer){clearInterval(timer);timer=null}play.textContent='Lecture'}
function render(){if(!data)return;const frame=data.frames[index],s=frame.state,solver=frame.segment==='solver'||index===data.solverStartIndex;svg.replaceChildren();for(let q=-8;q<=8;q++)for(let r=-8;r<=8;r++){const[x,y]=xy([q,r]);svg.append(el('circle',{cx:x,cy:y,r:3,class:'gridline'}))}
for(const b of s.bonds){const[aX,aY]=xy(b.aPosition),[bX,bY]=xy(b.bPosition);svg.append(el('line',{x1:aX,y1:aY,x2:bX,y2:bY,class:'bond'}))}
for(const arm of Object.values(s.arms)){const[oX,oY]=xy(arm.origin);for(const t of arm.tips){const[x,y]=xy(t.position);svg.append(el('line',{x1:oX,y1:oY,x2:x,y2:y,class:'arm'}));svg.append(el('circle',{cx:x,cy:y,r:7,class:'tip'}))}svg.append(el('circle',{cx:oX,cy:oY,r:14,class:'origin'}))}
for(const a of s.atoms){const[x,y]=xy(a.position),c=el('circle',{cx:x,cy:y,r:19,class:`atom ${a.element}`}),t=el('text',{x,y,class:'label'});t.textContent=a.element==='salt'?'S':'W';svg.append(c,t)}
document.getElementById('cycle').textContent=s.cycle;document.getElementById('score').textContent=s.score;const solverStep=Math.max(0,index-data.solverStartIndex);document.getElementById('step').textContent=solver?`${solverStep}/${data.solverActionCount}`:`${index}/${data.solverStartIndex}`;document.getElementById('position').textContent=`Image ${index+1} / ${data.frames.length}`;document.getElementById('action').textContent=index===0?'État initial avant le préfixe':index===data.solverStartIndex?'Point de prise en charge du solver':JSON.stringify(frame.action,null,2);const badge=document.getElementById('segment');badge.textContent=solver?'Segment solver':'Préfixe humain';badge.className=`segment${solver?' solver':''}`;slider.value=index}
function move(n){if(!data)return;const[min,max]=bounds();index=Math.max(min,Math.min(max,n));render()}
document.getElementById('start').addEventListener('click',()=>{stop();mode.value='all';move(0)});document.getElementById('solver-start').addEventListener('click',()=>{stop();mode.value='solver';move(data.solverStartIndex)});document.getElementById('prev').addEventListener('click',()=>move(index-1));document.getElementById('next').addEventListener('click',()=>move(index+1));slider.addEventListener('input',()=>{stop();index=+slider.value;render()});mode.addEventListener('change',()=>{stop();const[min,max]=bounds();if(index<min||index>max)move(min)});play.addEventListener('click',()=>{if(timer){stop();return}const[min,max]=bounds();if(index>=max)move(min);play.textContent='Pause';timer=setInterval(()=>{const[,end]=bounds();if(index>=end){stop()}else move(index+1)},500)});
fetch(DATA+'?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Replay non généré');return r.json()}).then(d=>{data=d;slider.max=d.frames.length-1;const pct=d.frames.length>1?d.solverStartIndex/(d.frames.length-1)*100:0;const mark=document.getElementById('solver-mark');mark.style.left=`${pct}%`;mark.hidden=false;document.getElementById('status').textContent=`${d.frames.length} images chargées · prise en charge du solver au cycle ${d.frames[d.solverStartIndex].state.cycle}.`;render()}).catch(e=>document.getElementById('status').textContent=e.message+' — la tâche de génération est peut-être encore en cours.');
</script></body></html>
