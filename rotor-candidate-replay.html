<!doctype html>
<html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Replay OMSIM — score 599</title><style>
:root{color-scheme:dark;--bg:#100f0d;--panel:#1b1814;--line:#3a342b;--text:#eee4d3;--muted:#a99d8b;--accent:#d4a35a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}main{width:min(1180px,calc(100% - 28px));margin:auto;padding:28px 0 60px}h1{margin:0 0 8px;font:700 42px Georgia,serif}p{color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}.board,.side{border:1px solid var(--line);background:var(--panel)}.board{min-height:650px}.side{padding:18px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.metric{border:1px solid var(--line);padding:10px}.metric small{display:block;color:var(--muted)}.metric strong{font-size:22px;color:var(--accent)}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0}.controls button{background:#211d18;color:var(--text);border:1px solid var(--line);padding:10px 14px;cursor:pointer}.controls input{flex:1;min-width:180px}.action{white-space:pre-wrap;background:#0b0a09;border:1px solid var(--line);padding:12px;min-height:90px}svg{width:100%;height:650px;display:block}.gridline{stroke:#2a261f;stroke-width:1}.bond{stroke:#e7d6bb;stroke-width:7;stroke-linecap:round}.arm{stroke:#bc8e4f;stroke-width:8;stroke-linecap:round}.origin{fill:#5f4a2e;stroke:#d4a35a;stroke-width:2}.atom{stroke:#f5ead9;stroke-width:2}.salt{fill:#d9d4c7}.water{fill:#73a9c8}.label{fill:#191714;font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:middle}.tip{fill:#d4a35a}.warning{color:#e6b36c}@media(max-width:850px){.layout{grid-template-columns:1fr}.board,svg{min-height:520px;height:520px}}
</style></head><body><main><h1>Replay du candidat OMSIM — score 599</h1><p class="warning">Ce replay montre le meilleur état intermédiaire trouvé; ce n’est pas une solution validée ni livrée.</p><div class="controls"><button id="prev">◀</button><button id="play">Lecture</button><button id="next">▶</button><input id="slider" type="range" min="0" max="0" value="0"><span id="position">—</span></div><div class="layout"><section class="board"><svg id="svg" viewBox="0 0 820 650" aria-label="État OMSIM"></svg></section><aside class="side"><div class="metrics"><div class="metric"><small>Cycle</small><strong id="cycle">—</strong></div><div class="metric"><small>Score</small><strong id="score">—</strong></div><div class="metric"><small>Étape</small><strong id="step">—</strong></div></div><h3>Actions</h3><pre id="action" class="action">Chargement…</pre><p id="status"></p></aside></div></main><script>
const DATA='https://raw.githubusercontent.com/Fandalah-tech/opus-magnum-pattern-library/feature/disjoint-solver-readiness/reports/rotor-tail-best-candidate-replay.json';
const svg=document.getElementById('svg'),slider=document.getElementById('slider');let data=null,index=0,timer=null;
const NS='http://www.w3.org/2000/svg';function el(n,a={}){const x=document.createElementNS(NS,n);Object.entries(a).forEach(([k,v])=>x.setAttribute(k,v));return x}
function xy([q,r]){return[410+q*58+r*29,340-r*50]}
function render(){if(!data)return;const frame=data.frames[index],s=frame.state;svg.replaceChildren();for(let q=-8;q<=8;q++)for(let r=-8;r<=8;r++){const[x,y]=xy([q,r]);const c=el('circle',{cx:x,cy:y,r:3,class:'gridline'});svg.append(c)}
for(const b of s.bonds){const[aX,aY]=xy(b.aPosition),[bX,bY]=xy(b.bPosition);svg.append(el('line',{x1:aX,y1:aY,x2:bX,y2:bY,class:'bond'}))}
for(const arm of Object.values(s.arms)){const[oX,oY]=xy(arm.origin);for(const t of arm.tips){const[x,y]=xy(t.position);svg.append(el('line',{x1:oX,y1:oY,x2:x,y2:y,class:'arm'}));svg.append(el('circle',{cx:x,cy:y,r:7,class:'tip'}))}svg.append(el('circle',{cx:oX,cy:oY,r:14,class:'origin'}))}
for(const a of s.atoms){const[x,y]=xy(a.position),c=el('circle',{cx:x,cy:y,r:19,class:`atom ${a.element}`}),t=el('text',{x,y,class:'label'});t.textContent=a.element==='salt'?'S':'W';svg.append(c,t)}
document.getElementById('cycle').textContent=s.cycle;document.getElementById('score').textContent=s.score;document.getElementById('step').textContent=`${index}/${data.frames.length-1}`;document.getElementById('position').textContent=`Image ${index+1} / ${data.frames.length}`;document.getElementById('action').textContent=index===0?'État initial après le préfixe':JSON.stringify(frame.action,null,2);slider.value=index}
function move(n){index=Math.max(0,Math.min(data.frames.length-1,n));render()}document.getElementById('prev').addEventListener('click',()=>move(index-1));document.getElementById('next').addEventListener('click',()=>move(index+1));slider.addEventListener('input',()=>move(+slider.value));document.getElementById('play').addEventListener('click',e=>{if(timer){clearInterval(timer);timer=null;e.target.textContent='Lecture'}else{e.target.textContent='Pause';timer=setInterval(()=>{if(index>=data.frames.length-1){clearInterval(timer);timer=null;e.target.textContent='Lecture'}else move(index+1)},700)}});
fetch(DATA+'?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Replay non généré');return r.json()}).then(d=>{data=d;slider.max=d.frames.length-1;document.getElementById('status').textContent=`${d.frames.length} images chargées.`;render()}).catch(e=>document.getElementById('status').textContent=e.message+' — la tâche de génération est peut-être encore en cours.');
</script></body></html>
